name: Build & deploy site

# 纯本地数据部署：不访问任何外部接口。
# 页面「⚡实时」图层读取仓库内 data/live/trains_*.json（本地时刻表，按今日运行日加载），
# 客户端按当前 JST 时间过滤渲染。数据刷新走 refresh.yml（手动）。
# GitHub Pages: Actions 方式部署（仓库 Settings→Pages→Source: GitHub Actions）。
# Cloudflare Pages: 项目 mini-japanrail-3d（仅前端 index.html+data+logos，不含 .github/scripts），
# 仓库需配置 Secret: CF_API_TOKEN（可选）。任何 push 到 main（含 refresh.yml 时刻表刷新提交）都会触发重新部署。

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # SEO：每次部署前重新生成「每线路 / 每车站」静态页、sitemap、robots、404、OG 图。
      # 生成失败不阻断部署（沿用仓库内已有文件），保证现有发布流程不受影响。
      - name: Build SEO static pages
        run: |
          cd mini-japanrail-3d && python3 seo/build_seo_static.py || echo '::warning::SEO 静态页生成失败，沿用已有文件部署'

      - name: Verify data assets
        run: |
          python3 - <<'PY'
          import json, os
          for f in ['index.html','data/segments.geojson','data/stations.geojson',
                    'data/live/tmaps.json','data/live/trains_wd.json',
                    'data/live/trains_sa.json','data/live/trains_su.json']:
              assert os.path.exists(f), 'missing: ' + f
          print('数据资产完整: 页面 + 地图 + tmaps + 三份本地时刻表')
          for n in ['wd','sa','su']:
              d = json.load(open('data/live/trains_%s.json' % n, encoding='utf-8'))
              print('trains_%s.json: %d 班次 @ %s' % (n, d['n'], d['b']))
          PY

      - name: Prepare deploy dir
        run: |
          rm -rf dist && mkdir -p dist/data
          cp index.html favicon.png dist/
          cp -r data/segments.geojson data/stations.geojson data/names_en.json dist/data/
          cp -r data/live dist/data/
          cp -r mini-japanrail-3d dist/   # Mini JapanRail 3D 子站 → /mini-japanrail-3d/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deploy Mini JapanRail 3D frontend to Cloudflare Pages
        if: ${{ env.CF_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          # 只部署前端(index.html + data + logos + SEO 静态页),不含 .github 与 scripts(Python 构建脚本)
          rm -rf cf-mj3d && mkdir -p cf-mj3d
          cp mini-japanrail-3d/index.html cf-mj3d/
          cp -r mini-japanrail-3d/data cf-mj3d/
          cp -r mini-japanrail-3d/logos cf-mj3d/
          # SEO 静态页与搜索引擎基础设施（若上一步已生成；缺文件时不阻塞部署）
          cp -r mini-japanrail-3d/lines mini-japanrail-3d/stations cf-mj3d/ || true
          cp mini-japanrail-3d/robots.txt mini-japanrail-3d/404.html mini-japanrail-3d/og-image.png mini-japanrail-3d/sitemap.xml mini-japanrail-3d/sitemap-lines.xml mini-japanrail-3d/sitemap-stations.xml mini-japanrail-3d/sitemap-pages.xml cf-mj3d/ || true
          npx wrangler@4 pages deploy cf-mj3d --project-name mini-japanrail-3d --branch main --commit-dirty=true
