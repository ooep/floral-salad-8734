name: Build & deploy site

# 纯本地数据部署：不访问任何外部接口。
# 页面「⚡实时」图层读取仓库内 data/live/trains_*.json（本地时刻表，按今日运行日加载），
# 客户端按当前 JST 时间过滤渲染。数据刷新走 refresh.yml（手动）。
# GitHub Pages: Actions 方式部署（仓库 Settings→Pages→Source: GitHub Actions）。
# Cloudflare Pages: 项目 mini-japanrail-3d（仅前端 index.html+data+logos，不含 .github/scripts），
# 仓库需配置 Secret: CF_API_TOKEN（可选）。任何 push 到 main（含 refresh.yml 时刻表刷新提交）都会触发重新部署。

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 配线图：从临时仓库 ooep/jr-trackdiagrams（public）拉取到 mini-japanrail-3d/data/，
      # 供 SEO 生成器内联（缺失时静默跳过，不影响部署）。
      - name: Fetch track diagrams (jr-trackdiagrams)
        run: |
          cd mini-japanrail-3d
          if curl -sfL -m 40 "https://github.com/ooep/jr-trackdiagrams/archive/refs/heads/main.tar.gz" -o /tmp/td.tgz; then
            rm -rf /tmp/tdx && mkdir -p /tmp/tdx && tar xzf /tmp/td.tgz -C /tmp/tdx || true
            cp -r /tmp/tdx/jr-trackdiagrams-main/wiki_trackdiagrams data/ 2>/dev/null || true
            cp /tmp/tdx/jr-trackdiagrams-main/wiki_trackdiagrams.json data/ 2>/dev/null || true
            cp -r /tmp/tdx/jr-trackdiagrams-main/line_bsdiagrams data/ 2>/dev/null || true
            cp /tmp/tdx/jr-trackdiagrams-main/line_bsdiagrams.json data/ 2>/dev/null || true
            n=$(ls data/wiki_trackdiagrams/*.svg 2>/dev/null | wc -l) || n=0
            nb=$(ls data/line_bsdiagrams/*.svg 2>/dev/null | wc -l) || nb=0
            echo "配线图 SVG 数: ${n:-0}，线路 BS 全线图: ${nb:-0}"
          else
            echo '::warning::配线图仓库拉取失败，本次部署无配线图'
          fi

      # SEO：每次部署前重新生成「每线路 / 每车站」静态页、sitemap、robots、404、OG 图。
      # 生成失败不阻断部署（沿用仓库内已有文件），保证现有发布流程不受影响。
      - name: Build SEO static pages
        run: |
          cd mini-japanrail-3d && python3 seo/build_seo_static.py || echo '::warning::SEO 静态页生成失败，沿用已有文件部署'
          rm -rf mini-japanrail-3d/data/wiki_trackdiagrams mini-japanrail-3d/data/wiki_trackdiagrams.json
          rm -rf mini-japanrail-3d/data/line_bsdiagrams mini-japanrail-3d/data/line_bsdiagrams.json

      - name: Verify data assets
        run: |
          python3 - <<'PY'
          import json, os
          for f in ['index.html','data/segments.geojson','data/stations.geojson',
                    'data/live/tmaps.json','data/live/trains_wd.json',
                    'data/live/trains_sa.json','data/live/trains_su.json']:
              assert os.path.exists(f), 'missing: ' + f
          print('数据资产完整: 页面 + 地图 + tmaps + 三份本地时刻表')
          for n in ['wd','sa','su']:
              d = json.load(open('data/live/trains_%s.json' % n, encoding='utf-8'))
              print('trains_%s.json: %d 班次 @ %s' % (n, d['n'], d['b']))
          PY

      - name: Prepare deploy dir
        run: |
          rm -rf dist && mkdir -p dist/data
          cp index.html favicon.png dist/
          cp -r data/segments.geojson data/stations.geojson data/names_en.json dist/data/
          cp -r data/live dist/data/
          cp -r mini-japanrail-3d dist/   # Mini JapanRail 子站 → /mini-japanrail-3d/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deploy Mini JapanRail frontend to Cloudflare Pages
        if: ${{ env.CF_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          # 只部署前端: 拷贝整个 mini-japanrail-3d 后剔除 scripts/(Python 构建脚本); .github 在仓库根,不在此目录
          rm -rf cf-mj3d && mkdir -p cf-mj3d
          cp -r mini-japanrail-3d/. cf-mj3d/
          rm -rf cf-mj3d/scripts
          npx wrangler@4 pages deploy cf-mj3d --project-name mini-japanrail-3d --branch main --commit-dirty=true
