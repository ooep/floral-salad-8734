name: Live trains snapshot + deploy

# 每 10 分钟抓一次 RailAround 全国实时列车快照并部署 GitHub Pages。
# 页面 (index.html) 的「⚡实时」图层读取 data/live/latest.json 插值动画，位置按 JST 当日运行日过滤。
# 合规: robots.txt 声明 Disallow:/api/ + Crawl-delay:2 → 脚本单请求、间隔 2.2s，远低于站点承受范围；
#       数据为公开计划时刻（不含实时延误）。
# Pages 上限: GitHub Pages 每仓库 10 次构建/小时 → 每 10 分钟 = 6 次/小时 ✓
# 用量提示: Public 仓库 Actions 免费不限；Private 仓库若担心 2000 分钟/月预算，把 cron 改为 '0 * * * *'（每小时一次）。

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: live-pages
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch live train snapshot
        run: python3 scripts/fetch_live.py

      - name: Commit & push snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/live/latest.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "chore(live): train snapshot $(date -u +%Y-%m-%dT%H:%M)Z"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
