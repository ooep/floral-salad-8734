name: Refresh timetables (weekly + manual)

# 唯一会访问 RailAround 的工作流。每周自动抓一次全表维护总时刻表，
# 也可手动触发（workflow_dispatch）。
# 流程: 全量抓取时刻表(fetch_timetables.py, 2.2s/请求节流) → 构建页面本地列车文件
# (build_trains.py) → 提交 → 部署 Pages。

on:
  schedule:
    - cron: '0 3 * * 0'   # 每周日 03:00 UTC = 11:00 JST
  workflow_dispatch:
    inputs:
      only:
        description: '只刷新单条线路名（留空 = 全量，约 65 分钟）'
        type: string
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-pages
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch full timetables (throttled 2.2s/request)
        run: python3 scripts/fetch_timetables.py --only "${{ github.event.inputs.only }}"

      - name: Build local train files
        run: python3 scripts/build_trains.py --src data/timetables --out data/live

      - name: Sync Mini JapanRail 3D data + contract verify
        # 契约校验不通过则 exit 1 → 后续 commit/部署中止,旧数据保持,页面不受影响
        run: python3 scripts/sync_mini_3d.py

      - name: Refresh RailAround official geometry (incremental, throttled 2.2s)
        # resume: 已缓存 rw 跳过, 通常 0 个新请求; 仅新开线才抓取(失败不阻断, 下周重试)
        run: python3 scripts/fetch_ra_geometry.py --sleep 2.2

      - name: Build station geometry map v2 (official coords + extra tracks)
        run: python3 scripts/build_station_map_v2.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/live mini-japanrail-3d/data scripts
          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "chore(data): refresh timetables $(date -u +%Y-%m-%d)"
            git fetch origin
            git rebase origin/main
            git push
          fi

      - name: Prepare deploy dir
        run: |
          rm -rf dist && mkdir -p dist/data
          cp index.html favicon.png dist/
          cp -r data/segments.geojson data/stations.geojson data/names_en.json dist/data/
          cp -r data/live dist/data/
          cp -r mini-japanrail-3d dist/   # Mini JapanRail 3D 子站 → /mini-japanrail-3d/
          # 完整性闸门: dist 缺任何关键文件 → exit 1 → 部署中止, 线上保持旧版本继续运行(不 404)
          python3 - <<'PY'
          import os
          for f in ['index.html','favicon.png','data/segments.geojson','data/stations.geojson',
                    'data/names_en.json','data/live/tmaps.json',
                    'data/live/trains_wd.json','data/live/trains_sa.json','data/live/trains_su.json',
                    'mini-japanrail-3d/index.html']:
              assert os.path.exists(f), 'dist 缺文件: ' + f
          print('dist 完整: 页面 + 数据 + 3D 子站')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deploy to Cloudflare Pages
        if: ${{ env.CF_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          npx wrangler@4 pages deploy dist --project-name floral-salad-8734 --branch main --commit-dirty=true
