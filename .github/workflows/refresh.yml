name: Refresh timetables (weekly + manual)

# 唯一会访问时刻表源的工作流。每周自动抓一次全表维护总时刻表，
# 也可手动触发（workflow_dispatch）。
# 流程: 全量抓取时刻表(fetch_timetables.py, 2.2s/请求节流) → 构建页面本地列车文件
# (build_trains.py) → 提交 → 由 push 触发的 deploy.yml 统一完成部署
# （静态 Worker jr-static 与 Pages 均在其内重建，含新数据）。

on:
  schedule:
    - cron: '0 3 * * 0'   # 每周日 03:00 UTC = 11:00 JST
  workflow_dispatch:
    inputs:
      only:
        description: '只刷新单条线路名（留空 = 全量，约 65 分钟）'
        type: string
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-pages
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch full timetables (throttled 2.2s/request)
        run: python3 scripts/fetch_timetables.py --only "${{ github.event.inputs.only }}"

      - name: Build local train files
        run: python3 scripts/build_trains.py --src data/timetables --out data/live

      - name: Sync Mini JapanRail data + contract verify
        # 契约校验不通过则 exit 1 → 后续 commit/部署中止,旧数据保持,页面不受影响
        run: python3 scripts/sync_mini_3d.py

      - name: Build journey planner data (RAPTOR)
        # 由同步后的 tmaps/trains_{wd,sa,su} 生成 data/journey/(stations/lines/tmaps/trips/transfers)
        # 失败不阻断: journey 页会回退到上一次提交的数据(旧数据仍自洽)
        run: python3 mini-japanrail-3d/scripts/build_journey_data.py || echo '::warning::journey 数据构建失败,沿用旧数据'

      - name: Refresh official geometry (incremental, throttled 2.2s)
        # resume: 已缓存 rw 跳过, 通常 0 个新请求; 仅新开线才抓取(失败不阻断, 下周重试)
        run: python3 scripts/fetch_ra_geometry.py --sleep 2.2

      - name: Build station geometry map v2 (official coords + extra tracks)
        run: python3 scripts/build_station_map_v2.py

      - name: Commit refreshed data
        # 提交后 push 触发 deploy.yml：重新生成 SEO、重建并部署静态 Worker、部署 Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/live mini-japanrail-3d/data scripts
          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "chore(data): refresh timetables $(date -u +%Y-%m-%d)"
            git fetch origin
            git rebase origin/main
            git push
          fi
