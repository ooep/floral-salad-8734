name: Probe BS-map structure (manual)

# 结构探测：抓词条 wikitext 确认 {{BS-map}}/{{BS-table}} 模板代码结构（BSicon 散件拼装），
# 供本地开发 BS 渲染抓取脚本。手动触发，几分钟完成。
#
# 加密（2026-11）：探测脚本入库即密文（encrypted/*.enc），运行时经 prep.sh
# 先验后写解密、用毕 clean。钥匙来自 Secret: CODE_KEY。YAML 本身无法加密。

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: seo-probe-bs
  cancel-in-progress: false

jobs:
  probe-bs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Step 1/3 verify ciphertext (verify-only, zero writes)
        env:
          OOEP_PASSPHRASE: ${{ secrets.CODE_KEY }}
        run: bash encryption/logrun.sh 1/3 bash encryption/prep.sh 1

      - name: Step 2/3 materialize fetchers
        env:
          OOEP_PASSPHRASE: ${{ secrets.CODE_KEY }}
        run: bash encryption/logrun.sh 2/3 bash encryption/prep.sh 2

      - name: Step 3/3 Probe BS-map wikitext structure
        env:
          OOEP_PASSPHRASE: ${{ secrets.CODE_KEY }}
        run: bash encryption/logrun.sh 3/3 python3 mini-japanrail-3d/seo/probe_bs.py

      - name: Finalize (cleanup + worktree assertion)
        if: always()
        run: bash encryption/finalize.sh
