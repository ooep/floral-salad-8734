name: Probe Wikimedia structure (manual)

# 一次性/可复用结构探测：验证分类枚举、词条 images、intitle 搜索、文件名探测四条路径。
# 手动触发，几分钟完成；输出原始 API 响应到日志，供本地决定正式抓取脚本策略。
#
# 加密（2026-11）：探测脚本入库即密文（encrypted/*.enc），运行时经 prep.sh
# 先验后写解密、用毕 clean。钥匙来自 Secret: CODE_KEY。YAML 本身无法加密。
# 日志经 logrun.sh 形态脱敏（URL/域名 → 占位符）。

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: seo-probe-wiki
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Step 1/3 verify ciphertext (verify-only, zero writes)
        env:
          OOEP_PASSPHRASE: ${{ secrets.CODE_KEY }}
        run: bash encryption/logrun.sh 1/3 bash encryption/prep.sh 1

      - name: Step 2/3 materialize fetchers
        env:
          OOEP_PASSPHRASE: ${{ secrets.CODE_KEY }}
        run: bash encryption/logrun.sh 2/3 bash encryption/prep.sh 2

      - name: Step 3/3 Probe Wikimedia Commons API
        env:
          OOEP_PASSPHRASE: ${{ secrets.CODE_KEY }}
        run: bash encryption/logrun.sh 3/3 python3 mini-japanrail-3d/seo/probe_wiki.py

      - name: Finalize (cleanup + worktree assertion)
        if: always()
        run: bash encryption/finalize.sh
