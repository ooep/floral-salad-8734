name: Probe Wikimedia structure (manual)

# 一次性/可复用结构探测：验证分类枚举、词条 images、intitle 搜索、文件名探测四条路径。
# 手动触发，几分钟完成；输出原始 API 响应到日志，供本地决定正式抓取脚本策略。

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: seo-probe-wiki
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Probe Wikimedia Commons API
        run: |
          cd mini-japanrail-3d
          python3 seo/probe_wiki.py
