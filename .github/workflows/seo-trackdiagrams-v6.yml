name: Fetch line BS diagrams (V6)

# V6 线路级 BS 全线配线图：抓 ja 维基线路词条 {{BS-table}}/{{BS-map}} 模板代码 → 本地渲染 SVG。
# 手动触发；可用 --titles 指定词条小批验证，或 --limit-lines N。
# 产物同步到 ooep/jr-trackdiagrams（line_bsdiagrams/）。
#
# 加密（2026-11）：抓取脚本入库即密文（encrypted/*.enc），运行时经 prep.sh
# 先验后写解密、用毕 clean。钥匙来自 Secret: CODE_KEY。YAML 本身无法加密。
# 注入面收敛：inputs 一律经 env: 中转，不再直插 run:；--titles 在脚本内按
# 已知线路词条白名单过滤，--limit-lines 强制整数解析。

on:
  workflow_dispatch:
    inputs:
      titles:
        description: '调试：指定词条（逗号分隔，如 海峡線,山手線）'
        required: false
        type: string
      limit_lines:
        description: '限制处理条数（留空=全量）'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: seo-trackdiagrams-v6
  cancel-in-progress: false

jobs:
  fetch-bs:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Step 1/3 verify ciphertext (verify-only, zero writes)
        env:
          OOEP_PASSPHRASE: ${{ secrets.CODE_KEY }}
        run: bash encryption/logrun.sh 1/3 bash encryption/prep.sh 1

      - name: Step 2/3 materialize fetchers
        env:
          OOEP_PASSPHRASE: ${{ secrets.CODE_KEY }}
        run: bash encryption/logrun.sh 2/3 bash encryption/prep.sh 2

      - name: Step 3/3 Fetch & render line BS diagrams
        env:
          OOEP_PASSPHRASE: ${{ secrets.CODE_KEY }}
          TITLES: ${{ github.event.inputs.titles }}
          LIMIT_LINES: ${{ github.event.inputs.limit_lines }}
        run: bash encryption/logrun.sh 3/3 bash ci/step.sh tdv6 3

      - name: Remove plaintext fetchers
        run: python3 encryption/decrypt.py clean --out .

      - name: Sync line_bsdiagrams to ooep/jr-trackdiagrams
        env:
          TD_TOKEN: ${{ secrets.TRACKDIAGRAM_REPO_TOKEN }}
        run: |
          cd mini-japanrail-3d/data
          if [ ! -d line_bsdiagrams ] || [ -z "$(ls -A line_bsdiagrams 2>/dev/null)" ]; then
            echo "无 BS 图产物，跳过同步"; exit 0
          fi
          if [ -z "$TD_TOKEN" ]; then
            echo "::warning::未配置 Secret TRACKDIAGRAM_REPO_TOKEN，跳过同步"; exit 0
          fi
          n=$(ls line_bsdiagrams/*.svg 2>/dev/null | wc -l) || n=0
          echo "BS 配线图 SVG 数: ${n:-0}"
          TD=$(mktemp -d)
          git clone --depth 1 "https://x-access-token:${TD_TOKEN}@github.com/ooep/jr-trackdiagrams.git" "$TD" 2>/dev/null || git init -q -b main "$TD"
          cd "$TD"
          mkdir -p line_bsdiagrams
          cp -r "$GITHUB_WORKSPACE/mini-japanrail-3d/data/line_bsdiagrams/." line_bsdiagrams/
          cp "$GITHUB_WORKSPACE/mini-japanrail-3d/data/line_bsdiagrams.json" . 2>/dev/null || true
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "chore(v6): line BS diagrams $(date -u +%Y-%m-%d-%H%M)" || echo "无新变更"
          git remote set-url origin "https://x-access-token:${TD_TOKEN}@github.com/ooep/jr-trackdiagrams.git"
          git pull --rebase origin main 2>/dev/null || true
          git push origin HEAD:main && echo "已同步 line_bsdiagrams" || { echo "::warning::push 失败，重试一次"; sleep 5; git pull --rebase origin main 2>/dev/null || true; git push origin HEAD:main && echo "重试成功" || echo "::error::同步失败"; }

      - name: Finalize (cleanup + worktree assertion)
        if: always()
        run: bash encryption/finalize.sh
