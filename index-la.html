<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mini JapanRail — Railway Lines of Japan</title>
<meta property="og:title" content="Mini JapanRail" />
<meta property="og:description" content="interactive map of japan's railway lines" />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" type="image/png" href="favicon.png" />
<style>* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #07090d; color: #eee; font-family: 'Nunito', system-ui, sans-serif; overflow: hidden; }
#map { width: 100vw; height: 100vh; }

#langtoggle {
    position: absolute;
    bottom: 16px; right: 52px;
    z-index: 1000;
    display: flex;
    gap: 2px;
    background: rgba(7,9,13,0.84);
    border: 1px solid #2a2f38;
    border-radius: 6px;
    padding: 3px 4px;
    font-size: 11px;
    white-space: nowrap;
}
#langtoggle span { cursor: pointer; color: #8b939e; padding: 2px 6px; border-radius: 4px; }
#langtoggle span.on { color: #fff; background: #2a2f38; }

#bottomleft {
    position: absolute;
    bottom: 16px; left: 14px;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
}
#legend {
    position: relative;
    background: rgba(7,9,13,0.84);
    border: 1px solid #2a2f38;
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 11.5px;
    line-height: 1.7;
}
#legend.hidden { display: none; }
@media (min-width: 701px) {
    #legend { min-width: 190px; }
}
#legend .close {
    position: absolute;
    top: 2px; right: 4px;
    color: #59616d;
    cursor: pointer;
    font-size: 20px;
    line-height: 1;
    padding: 4px 6px;
    user-select: none;
}
#legend .close:hover { color: #d8dde3; }
#ctrlbtn {
    width: 40px; height: 40px;
    background: rgba(7,9,13,0.84);
    border: 1px solid #2a2f38;
    border-radius: 50%;
    color: #c0c5cc;
    cursor: pointer;
    user-select: none;
    display: none;
    align-items: center;
    justify-content: center;
    transition: color .15s, border-color .15s;
}
#ctrlbtn svg { width: 22px; height: 22px; }
#ctrlbtn:hover { color: #fff; border-color: #4a505c; }
#ctrlbtn.show { display: flex; }
#legend .hd { color: #8b939e; font-size: 10px; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 3px; }
#legend .modetoggle { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
#legend .modetoggle span { cursor: pointer; color: #8b939e; padding: 2px 7px; border-radius: 4px; border: 1px solid #2a2f38; }
#legend .modetoggle span.on { color: #fff; background: #2a2f38; }
#legend .stsec { margin-top: 7px; padding-top: 6px; border-top: 1px solid #2a2f38; }
#legend .strow { display: flex; align-items: center; gap: 8px; }
#legend .strow input[type=checkbox] { width: 13px; height: 13px; flex: none; margin: 0; accent-color: #5bb6ff; cursor: pointer; }
#legend .thick { margin-top: 7px; padding-top: 6px; border-top: 1px solid #2a2f38; }
#legend .thick input { width: 100%; margin-top: 0; accent-color: #5bb6ff; cursor: pointer; }
#legend .thick .val { color: #d8dde3; }

#aboutbtn {
    position: absolute;
    top: 96px; left: 14px;
    z-index: 1100;
    width: 32px; height: 32px;
    background: rgba(7,9,13,0.84);
    border: 1px solid #2a2f38;
    border-radius: 50%;
    color: #c0c5cc;
    font-size: 17px;
    font-weight: 700;
    line-height: 30px;
    text-align: center;
    cursor: pointer;
    user-select: none;
    transition: color .15s, border-color .15s;
}
#aboutbtn:hover { color: #fff; border-color: #4a505c; }
#aboutbtn.on { color: #fff; background: #2a2f38; border-color: #5bb6ff; }
#aboutpanel {
    position: absolute;
    bottom: 16px;
    left: 215px;
    width: 360px;
    max-width: calc(100vw - 235px);
    max-height: calc(80vh - 16px);
    overflow-y: auto;
    background: rgba(7,9,13,0.94);
    border: 1px solid #3a414c;
    border-radius: 8px;
    padding: 14px 16px;
    z-index: 1050;
    font-size: 11.5px;
    line-height: 1.5;
    color: #c0c5cc;
    display: none;
}
#aboutpanel.open { display: block; }
@media (max-width: 700px) {
    #aboutpanel {
        left: 14px; right: 14px;
        width: auto; max-width: none;
    }
}
#aboutpanel h2 { color: #fff; font-size: 13px; font-weight: 800; margin: 14px 0 5px; letter-spacing: .3px; }
#aboutpanel h2:first-child { margin-top: 0; }
#aboutpanel p { margin-top: 6px; }
#aboutpanel p:first-of-type { margin-top: 0; }
#aboutpanel b { color: #fff; }
#aboutpanel a { color: #5bb6ff; text-decoration: none; }

#info {
    position: absolute;
    bottom: 16px; right: 14px;
    background: rgba(7,9,13,0.92);
    border: 1px solid #3a414c;
    border-radius: 8px;
    padding: 10px 13px;
    z-index: 1000;
    font-size: 12.5px;
    line-height: 1.5;
    max-width: 320px;
    display: none;
}
#info .ipline { font-weight: 800; font-size: 13.5px; margin-bottom: 3px; }
#info .ipseg { color: #fff; margin-bottom: 5px; }
#info .iprow { display: flex; justify-content: space-between; gap: 20px; color: #8b939e; }
#info .iprow b { color: #eee; font-weight: 700; }
#info .iphint { margin-top: 7px; color: #59616d; font-size: 10.5px; }

#tooltip {
    position: absolute;
    pointer-events: none;
    background: rgba(7,9,13,0.96);
    border: 1px solid #3a414c;
    border-radius: 6px;
    padding: 6px 9px;
    font-size: 12px;
    line-height: 1.45;
    z-index: 2000;
    display: none;
    white-space: nowrap;
}
#tooltip .line { font-weight: 800; }
#tooltip .seg { color: #fff; }
#tooltip .meta { color: #8b939e; font-size: 11px; }

.leaflet-control-attribution { font-size: 10px !important; background: rgba(7,9,13,0.6) !important; color: #59616d !important; }
.leaflet-control-attribution a { color: #5bb6ff !important; }
.leaflet-control-zoom a { background: rgba(7,9,13,0.84) !important; color: #c0c5cc !important; border-color: #2a2f38 !important; }
.leaflet-control-zoom a:hover { color: #fff !important; background: rgba(30,35,45,0.9) !important; }

/* ── search box ── */
#searchbox {
    position: absolute;
    top: 12px; right: 56px;
    z-index: 1500;
    width: 280px;
    max-width: calc(100vw - 80px);
}
#search-input {
    width: 100%;
    background: rgba(7,9,13,0.84);
    border: 1px solid #2a2f38;
    border-radius: 8px;
    padding: 8px 12px 8px 32px;
    color: #eee;
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color .15s;
}
#search-input::placeholder { color: #59616d; }
#search-input:focus { border-color: #5bb6ff; }
#search-icon {
    position: absolute;
    top: 8px; left: 10px;
    width: 16px; height: 16px;
    color: #59616d;
    pointer-events: none;
}
#search-results {
    display: none;
    margin-top: 4px;
    background: rgba(7,9,13,0.96);
    border: 1px solid #3a414c;
    border-radius: 8px;
    max-height: 320px;
    overflow-y: auto;
    font-size: 12.5px;
}
#search-results .sr-item {
    padding: 7px 12px;
    cursor: pointer;
    border-bottom: 1px solid rgba(58,65,76,0.4);
    transition: background .1s;
}
#search-results .sr-item:last-child { border-bottom: none; }
#search-results .sr-item:hover,
#search-results .sr-item.active { background: rgba(91,182,255,0.12); }
#search-results .sr-type {
    display: inline-block;
    font-size: 10px;
    color: #59616d;
    border: 1px solid #2a2f38;
    border-radius: 3px;
    padding: 0 4px;
    margin-right: 6px;
    vertical-align: middle;
}
#search-results .sr-name { color: #eee; }
#search-results .sr-sub { color: #8b939e; font-size: 11px; margin-left: 4px; }
#search-results .sr-empty { padding: 10px 12px; color: #59616d; text-align: center; }
@media (max-width: 700px) {
    #searchbox { right: 50px; width: 200px; }
}
</style>
</head>

    if (JR[op]) return JR[op][lang] || JR[op].ja;
    if (lang === 'en') return NAMES.operators[op] || op;
    if (lang === 'zh') return toSimplified(op);
    return op;
}
function lineLabel(op, line) {
    if (lang === 'en') return NAMES.lines[op + '||' + line] || line;
    if (lang === 'zh') return toSimplified(line);
    return line;
}
function stnLabel(op, name) {
    if (lang === 'en') return NAMES.stations[op + '||' + name] || name;
    if (lang === 'zh') return toSimplified(name);
    return name;
}

// ───────────────────────────── line width ────────────────────────────────
let lineScale = 1;
let showStations = true;

// ─────────────────── Leaflet map ───────────────────
const canvasRenderer = L.canvas({ padding: 0.5 });

const map = L.map('map', {
    center: [37.6, 137.7],
    zoom: 5,
    minZoom: 3.5,
    zoomControl: true,
    attributionControl: true,
});

L.tileLayer('https://d.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}@2x.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
    maxZoom: 18,
    subdomains: 'abcd',
}).addTo(map);

// ─── zoom-dependent line width ───
const BASE_LINE_W = 1.8;
const ZOOM_BASE = 1.3;
const ZF_LO = Math.pow(ZOOM_BASE, 3 - 7);
const ZF_HI = Math.pow(ZOOM_BASE, 13 - 7);

function widthAtZoom(base, z) {
    const t = (z - 3) / (13 - 3);
    const scale = ZF_LO * Math.pow(ZF_HI / ZF_LO, t);
    return base * lineScale * scale;
}
function coreWidth(z) { return widthAtZoom(BASE_LINE_W, z); }
function casingWidth(z) { return widthAtZoom(BASE_LINE_W + 3, z); }

// ─── layer groups ───
let allFeats = [];
let layerMap = [];
let fcData = null;
let selected = null;
let lineStations = new Map();
let sfcData = null;

const segGroup = L.featureGroup().addTo(map);
const transferDots = L.featureGroup().addTo(map);
const transferLabels = L.featureGroup().addTo(map);
const stationDots = L.featureGroup().addTo(map);
let selectedStationIds = new Set();
let selectedStationGroup = null;

function segKey(p, i) { return p.op + '||' + p.line + '||' + p.from + '||' + p.to + '||' + i; }
function selLineKey() { return selected ? selected.op + '||' + selected.line : null; }
function stationsOnSelectedLine() {
    return selected ? (lineStations.get(selLineKey()) || new Set()) : new Set();
}

function featureStyle(p) {
    return {
        color: p.color,
        weight: coreWidth(map.getZoom()),
        opacity: 0.92,
        lineCap: 'round',
        lineJoin: 'round',
        renderer: canvasRenderer,
    };
}

function updateAllWidths() {
    const z = map.getZoom();
    layerMap.forEach(function(entry) {
        if (!entry.layer.setStyle) return;
        var p = entry.f.properties;
        var isSel = matchesSelection(p);
        entry.layer.setStyle({
            color: p.color,
            weight: isSel ? coreWidth(z) : coreWidth(z),
            opacity: isSel ? 0.97 : (selected ? 0.13 : 0.92),
            lineCap: 'round',
            lineJoin: 'round',
        });
    });
}

// ─── data load ───
Promise.all([
    fetch('data/segments.geojson').then(function(r) { return r.json(); }),
    fetch('data/names_en.json').then(function(r) { return r.json(); }),
]).then(function(results) {
    var fc = results[0];
    NAMES = results[1];

    for (var i = 0; i < fc.features.length; i++) {
        var p = fc.features[i].properties;
        p.colorOp = colorOpFor(p.op);
        p.colorLine = colorLineFor(p.op, p.line);
        p.colorDetailed = p.color || colorDetailedFor(p.op, p.line);
        p.color = colorMode === 'line' ? p.colorLine : colorMode === 'detailed' ? p.colorDetailed : p.colorOp;
    }
    allFeats = fc.features;
    fcData = fc;

    for (var i = 0; i < allFeats.length; i++) {
        var p = allFeats[i].properties;
        var k = p.op + '||' + p.line;
        var s = lineStations.get(k);
        if (!s) { s = new Set(); lineStations.set(k, s); }
        s.add(p.from); s.add(p.to);
    }

    // Add segment polylines
    var z = map.getZoom();
    L.geoJSON(fc, {
        style: featureStyle,
        onEachFeature: function(feature, layer) {
            var p = feature.properties;
            var key = segKey(p, layerMap.length);
            layer._segKey = key;
            layerMap.push({ key: key, layer: layer, f: feature });

            layer.on('mouseover', function(e) {
                showSegTip(p, e.originalEvent || e);
                document.getElementById('map').style.cursor = 'pointer';
            });
            layer.on('mouseout', function() {
                document.getElementById('tooltip').style.display = 'none';
                document.getElementById('map').style.cursor = '';
            });
            layer.on('mousemove', function(e) {
                moveTip(e.originalEvent || e);
            });
            layer.on('click', function() {
                handleSegClick(p);
            });
        }
    }).addTo(segGroup);

    // Load stations
    return fetch('data/stations.geojson').then(function(r) { return r.json(); });
}).then(function(sfc) {
    sfc.features.forEach(function(f, i) {
        var p = f.properties;
        p.color = colorLineFor(p.op, p.line);
        var ops = Array.isArray(p.ops) ? p.ops : JSON.parse(p.ops || '[]');
        p.transfer = ops.length > 1 ? 1 : 0;
        f._idx = i;
    });
    sfcData = sfc;

    sfc.features.forEach(function(f) {
        var p = f.properties;
        var latlng = [f.geometry.coordinates[1], f.geometry.coordinates[0]];
        if (p.transfer) {
            var dot = L.circleMarker(latlng, {
                radius: 3, fillColor: '#ffffff', color: '#ffffff',
                weight: 0, fillOpacity: 0.7, renderer: canvasRenderer,
            }).addTo(transferDots);
            dot._feature = f;

            var label = L.marker(latlng, {
                icon: L.divIcon({
                    className: '',
                    html: '<div style="color:#c0c5cc;font-size:10px;text-shadow:0 0 3px #07090d,0 0 1px #07090d;white-space:nowrap;pointer-events:none;">' + escHtml(p.station) + '</div>',
                    iconAnchor: [0, 12],
                }),
                interactive: false,
            });
            transferLabels.addLayer(label);
        } else {
            var dot = L.circleMarker(latlng, {
                radius: 2, fillColor: '#ffffff', color: '#ffffff',
                weight: 0, fillOpacity: 0.5, renderer: canvasRenderer,
            });
            dot._feature = f;
            stationDots.addLayer(dot);
        }
    });

    applyStationVisibility();
    applySelection();
    map.on('zoomend', onZoomChange);

    // URL params
    var urlParams = new URLSearchParams(window.location.search);
    var langParam = urlParams.get('lang');
    if (langParam && ['en', 'ja', 'zh'].includes(langParam)) {
        lang = langParam;
        applyLang();
    }
    var stationParam = urlParams.get('station');
    var lineParam = urlParams.get('line');
    var opParam = urlParams.get('op');
    var qParam = urlParams.get('q');
    if (stationParam) flyToStation(stationParam);
    else if (lineParam) flyToLine(lineParam, opParam);
    else if (qParam) { if (!flyToStation(qParam)) flyToLine(qParam, null); }
    skipUrlUpdate = false;
}).catch(function(err) { console.error('Data load failed:', err); });

function escHtml(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

// ─── zoom change: update widths + label visibility ───
function onZoomChange() {
    var z = map.getZoom();
    layerMap.forEach(function(entry) {
        if (!entry.layer.setStyle) return;
        var p = entry.f.properties;
        var isSel = matchesSelection(p);
        entry.layer.setStyle({
            color: p.color,
            weight: coreWidth(z),
            opacity: isSel ? 0.97 : (selected ? 0.13 : 0.92),
        });
    });
    applyStationVisibility();
    if (selected) recomputeSelectedStationIds();
}

function applyStationVisibility() {
    var z = map.getZoom();
    if (showStations) {
        if (!map.hasLayer(transferDots)) map.addLayer(transferDots);
        if (z < 9) {
            if (!map.hasLayer(transferLabels)) map.addLayer(transferLabels);
        } else {
            if (map.hasLayer(transferLabels)) map.removeLayer(transferLabels);
        }
        if (z >= 9) {
            if (!map.hasLayer(stationDots)) map.addLayer(stationDots);
        } else {
            if (map.hasLayer(stationDots)) map.removeLayer(stationDots);
        }
    } else {
        if (map.hasLayer(transferDots)) map.removeLayer(transferDots);
        if (map.hasLayer(transferLabels)) map.removeLayer(transferLabels);
        if (map.hasLayer(stationDots)) map.removeLayer(stationDots);
    }
}

// ─── tooltip ───
var tip = document.getElementById('tooltip');
function showSegTip(p, e) {
    var S = STR[lang];
    tip.style.display = 'block';
    var x = e.clientX || (e.originalEvent && e.originalEvent.clientX) || 0;
    var y = e.clientY || (e.originalEvent && e.originalEvent.clientY) || 0;
    tip.style.left = (x + 14) + 'px';
    tip.style.top = (y + 14) + 'px';
    var simpFrom = simpOnly(p.from);
    var simpTo = simpOnly(p.to);
    var simpNote = (simpFrom || simpTo) ? '<div style="color:#59616d;font-size:10.5px">' + (simpFrom || p.from) + ' → ' + (simpTo || p.to) + '</div>' : '';
    tip.innerHTML =
        '<div class="line" style="color:' + p.color + '">' + simpAnnot(opLabel(p.op)) + ' ' + simpAnnot(lineLabel(p.op, p.line)) + '</div>' +
        '<div class="seg">' + p.from + ' → ' + p.to + '</div>' +
        simpNote +
        '<div class="meta">' + Number(p.km).toFixed(1) + ' ' + S.km + '</div>';
}
function moveTip(e) {
    var x = e.clientX || 0;
    var y = e.clientY || 0;
    tip.style.left = (x + 14) + 'px';
    tip.style.top = (y + 14) + 'px';
}

// ─── click handling ───
var clickTimer = null;
function handleSegClick(p) {
    if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; }
    clickTimer = setTimeout(function() {
        clickTimer = null;
        if (selected && selected.op === p.op && selected.line === p.line) {
            if (selected.mode === 'line') {
                setSegmentSelection(p);
            } else {
                clearSelection();
            }
        } else {
            setLineSelection(p);
        }
    }, 200);
}

// ─── selection ───
function matchesSelection(p) {
    if (!selected) return false;
    if (selected.op !== p.op || selected.line !== p.line) return false;
    if (selected.mode === 'segment') return selected.from === p.from && selected.to === p.to;
    return true;
}

function setLineSelection(p) {
    selected = { mode: 'line', op: p.op, line: p.line, color: p.color };
    applySelection();
    renderInfo();
    updateUrl({ line: p.line, op: p.op });
}

function setSegmentSelection(p) {
    selected = { mode: 'segment', op: p.op, line: p.line,
                 from: p.from, to: p.to, color: p.color, km: p.km };
    applySelection();
    renderInfo();
    updateUrl({ line: p.line, op: p.op, from: p.from, to: p.to });
}

function clearSelection() {
    if (!selected) return;
    selected = null;
    applySelection();
    document.getElementById('info').style.display = 'none';
    updateUrl({});
}

function recomputeSelectedStationIds() {
    selectedStationIds = new Set();
    if (!selected || !sfcData) return;
    var names = stationsOnSelectedLine();
    var segs = allFeats.filter(function(f) {
        return f.properties.op === selected.op && f.properties.line === selected.line;
    });
    if (!names.size || !segs.length) return;
    var STN_NEAR = 0.004 * 0.004;
    for (var i = 0; i < segs.length; i++) {
        var sg = segs[i];
        if (!sg._bbox) {
            var minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
            for (var j = 0; j < sg.geometry.coordinates.length; j++) {
                var c = sg.geometry.coordinates[j];
                if (c[0] < minx) minx = c[0]; if (c[0] > maxx) maxx = c[0];
                if (c[1] < miny) miny = c[1]; if (c[1] > maxy) maxy = c[1];
            }
            sg._bbox = [minx, miny, maxx, maxy];
        }
    }
    var PAD = 0.005;
    sfcData.features.forEach(function(f) {
        if (!names.has(f.properties.station)) return;
        var coords = f.geometry.coordinates;
        var sx = coords[0], sy = coords[1];
        var hit = false;
        for (var i = 0; i < segs.length; i++) {
            var bb = segs[i]._bbox;
            if (sx < bb[0] - PAD || sx > bb[2] + PAD || sy < bb[1] - PAD || sy > bb[3] + PAD) continue;
            for (var j = 0; j < segs[i].geometry.coordinates.length; j++) {
                var c = segs[i].geometry.coordinates[j];
                var dx = c[0] - sx, dy = c[1] - sy;
                if (dx * dx + dy * dy < STN_NEAR) { hit = true; break; }
            }
            if (hit) break;
        }
        if (hit) selectedStationIds.add(f._idx);
    });
}

function applySelection() {
    var z = map.getZoom();
    layerMap.forEach(function(entry) {
        if (!entry.layer.setStyle) return;
        var p = entry.f.properties;
        var isSel = matchesSelection(p);
        entry.layer.setStyle({
            color: p.color,
            weight: coreWidth(z),
            opacity: isSel ? 0.97 : (selected ? 0.13 : 0.92),
        });
    });

    if (selected) {
        recomputeSelectedStationIds();
    } else {
        selectedStationIds = new Set();
    }

    // Update station dot styles
    function styleDot(layer, isTransfer) {
        var f = layer._feature;
        if (!f) return;
        var onLine = selected && selectedStationIds.has(f._idx);
        if (selected) {
            layer.setStyle({
                radius: onLine ? (isTransfer ? 4 : 3) : (isTransfer ? 3 : 2),
                fillColor: onLine ? (selected.color || '#fff') : '#ffffff',
                color: onLine ? (selected.color || '#fff') : (isTransfer ? '#ffffff' : '#ffffff'),
                weight: onLine ? 1.5 : 0,
                fillOpacity: onLine ? 0.95 : (isTransfer ? 0.15 : 0.08),
            });
        } else {
            layer.setStyle({
                radius: isTransfer ? 3 : 2,
                fillColor: '#ffffff',
                color: '#ffffff',
                weight: 0,
                fillOpacity: isTransfer ? 0.7 : 0.5,
            });
        }
    }
    transferDots.eachLayer(function(l) { styleDot(l, true); });
    stationDots.eachLayer(function(l) { styleDot(l, false); });
}

// ─── colour mode ───
function setColorMode(mode) {
    if (mode === colorMode) return;
    colorMode = mode;
    for (var i = 0; i < allFeats.length; i++) {
        var p = allFeats[i].properties;
        p.color = colorMode === 'line' ? p.colorLine : colorMode === 'detailed' ? p.colorDetailed : p.colorOp;
    }
    var z = map.getZoom();
    layerMap.forEach(function(entry) {
        if (!entry.layer.setStyle) return;
        var p = entry.f.properties;
        var isSel = matchesSelection(p);
        entry.layer.setStyle({
            color: p.color,
            weight: coreWidth(z),
            opacity: isSel ? 0.97 : (selected ? 0.13 : 0.92),
        });
    });
    if (selected) {
        var f = allFeats.find(function(x) {
            return x.properties.op === selected.op && x.properties.line === selected.line;
        });
        if (f) selected.color = f.properties.color;
        applySelection();
    }
    buildLegend();
    renderInfo();
}

function renderInfo() {
    if (!selected) return;
    var S = STR[lang];
    var box = document.getElementById('info');
    var head = '<div class="ipline" style="color:' + selected.color + '">' +
               opLabel(selected.op) + ' ' + lineLabel(selected.op, selected.line) + '</div>';

    var simpOpNote = simpOnly(selected.op);
    var simpLineNote = simpOnly(selected.line);
    var simpHead = (simpOpNote || simpLineNote) ? '<div style="color:#8b939e;font-size:11px">' + (simpOpNote || selected.op) + ' ' + (simpLineNote || selected.line) + '</div>' : '';
    if (selected.mode === 'segment') {
        var simpFromN = simpOnly(selected.from);
        var simpToN = simpOnly(selected.to);
        var simpSegNote = (simpFromN || simpToN) ? '<div style="color:#8b939e;font-size:11px">' + (simpFromN || selected.from) + ' → ' + (simpToN || selected.to) + '</div>' : '';
        box.innerHTML = head + simpHead +
            '<div class="ipseg">' + selected.from + ' → ' + selected.to + '</div>' + simpSegNote +
            '<div class="iprow"><span>' + S.panelLength + '</span>' +
                '<b>' + Number(selected.km).toFixed(1) + ' ' + S.km + '</b></div>';
    } else {
        var parts = allFeats.filter(function(f) {
            return f.properties.op === selected.op && f.properties.line === selected.line;
        });
        var km = 0;
        for (var i = 0; i < parts.length; i++) km += Number(parts[i].properties.km) || 0;
        box.innerHTML = head + simpHead +
            '<div class="iprow"><span>' + S.panelLength + '</span><b>' + km.toFixed(1) + ' ' + S.km + '</b></div>' +
            '<div class="iprow"><span>' + S.panelSections + '</span><b>' + parts.length + '</b></div>';
    }
    box.innerHTML += '<div class="iphint">' + S.panelHint + '</div>';
    box.style.display = 'block';
}

window.addEventListener('keydown', function(e) { if (e.key === 'Escape') clearSelection(); });

// ─── URL ───
var skipUrlUpdate = true;
function updateUrl(params) {
    if (skipUrlUpdate) return;
    var url = new URL(window.location);
    url.searchParams.delete('station');
    url.searchParams.delete('line');
    url.searchParams.delete('op');
    url.searchParams.delete('q');
    for (var k in params) {
        if (params[k]) url.searchParams.set(k, params[k]);
    }
    if (lang !== 'en') url.searchParams.set('lang', lang);
    else url.searchParams.delete('lang');
    history.replaceState(null, '', url);
}

// ─── URL fly functions ───
function flyToStation(name) {
    var q = name.toLowerCase();
    var qSimp = toSimplified(q);
    if (!sfcData) return false;
    for (var i = 0; i < sfcData.features.length; i++) {
        var f = sfcData.features[i];
        var p = f.properties;
        var nl = p.station.toLowerCase();
        if (nl === q || toSimplified(nl) === qSimp) {
            map.flyTo([f.geometry.coordinates[1], f.geometry.coordinates[0]], 12, { duration: 1.2 });
            var feat = allFeats.find(function(ff) { return ff.properties.op === p.op && ff.properties.line === p.line; });
            if (feat) setLineSelection(feat.properties);
            return true;
        }
    }
    for (var i = 0; i < sfcData.features.length; i++) {
        var f = sfcData.features[i];
        var p = f.properties;
        var enName = (NAMES.stations[p.op + '||' + p.station] || '').toLowerCase();
        if (enName && enName === q) {
            map.flyTo([f.geometry.coordinates[1], f.geometry.coordinates[0]], 12, { duration: 1.2 });
            var feat = allFeats.find(function(ff) { return ff.properties.op === p.op && ff.properties.line === p.line; });
            if (feat) setLineSelection(feat.properties);
            return true;
        }
    }
    for (var i = 0; i < sfcData.features.length; i++) {
        var f = sfcData.features[i];
        var p = f.properties;
        var nl = p.station.toLowerCase();
        if (nl.includes(q) || toSimplified(nl).includes(qSimp)) {
            map.flyTo([f.geometry.coordinates[1], f.geometry.coordinates[0]], 12, { duration: 1.2 });
            var feat = allFeats.find(function(ff) { return ff.properties.op === p.op && ff.properties.line === p.line; });
            if (feat) setLineSelection(feat.properties);
            return true;
        }
    }
    return false;
}

function flyToLine(lineName, operatorName) {
    var q = lineName.toLowerCase();
    var qSimp = toSimplified(q);
    var opQ = operatorName ? operatorName.toLowerCase() : '';
    var opQSimp = operatorName ? toSimplified(opQ) : '';
    var feats = allFeats.filter(function(f) {
        var p = f.properties;
        var ll = p.line.toLowerCase();
        var ol = p.op.toLowerCase();
        var lineOk = ll === q || toSimplified(ll) === qSimp;
        var opOk = !operatorName || ol === opQ || toSimplified(ol) === opQSimp;
        return lineOk && opOk;
    });
    if (!feats.length) {
        feats = allFeats.filter(function(f) {
            var p = f.properties;
            var ll = p.line.toLowerCase();
            var ol = p.op.toLowerCase();
            var lineOk = ll.includes(q) || toSimplified(ll).includes(qSimp);
            var opOk = !operatorName || ol.includes(opQ) || toSimplified(ol).includes(opQSimp);
            return lineOk && opOk;
        });
    }
    if (feats.length) {
        var minLat = Infinity, minLng = Infinity, maxLat = -Infinity, maxLng = -Infinity;
        for (var i = 0; i < feats.length; i++) {
            for (var j = 0; j < feats[i].geometry.coordinates.length; j++) {
                var c = feats[i].geometry.coordinates[j];
                if (c[0] < minLng) minLng = c[0];
                if (c[0] > maxLng) maxLng = c[0];
                if (c[1] < minLat) minLat = c[1];
                if (c[1] > maxLat) maxLat = c[1];
            }
        }
        map.fitBounds([[minLat, minLng], [maxLat, maxLng]], { padding: [60, 60], duration: 1.2 });
        setLineSelection(feats[0].properties);
        return true;
    }
    return false;
}

// ─── interface ───
function buildLegend() {
    var S = STR[lang];
    var html = '<span class="close" id="lg-close" title="hide">×</span>' +
        '<div class="hd">' + S.legLineColors + '</div>' +
        '<div class="modetoggle">' +
        '<span id="cm-op" class="' + (colorMode === 'operator' ? 'on' : '') + '">' + S.modeOperator + '</span>' +
        '<span id="cm-line" class="' + (colorMode === 'line' ? 'on' : '') + '">' + S.modeLine + '</span>' +
        '<span id="cm-detail" class="' + (colorMode === 'detailed' ? 'on' : '') + '">' + S.modeDetailed + '</span></div>';

    html += '<div class="stsec">' +
            '<div class="hd">' + S.toggleStations + '</div>' +
            '<div class="strow">' +
            '<input type="checkbox" id="st-toggle"' + (showStations ? ' checked' : '') + '>' +
            '</div></div>';

    html += '<div class="thick"><div class="hd">' + S.legLineWidth + ' ' +
            '<span class="val" id="thickVal">' + S.lineWidthVal + lineScale.toFixed(1) + '</span></div>' +
            '<input id="lineScaleSlider" type="range" min="0.3" max="3" step="0.1" value="' + lineScale + '"></div>';

    document.getElementById('legend').innerHTML = html;

    document.getElementById('lg-close').onclick = function() { setLegendOpen(false); };
    document.getElementById('cm-op').onclick = function() { setColorMode('operator'); };
    document.getElementById('cm-line').onclick = function() { setColorMode('line'); };
    document.getElementById('cm-detail').onclick = function() { setColorMode('detailed'); };
    document.getElementById('st-toggle').onchange = function(e) {
        showStations = e.target.checked;
        applyStationVisibility();
    };
    var sl = document.getElementById('lineScaleSlider');
    sl.oninput = function() {
        lineScale = parseFloat(sl.value);
        document.getElementById('thickVal').textContent = STR[lang].lineWidthVal + lineScale.toFixed(1);
        updateAllWidths();
    };
}

function applyLang() {
    var S = STR[lang];
    document.title = S.h1;
    document.getElementById('lang-en').classList.toggle('on', lang === 'en');
    document.getElementById('lang-ja').classList.toggle('on', lang === 'ja');
    document.getElementById('lang-zh').classList.toggle('on', lang === 'zh');
    document.getElementById('aboutbtn').title = S.aboutTitle;
    document.getElementById('aboutpanel').innerHTML = S.aboutBody;
    document.getElementById('search-input').placeholder = S.searchPlaceholder;
    buildLegend();
    renderInfo();
}

document.getElementById('lang-en').onclick = function() { lang = 'en'; applyLang(); };
document.getElementById('lang-ja').onclick = function() { lang = 'ja'; applyLang(); };
document.getElementById('lang-zh').onclick = function() { lang = 'zh'; applyLang(); };

var aboutOpen = false;
var legendOpen = true;
function setAboutOpen(v) {
    if (aboutOpen === v) return;
    aboutOpen = v;
    document.getElementById('aboutbtn').classList.toggle('on', aboutOpen);
    document.getElementById('aboutpanel').classList.toggle('open', aboutOpen);
}
function setLegendOpen(v) {
    if (legendOpen === v) return;
    legendOpen = v;
    document.getElementById('legend').classList.toggle('hidden', !legendOpen);
    document.getElementById('ctrlbtn').classList.toggle('show', !legendOpen);
}
document.getElementById('ctrlbtn').onclick = function() { setLegendOpen(true); };
document.getElementById('aboutbtn').onclick = function(e) {
    e.stopPropagation();
    setAboutOpen(!aboutOpen);
};
document.getElementById('aboutpanel').addEventListener('click', function(e) { e.stopPropagation(); });
document.addEventListener('click', function() { if (aboutOpen) setAboutOpen(false); });

// ─── search ───
(function() {
    var searchInput = document.getElementById('search-input');
    var resultsBox = document.getElementById('search-results');
    var activeIdx = -1;
    var currentResults = [];

    function buildSearchIndex() {
        var stationMap = new Map();
        if (sfcData) {
            for (var i = 0; i < sfcData.features.length; i++) {
                var p = sfcData.features[i].properties;
                var key = p.station;
                if (!stationMap.has(key)) {
                    stationMap.set(key, {
                        type: 'station', name: p.station,
                        nameEn: NAMES.stations[p.op + '||' + p.station] || '',
                        op: p.op, line: p.line,
                        ops: Array.isArray(p.ops) ? p.ops : JSON.parse(p.ops || '[]'),
                        coord: sfcData.features[i].geometry.coordinates,
                        riders: p.riders || 0,
                    });
                }
            }
        }
        var lineMap = new Map();
        for (var i = 0; i < allFeats.length; i++) {
            var p = allFeats[i].properties;
            var key = p.op + '||' + p.line;
            if (!lineMap.has(key)) {
                lineMap.set(key, {
                    type: 'line', op: p.op, line: p.line,
                    nameEn: NAMES.lines[p.op + '||' + p.line] || '',
                    color: p.colorLine,
                });
            }
        }
        return { stations: Array.from(stationMap.values()), lines: Array.from(lineMap.values()) };
    }

    var searchIndex = null;
    function ensureIndex() {
        if (!searchIndex && allFeats.length && sfcData) searchIndex = buildSearchIndex();
        return searchIndex;
    }

    function doSearch(query) {
        var idx = ensureIndex();
        if (!idx || !query) return [];
        var q = query.toLowerCase();
        var qSimp = toSimplified(q);
        var S = STR[lang];
        var results = [];

        for (var i = 0; i < idx.stations.length; i++) {
            var s = idx.stations[i];
            var nameLower = s.name.toLowerCase();
            var jaMatch = nameLower.includes(q);
            var enMatch = s.nameEn.toLowerCase().includes(q);
            var simpMatch = toSimplified(nameLower).includes(qSimp);
            if (jaMatch || enMatch || simpMatch) {
                var label = lang === 'en' && s.nameEn ? s.nameEn : s.name;
                var simpName = toSimplified(s.name);
                var sub = lang === 'en' ? s.name : (simpName !== s.name ? simpName : (s.nameEn || ''));
                results.push({
                    type: 'station', label: label, sub: sub,
                    opLabel: s.ops.map(function(op) { return opLabel(op); }).join(' · '),
                    data: s, score: (jaMatch || simpMatch === jaMatch) ? 0 : 1,
                });
            }
        }

        for (var i = 0; i < idx.lines.length; i++) {
            var l = idx.lines[i];
            var lineLower = l.line.toLowerCase();
            var opLower = l.op.toLowerCase();
            var jaMatch = lineLower.includes(q);
            var opJaMatch = opLower.includes(q);
            var enMatch = l.nameEn.toLowerCase().includes(q);
            var simpLineMatch = toSimplified(lineLower).includes(qSimp);
            var simpOpMatch = toSimplified(opLower).includes(qSimp);
            if (jaMatch || opJaMatch || enMatch || simpLineMatch || simpOpMatch) {
                var lbl = lang === 'en' && l.nameEn ? l.nameEn : l.line;
                var simpLine = toSimplified(l.line);
                var sub = lang === 'en' ? l.line : (simpLine !== l.line ? simpLine : (l.nameEn || ''));
                results.push({
                    type: 'line', label: lbl, sub: sub,
                    opLabel: opLabel(l.op), color: l.color,
                    data: l, score: (jaMatch || simpLineMatch || simpOpMatch) ? 0 : 1,
                });
            }
        }

        results.sort(function(a, b) {
            var aStarts = a.label.toLowerCase().startsWith(q) || toSimplified(a.label).startsWith(qSimp) || a.sub.toLowerCase().startsWith(q) ? 0 : 1;
            var bStarts = b.label.toLowerCase().startsWith(q) || toSimplified(b.label).startsWith(qSimp) || b.sub.toLowerCase().startsWith(q) ? 0 : 1;
            if (aStarts !== bStarts) return aStarts - bStarts;
            if (a.score !== b.score) return a.score - b.score;
            if (a.type !== b.type) return a.type === 'station' ? -1 : 1;
            return a.label.localeCompare(b.label, lang === 'ja' ? 'ja' : 'en');
        });
        return results.slice(0, 30);
    }

    function renderResults(results) {
        var S = STR[lang];
        if (!results.length) {
            resultsBox.innerHTML = '<div class="sr-empty">' + S.searchNoResults + '</div>';
            resultsBox.style.display = 'block';
            currentResults = results;
            activeIdx = -1;
            return;
        }
        currentResults = results;
        activeIdx = -1;
        resultsBox.innerHTML = results.map(function(r, i) {
            var typeLabel = r.type === 'station' ? S.searchStation : S.searchLine;
            var dot = r.color ? '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + r.color + ';margin-right:4px;vertical-align:middle;"></span>' : '';
            return '<div class="sr-item" data-idx="' + i + '">' +
                '<span class="sr-type">' + typeLabel + '</span>' +
                dot +
                '<span class="sr-name">' + escHtml(r.label) + '</span>' +
                (r.sub && r.sub !== r.label ? '<span class="sr-sub">' + escHtml(r.sub) + '</span>' : '') +
                '<span class="sr-sub"> — ' + escHtml(r.opLabel) + '</span>' +
            '</div>';
        }).join('');
        resultsBox.style.display = 'block';
    }

    function clearResults() {
        resultsBox.style.display = 'none';
        resultsBox.innerHTML = '';
        currentResults = [];
        activeIdx = -1;
    }

    function selectResult(idx) {
        var r = currentResults[idx];
        if (!r) return;
        clearResults();
        searchInput.value = '';
        searchInput.blur();

        if (r.type === 'station') {
            var s = r.data;
            map.flyTo([s.coord[1], s.coord[0]], 12, { duration: 1.2 });
            var feat = allFeats.find(function(f) {
                return f.properties.op === s.op && f.properties.line === s.line;
            });
            if (feat) setLineSelection(feat.properties);
        } else if (r.type === 'line') {
            var l = r.data;
            var feats = allFeats.filter(function(f) {
                return f.properties.op === l.op && f.properties.line === l.line;
            });
            if (feats.length) {
                var minLat = Infinity, minLng = Infinity, maxLat = -Infinity, maxLng = -Infinity;
                for (var i = 0; i < feats.length; i++) {
                    for (var j = 0; j < feats[i].geometry.coordinates.length; j++) {
                        var c = feats[i].geometry.coordinates[j];
                        if (c[0] < minLng) minLng = c[0];
                        if (c[0] > maxLng) maxLng = c[0];
                        if (c[1] < minLat) minLat = c[1];
                        if (c[1] > maxLat) maxLat = c[1];
                    }
                }
                map.fitBounds([[minLat, minLng], [maxLat, maxLng]], { padding: [60, 60], duration: 1.2 });
                setLineSelection(feats[0].properties);
            }
        }
    }

    function updateActiveItem() {
        var items = resultsBox.querySelectorAll('.sr-item');
        items.forEach(function(el, i) { el.classList.toggle('active', i === activeIdx); });
        if (activeIdx >= 0 && items[activeIdx]) items[activeIdx].scrollIntoView({ block: 'nearest' });
    }

    searchInput.addEventListener('input', function() {
        var q = searchInput.value.trim();
        if (!q) { clearResults(); return; }
        renderResults(doSearch(q));
    });

    searchInput.addEventListener('keydown', function(e) {
        if (!currentResults.length) return;
        if (e.key === 'ArrowDown') {
            e.preventDefault();
            activeIdx = Math.min(activeIdx + 1, currentResults.length - 1);
            updateActiveItem();
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            activeIdx = Math.max(activeIdx - 1, 0);
            updateActiveItem();
        } else if (e.key === 'Enter') {
            e.preventDefault();
            if (activeIdx >= 0) selectResult(activeIdx);
            else if (currentResults.length) selectResult(0);
        } else if (e.key === 'Escape') {
            clearResults();
            searchInput.blur();
        }
    });

    resultsBox.addEventListener('click', function(e) {
        var item = e.target.closest('.sr-item');
        if (item) selectResult(parseInt(item.dataset.idx, 10));
    });

    document.addEventListener('click', function(e) {
        if (!document.getElementById('searchbox').contains(e.target)) clearResults();
    });
    document.getElementById('searchbox').addEventListener('click', function(e) { e.stopPropagation(); });
    document.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
            e.preventDefault();
            searchInput.focus();
            searchInput.select();
        }
    });
})();

applyLang();
</script>
</body>
</html>
