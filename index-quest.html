<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mini JapanRail · 日本鉄道制霸</title>
<meta property="og:title" content="Mini JapanRail · 日本鉄道制霸" />
<meta property="og:description" content="Track your railway journey across Japan" />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" type="image/png" href="favicon.png" />
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
    --bg: #07090d;
    --bg-panel: #0c1018;
    --bg-card: #111820;
    --bg-hover: #1a2230;
    --bg-active: #1e2a3a;
    --border: #1e2a38;
    --border-light: #2a3a4a;
    --text: #e8ecf1;
    --text-dim: #8b939e;
    --text-muted: #59616d;
    --accent: #5bb6ff;
    --accent-dim: rgba(91,182,255,0.15);
    --success: #2eb35a;
    --success-dim: rgba(46,179,90,0.15);
    --warning: #f5821f;
    --danger: #e8443b;
    --danger-dim: rgba(232,68,59,0.15);
    --sidebar-w: 380px;
    --header-h: 48px;
}
body { background: var(--bg); color: var(--text); font-family: 'Nunito', system-ui, -apple-system, sans-serif; overflow: hidden; }
button, input[type="checkbox"] { touch-action: manipulation; }

#map { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh; z-index: 1; }

#sidebar {
    position: fixed; top: 0; left: 0;
    width: var(--sidebar-w); height: 100vh;
    height: 100dvh;
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    z-index: 50;
    display: flex; flex-direction: column;
    transition: transform 0.3s ease;
    overflow: hidden;
}
#sidebar.collapsed { transform: translateX(calc(-1 * var(--sidebar-w))); }

#sidebar-toggle {
    position: fixed; top: 10px; left: 10px;
    z-index: 60;
    width: 40px; height: 40px;
    background: rgba(7,9,13,0.9);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-dim);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
}
#sidebar-toggle:hover { color: #fff; border-color: var(--border-light); background: rgba(20,28,40,0.95); }
#sidebar-toggle svg { width: 20px; height: 20px; }
body:not(.sidebar-collapsed) #sidebar-toggle { left: calc(var(--sidebar-w) + 10px); }

/* ─── Header ─── */
#header {
    height: var(--header-h);
    padding: 0 16px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--bg);
}
#header .title {
    font-size: 15px; font-weight: 800;
    letter-spacing: 0.5px;
    white-space: nowrap;
}
#header .title .jp { font-size: 13px; color: var(--text-dim); margin-left: 6px; font-weight: 600; }
#header-actions { display: flex; gap: 4px; }
#header-actions button, .icon-btn {
    background: transparent; border: 1px solid var(--border);
    border-radius: 6px; color: var(--text-dim);
    cursor: pointer; padding: 4px 8px;
    font-size: 11px; font-family: inherit;
    transition: all 0.15s;
    display: inline-flex; align-items: center; gap: 4px;
}
#header-actions button:hover, .icon-btn:hover { color: var(--text); border-color: var(--border-light); background: var(--bg-hover); }
#header-actions button.danger:hover { color: var(--danger); border-color: var(--danger); }

/* ─── Stats bar ─── */
#stats-bar {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--bg);
}
#stats-bar .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
}
.stat-item {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
}
.stat-item .stat-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
.stat-item .stat-value { font-size: 18px; font-weight: 800; color: var(--accent); margin-top: 2px; }
.stat-item .stat-pct { font-size: 11px; color: var(--text-dim); }
.stat-item.highlight .stat-value { color: var(--success); }

/* ─── Progress bar ─── */
#progress-bar-wrap {
    padding: 6px 16px 10px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--bg);
}
#progress-bar-wrap .prog-label {
    font-size: 10px; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.5px;
    margin-bottom: 4px; display: flex; justify-content: space-between;
}
#progress-track {
    width: 100%; height: 6px;
    background: var(--bg-card);
    border-radius: 3px;
    overflow: hidden;
    border: 1px solid var(--border);
}
#progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--success), var(--accent));
    border-radius: 3px;
    transition: width 0.4s ease;
    width: 0%;
}

/* ─── Mode toggle ─── */
#mode-bar {
    display: flex;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--bg);
}
.mode-btn {
    flex: 1;
    padding: 8px 0;
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    color: var(--text-muted);
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
    background: transparent;
    border-top: none; border-left: none; border-right: none;
    font-family: inherit;
}
.mode-btn:hover { color: var(--text-dim); background: var(--bg-hover); }
.mode-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

/* ─── Map view toggle ─── */
#map-view-bar {
    display: flex; gap: 6px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--bg);
}
.view-btn {
    flex: 1;
    padding: 5px 0;
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    color: var(--text-dim);
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 5px;
    transition: all 0.15s;
    font-family: inherit;
}
.view-btn:hover { background: var(--bg-hover); border-color: var(--border-light); }
.view-btn.active { color: var(--accent); border-color: var(--accent); background: var(--accent-dim); }

/* ─── Search ─── */
#search-bar {
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--bg);
}
#search-bar input {
    width: 100%;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px 7px 32px;
    color: var(--text);
    font-size: 12.5px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
}
#search-bar input::placeholder { color: var(--text-muted); }
#search-bar input:focus { border-color: var(--accent); }
#search-bar { position: relative; }
#search-bar .search-icon {
    position: absolute;
    top: 14px; left: 24px;
    width: 14px; height: 14px;
    color: var(--text-muted);
    pointer-events: none;
}

/* ─── Line list ─── */
#line-list-wrap {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 4px 0;
    -webkit-overflow-scrolling: touch;
}
#line-list-wrap::-webkit-scrollbar { width: 6px; }
#line-list-wrap::-webkit-scrollbar-track { background: transparent; }
#line-list-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
#line-list-wrap::-webkit-scrollbar-thumb:hover { background: var(--border-light); }

.operator-group { margin-bottom: 2px; }
.operator-header {
    display: flex;
    align-items: center;
    padding: 8px 16px;
    cursor: pointer;
    user-select: none;
    transition: background 0.1s;
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
}
.operator-header:hover { background: var(--bg-hover); }
.operator-header .op-chevron {
    width: 16px; height: 16px;
    color: var(--text-muted);
    transition: transform 0.2s;
    flex-shrink: 0;
    margin-right: 6px;
}
.operator-header.collapsed .op-chevron { transform: rotate(-90deg); }
.operator-header .op-color {
    width: 10px; height: 10px;
    border-radius: 3px;
    flex-shrink: 0;
    margin-right: 8px;
}
.operator-header .op-name {
    font-size: 12px; font-weight: 700;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.operator-header .op-name .op-simp {
    color: var(--text-muted);
    font-size: 10.5px;
    font-weight: 500;
    margin-left: 4px;
}
.operator-header .op-count {
    font-size: 10px;
    color: var(--text-muted);
    margin-left: 6px;
    flex-shrink: 0;
}
.operator-header .op-progress-wrap {
    width: 40px; height: 4px;
    background: var(--bg-card);
    border-radius: 2px;
    overflow: hidden;
    margin-left: 8px;
    flex-shrink: 0;
}
.operator-header .op-progress-fill {
    height: 100%;
    background: var(--success);
    border-radius: 2px;
    transition: width 0.3s;
}
.operator-header .op-select-all {
    font-size: 9px;
    color: var(--accent);
    cursor: pointer;
    padding: 2px 6px;
    border: 1px solid var(--border);
    border-radius: 3px;
    margin-left: 6px;
    flex-shrink: 0;
    background: transparent;
    font-family: inherit;
    transition: all 0.15s;
}
.operator-header .op-select-all:hover { background: var(--accent-dim); border-color: var(--accent); }

.operator-lines { overflow: hidden; transition: max-height 0.3s ease; }
.operator-header.collapsed + .operator-lines { max-height: 0 !important; }

.line-item {
    display: flex;
    align-items: flex-start;
    padding: 6px 16px 6px 40px;
    cursor: pointer;
    transition: background 0.1s;
    border-bottom: 1px solid rgba(30,42,56,0.3);
}
.line-item:hover { background: var(--bg-hover); }
.line-item .line-color-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 5px;
    margin-right: 8px;
}
.line-item .line-info { flex: 1; min-width: 0; }
.line-item .line-name {
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.line-item .line-name .line-simp {
    color: var(--text-muted);
    font-size: 10.5px;
    font-weight: 400;
    margin-left: 3px;
}
.line-item .line-meta {
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 1px;
}

/* ─── Custom checkbox ─── */
.line-check {
    position: relative;
    width: 18px; height: 18px;
    flex-shrink: 0;
    margin-left: 8px;
    margin-top: 2px;
}
.line-check input {
    position: absolute;
    opacity: 0;
    width: 100%; height: 100%;
    cursor: pointer;
    z-index: 2;
    margin: 0;
}
.line-check .checkmark {
    position: absolute;
    top: 0; left: 0;
    width: 18px; height: 18px;
    background: var(--bg-card);
    border: 1.5px solid var(--border-light);
    border-radius: 4px;
    transition: all 0.15s;
    display: flex; align-items: center; justify-content: center;
}
.line-check input:checked + .checkmark {
    background: var(--success);
    border-color: var(--success);
}
.line-check .checkmark svg {
    width: 12px; height: 12px;
    color: #fff;
    opacity: 0;
    transform: scale(0.5);
    transition: all 0.15s;
}
.line-check input:checked + .checkmark svg {
    opacity: 1;
    transform: scale(1);
}
.line-check.partial .checkmark {
    background: var(--warning);
    border-color: var(--warning);
}
.line-check.partial .checkmark svg { opacity: 0; }
.line-check.partial .checkmark::after {
    content: '';
    width: 8px; height: 2px;
    background: #fff;
    border-radius: 1px;
}

/* ─── Segment items (detailed mode) ─── */
.segments-wrap {
    overflow: hidden;
    max-height: 0;
    transition: max-height 0.3s ease;
    background: rgba(0,0,0,0.15);
}
.segments-wrap.open { max-height: 2000px; }
.segment-item {
    display: flex;
    align-items: center;
    padding: 4px 16px 4px 56px;
    font-size: 11px;
    color: var(--text-dim);
    cursor: pointer;
    transition: background 0.1s;
    border-bottom: 1px solid rgba(30,42,56,0.2);
}
.segment-item:hover { background: var(--bg-hover); }
.segment-item .seg-arrow { color: var(--text-muted); margin: 0 4px; }
.segment-item .seg-km { margin-left: auto; color: var(--text-muted); font-size: 10px; }
.segment-item .seg-check {
    position: relative;
    width: 15px; height: 15px;
    flex-shrink: 0;
    margin-right: 8px;
}
.segment-item .seg-check input {
    position: absolute; opacity: 0;
    width: 100%; height: 100%;
    cursor: pointer; margin: 0;
}
.segment-item .seg-check .checkmark {
    position: absolute;
    top: 0; left: 0;
    width: 15px; height: 15px;
    background: var(--bg-card);
    border: 1.5px solid var(--border-light);
    border-radius: 3px;
    transition: all 0.15s;
    display: flex; align-items: center; justify-content: center;
}
.segment-item .seg-check input:checked + .checkmark {
    background: var(--success);
    border-color: var(--success);
}
.segment-item .seg-check .checkmark svg {
    width: 10px; height: 10px;
    color: #fff;
    opacity: 0;
    transform: scale(0.5);
    transition: all 0.15s;
}
.segment-item .seg-check input:checked + .checkmark svg {
    opacity: 1; transform: scale(1);
}
.segment-item.ridden { color: var(--text); }

/* ─── Quick select range ─── */
.quick-select-wrap {
    padding: 8px 12px 8px 40px;
    background: rgba(91,182,255,0.04);
    border-bottom: 1px solid rgba(30,42,56,0.3);
}
.quick-select-header {
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 6px;
}
.quick-select-header span {
    font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;
    font-weight: 600;
}
.quick-select-header .qs-toggle {
    width: 16px; height: 16px; cursor: pointer;
    color: var(--text-muted); transition: color 0.15s;
}
.quick-select-header .qs-toggle:hover { color: var(--accent); }
.quick-select-header .qs-toggle.on { color: var(--accent); }
.quick-select-body {
    display: none; gap: 6px; align-items: flex-end;
}
.quick-select-body.open { display: flex; flex-wrap: wrap; }
.quick-select-body .qs-field { flex: 1; min-width: 80px; }
.quick-select-body .qs-field label {
    display: block; font-size: 9px; color: var(--text-muted);
    text-transform: uppercase; margin-bottom: 2px; font-weight: 600;
}
.quick-select-body .qs-field select {
    width: 100%; padding: 5px 6px;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 4px; color: var(--text); font-size: 11px;
    font-family: inherit; outline: none; cursor: pointer;
    -webkit-appearance: none; appearance: none;
}
.quick-select-body .qs-field select:focus { border-color: var(--accent); }
.quick-select-body .qs-apply {
    padding: 5px 10px; font-size: 10px; font-weight: 700;
    background: var(--accent); color: #fff; border: none;
    border-radius: 4px; cursor: pointer; white-space: nowrap;
    font-family: inherit; transition: opacity 0.15s;
    flex-shrink: 0;
}
.quick-select-body .qs-apply:hover { opacity: 0.85; }
.quick-select-body .qs-apply:disabled { opacity: 0.4; cursor: default; }

/* ─── Language toggle ─── */
#lang-toggle {
    position: fixed;
    bottom: 16px; right: 52px;
    z-index: 100;
    display: flex;
    gap: 2px;
    background: rgba(7,9,13,0.88);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 4px;
    font-size: 11px;
    white-space: nowrap;
}
#lang-toggle span {
    cursor: pointer;
    color: var(--text-muted);
    padding: 2px 6px;
    border-radius: 4px;
    transition: all 0.15s;
}
#lang-toggle span:hover { color: var(--text-dim); }
#lang-toggle span.on { color: #fff; background: var(--border); }

/* ─── Bottom controls on map ─── */
#map-controls {
    position: fixed;
    bottom: 16px; left: 14px;
    z-index: 40;
    display: flex; flex-direction: column; gap: 8px;
}

/* ─── Modal ─── */
.modal-overlay {
    position: fixed; top: 0; left: 0;
    width: 100vw; height: 100vh;
    height: 100dvh;
    background: rgba(0,0,0,0.6);
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
    background: var(--bg-panel);
    border: 1px solid var(--border-light);
    border-radius: 10px;
    padding: 24px;
    max-width: 400px;
    width: 90%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.modal h3 { font-size: 15px; font-weight: 800; margin-bottom: 12px; }
.modal p { font-size: 13px; color: var(--text-dim); margin-bottom: 16px; line-height: 1.5; }
.modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
.modal-btns button {
    padding: 7px 16px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-dim);
}
.modal-btns button:hover { background: var(--bg-hover); color: var(--text); }
.modal-btns button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.modal-btns button.primary:hover { background: #4aa3ec; }
.modal-btns button.danger { background: var(--danger); color: #fff; border-color: var(--danger); }
.modal-btns button.danger:hover { background: #d03a32; }

/* ─── Toast ─── */
#toast {
    position: fixed;
    bottom: 60px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(7,9,13,0.95);
    border: 1px solid var(--border-light);
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 12px;
    z-index: 300;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ─── Responsive ─── */
@media (max-width: 768px) {
    :root { --sidebar-w: 100vw; }
    #sidebar {
        width: 100vw;
        box-shadow: 4px 0 20px rgba(0,0,0,0.4);
    }
    body:not(.sidebar-collapsed) #sidebar-toggle { left: calc(100vw - 50px); top: 10px; }
    #lang-toggle { bottom: 8px; right: 8px; font-size: 10px; }

    /* Header: allow wrapping */
    #header { padding: 0 10px; height: auto; min-height: var(--header-h); }
    #header .title { font-size: 13px; }
    #header .title .jp { display: none; }
    #header-actions { gap: 3px; flex-shrink: 0; }
    #header-actions button { padding: 6px; min-width: 28px; min-height: 28px; }

    /* Stats: single column on very small */
    #stats-bar { padding: 8px 10px; }
    .stat-item .stat-value { font-size: 16px; }

    /* Progress */
    #progress-bar-wrap { padding: 6px 10px 8px; }

    /* Mode bar */
    .mode-btn { font-size: 11px; padding: 10px 0; }

    /* Search */
    #search-bar { padding: 6px 10px; }
    #search-bar input { font-size: 14px; padding: 10px 10px 10px 32px; }
    #search-bar .search-icon { top: 16px; left: 18px; }

    /* Line list items: larger touch targets */
    .operator-header { padding: 10px 12px; min-height: 44px; }
    .line-item { padding: 8px 12px 8px 32px; min-height: 44px; }
    .line-check { width: 22px; height: 22px; }
    .line-check .checkmark { width: 22px; height: 22px; }
    .line-check .checkmark svg { width: 14px; height: 14px; }
    .segment-item { padding: 8px 12px 8px 48px; min-height: 40px; font-size: 12px; }
    .seg-check { width: 20px; height: 20px; }
    .seg-check .checkmark { width: 20px; height: 20px; }
    .seg-check .checkmark svg { width: 12px; height: 12px; }

    /* Modal: full width on mobile */
    .modal-overlay {
        align-items: flex-end;
    }
    .modal {
        max-width: 100%;
        width: 100%;
        border-radius: 14px 14px 0 0;
        max-height: 90vh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 20px 16px;
    }
    .modal h3 { font-size: 14px; }
    .modal-btns { padding-bottom: env(safe-area-inset-bottom, 0); }
    .modal-btns button { padding: 10px 16px; font-size: 13px; min-height: 44px; }

    /* Poster modal specific */
    #modal-poster .modal {
        max-height: 85vh;
    }
    #poster-preview-wrap {
        max-height: 35vh;
        overflow: hidden;
    }
    #poster-preview {
        max-height: 35vh;
        object-fit: contain;
    }

    /* Select all button: larger touch target */
    .op-select-all { padding: 4px 8px; font-size: 10px; min-height: 28px; }

    /* View bar */
    .view-btn { padding: 8px 0; font-size: 12px; min-height: 36px; }
}

/* ─── Scrollbar for sidebar content ─── */
#sidebar-content::-webkit-scrollbar { width: 4px; }
#sidebar-content::-webkit-scrollbar-track { background: transparent; }
#sidebar-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.poster-orient-btn.active { color: var(--accent) !important; border-color: var(--accent) !important; }
.poster-theme-btn.active { color: var(--accent) !important; border-color: var(--accent) !important; }
</style>
</head>
<body>

<div id="map"></div>

<button id="sidebar-toggle" title="Toggle sidebar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
</button>

<div id="sidebar">
    <div id="header">
        <div class="title">Mini JapanRail · 鉄道制霸<span class="jp">Japan Railway Conquest</span></div>
        <div id="header-actions">
            <button id="btn-export" title="Export data">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            </button>
            <button id="btn-import" title="Import data">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            </button>
            <button id="btn-share" title="Share">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
            </button>
            <button id="btn-poster" title="Export Poster">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            </button>
            <button id="btn-clear" class="danger" title="Clear all data">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
            </button>
        </div>
    </div>

    <div id="stats-bar">
        <div class="stats-grid">
            <div class="stat-item">
                <div class="stat-label" data-i18n="stats_lines">Lines</div>
                <div class="stat-value"><span id="stat-lines-ridden">0</span> / <span id="stat-lines-total">0</span></div>
                <div class="stat-pct"><span id="stat-lines-pct">0</span>%</div>
            </div>
            <div class="stat-item highlight">
                <div class="stat-label" data-i18n="stats_segments">Segments</div>
                <div class="stat-value"><span id="stat-segs-ridden">0</span> / <span id="stat-segs-total">0</span></div>
                <div class="stat-pct"><span id="stat-segs-pct">0</span>%</div>
            </div>
            <div class="stat-item" style="grid-column: 1 / -1;">
                <div class="stat-label" data-i18n="stats_km">Distance Ridden</div>
                <div class="stat-value"><span id="stat-km-ridden">0</span> <span style="font-size:12px;color:var(--text-dim)">/ <span id="stat-km-total">0</span> km</span></div>
                <div class="stat-pct"><span id="stat-km-pct">0</span>%</div>
            </div>
        </div>
    </div>

    <div id="progress-bar-wrap">
        <div class="prog-label">
            <span data-i18n="progress">Overall Progress</span>
            <span id="progress-pct">0%</span>
        </div>
        <div id="progress-track"><div id="progress-fill"></div></div>
    </div>

    <div id="mode-bar">
        <button class="mode-btn active" data-mode="quick" data-i18n="mode_quick">Quick Mode</button>
        <button class="mode-btn" data-mode="detailed" data-i18n="mode_detailed">Detailed Mode</button>
    </div>

    <div id="map-view-bar">
        <button class="view-btn active" data-view="all" data-i18n="view_all">Show All</button>
        <button class="view-btn" data-view="ridden" data-i18n="view_ridden">Ridden Only</button>
    </div>

    <div id="search-bar">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search-input" type="text" placeholder="検索 Search lines..." autocomplete="off" />
    </div>

    <div id="line-list-wrap">
        <div id="line-list"></div>
    </div>
</div>

<div id="lang-toggle">
    <span data-lang="en">EN</span>
    <span data-lang="ja">日本語</span>
    <span data-lang="zh">中文</span>
</div>

<div class="modal-overlay" id="modal-clear">
    <div class="modal">
        <h3 data-i18n="clear_title">Clear All Data</h3>
        <p data-i18n="clear_msg">This will permanently delete all your progress data. This action cannot be undone.</p>
        <div class="modal-btns">
            <button id="clear-cancel" data-i18n="cancel">Cancel</button>
            <button id="clear-confirm" class="danger" data-i18n="clear_confirm">Delete Everything</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modal-share">
    <div class="modal">
        <h3 data-i18n="share_title">Share Progress</h3>
        <div id="share-content" style="margin-bottom:16px;"></div>
        <div class="modal-btns">
            <button id="share-copy" class="primary" data-i18n="share_copy">Copy to Clipboard</button>
            <button id="share-close" data-i18n="close">Close</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modal-poster">
    <div class="modal">
        <h3 data-i18n="poster_title">Export Poster</h3>
        <div style="margin-bottom:16px;">
            <div style="margin-bottom:10px;">
                <label style="font-size:12px;color:var(--text-dim);display:block;margin-bottom:4px;" data-i18n="poster_nickname">Nickname (optional)</label>
                <input id="poster-nickname" type="text" maxlength="20" placeholder="Your name" data-i18n-placeholder="poster_nickname" style="width:100%;padding:6px 10px;font-size:13px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:inherit;outline:none;" />
            </div>
            <div style="margin-bottom:10px;">
                <label style="font-size:12px;color:var(--text-dim);display:block;margin-bottom:4px;" data-i18n="poster_theme">Theme</label>
                <div style="display:flex;gap:6px;">
                    <button class="poster-theme-btn active" data-theme="light" style="flex:1;padding:6px;font-size:11px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;color:var(--text-dim);cursor:pointer;">☀ Light</button>
                    <button class="poster-theme-btn" data-theme="dark" style="flex:1;padding:6px;font-size:11px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;color:var(--text-dim);cursor:pointer;">☾ Dark</button>
                </div>
            </div>
            <div style="margin-bottom:10px;">
                <label style="font-size:12px;color:var(--text-dim);display:block;margin-bottom:4px;" data-i18n="poster_orientation">Orientation</label>
                <div style="display:flex;gap:6px;">
                    <button class="poster-orient-btn active" data-orient="landscape" style="flex:1;padding:6px;font-size:11px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;color:var(--text-dim);cursor:pointer;">Landscape 1920×1080</button>
                    <button class="poster-orient-btn" data-orient="portrait" style="flex:1;padding:6px;font-size:11px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;color:var(--text-dim);cursor:pointer;">Portrait 1080×1920</button>
                </div>
            </div>
            <div id="poster-preview-wrap" style="border-radius:8px;overflow:hidden;border:1px solid var(--border);background:#000;">
                <canvas id="poster-preview" style="width:100%;display:block;"></canvas>
            </div>
            <div id="poster-generating" style="display:none;text-align:center;padding:20px;color:var(--text-dim);">
                <span data-i18n="poster_generating">Generating poster...</span>
            </div>
        </div>
        <div class="modal-btns">
            <button id="poster-download" class="primary" data-i18n="poster_download">Download PNG</button>
            <button id="poster-close" data-i18n="close">Close</button>
        </div>
    </div>
</div>

<div id="toast"></div>
<input type="file" id="import-file" accept=".json" style="display:none" />

}

function simpAnnot(text) {

    return s !== text ? text + '<span style="color:#59616d;font-size:0.85em">(' + s + ')</span>' : text;

function colorOpFor(op) { return JR[op] ? JR[op].color : OTHER_COLOR; }

function colorLineFor(op, ln) {
    const m = LINE_COLORS[op];
    if (m) {
        if (m[ln]) return m[ln];
        for (const k in m) {
            if (!k.includes('・')) continue;
            for (const part of k.split('・')) {
                if (part === ln || part + '線' === ln) return m[k];
            }
        }
        if (!ln.endsWith('本線')) { const base = ln.replace(/線$/, ''); if (m[base + '本線']) return m[base + '本線']; }
        if (ln.endsWith('本線')) { const short = ln.replace('本線', '線'); if (m[short]) return m[short]; }
    }
    return JR[op] ? JR[op].color : OTHER_COLOR;
}

function colorDetailedFor(op, ln) {
    const m = LINE_COLORS_DETAILED[op];
    if (m) {
        if (m[ln]) return m[ln];
        for (const k in m) {
            if (!k.includes('・')) continue;
            for (const part of k.split('・')) {
                if (part === ln || part + '線' === ln) return m[k];
            }
        }
        if (!ln.endsWith('本線')) {
            const base = ln.replace(/線$/, '');
            if (m[base + '本線']) return m[base + '本線'];
        }
        if (ln.endsWith('本線')) {
            const short = ln.replace('本線', '線');
            if (m[short]) return m[short];
        }
        for (const k in m) {
            if (k.includes(ln) || ln.includes(k)) return m[k];
        }
    }
    const alias = LINE_ALIASES[op + '||' + ln];
    if (alias) return colorDetailedFor(op, alias);
    return JR[op] ? JR[op].color : OTHER_COLOR;
}

let lang = (() => {
    try {
        const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
        if (tz === 'Asia/Tokyo') return 'ja';
        if (tz && (tz.startsWith('Asia/Shanghai') || tz.startsWith('Asia/Chongqing') || tz.startsWith('Asia/Harbin') || tz.startsWith('Asia/Taipei') || tz.startsWith('Asia/Hong_Kong'))) return 'zh';
    } catch (e) {}
    const bl = (navigator.language || '').toLowerCase();
    if (bl.startsWith('zh')) return 'zh';
    if (bl.startsWith('ja')) return 'ja';
    return 'en';
})();

function t(key) { return (I18N[lang] && I18N[lang][key]) || (I18N.en[key]) || key; }

    document.getElementById('lang-toggle').querySelectorAll('span').forEach(s => {
        s.classList.toggle('on', s.dataset.lang === lang);

}

// QUEST DATA (localStorage)
// ═══════════════════════════════════════════════════════════════

const STORAGE_KEY = 'minijapanrail_quest_data';

let questData = { lines: {}, segments: {} };

function loadQuestData() {
    try {
        // 旧键迁移（japanrail_quest_data → minijapanrail_quest_data）：新键无数据且旧键有数据时搬移并删除旧键，保留既有进度
        const OLD_KEY = 'japanrail_quest_data';
        let raw = localStorage.getItem(STORAGE_KEY);
        if (!raw && localStorage.getItem(OLD_KEY)) {
            raw = localStorage.getItem(OLD_KEY);
            localStorage.setItem(STORAGE_KEY, raw);
            localStorage.removeItem(OLD_KEY);
        }
        if (raw) {
            const parsed = JSON.parse(raw);
            questData = {
                lines: parsed.lines || {},
                segments: parsed.segments || {},
            };
        }
    } catch (e) {
        questData = { lines: {}, segments: {} };
    }
}

function saveQuestData() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(questData));
    } catch (e) {}
}

function lineKey(op, line) { return op + '||' + line; }
function segKey(op, line, from, to) { return op + '||' + line + '||' + from + '||' + to; }

function isLineRidden(op, line) { return !!questData.lines[lineKey(op, line)]; }
function isSegRidden(op, line, from, to) { return !!questData.segments[segKey(op, line, from, to)]; }

function setLineRidden(op, line, val) {
    const k = lineKey(op, line);
    if (val) questData.lines[k] = true;
    else delete questData.lines[k];
    saveQuestData();
}

function setSegRidden(op, line, from, to, val) {
    const k = segKey(op, line, from, to);
    if (val) questData.segments[k] = true;
    else delete questData.segments[k];
    saveQuestData();
}

function toggleLineRidden(op, line) {
    const val = !isLineRidden(op, line);
    setLineRidden(op, line, val);
    const segs = segmentsByLine.get(lineKey(op, line)) || [];
    for (const seg of segs) {
        setSegRidden(op, line, seg.from, seg.to, val);
    }
}

function toggleSegRidden(op, line, from, to) {
    const val = !isSegRidden(op, line, from, to);
    setSegRidden(op, line, from, to, val);
    updateLineRiddenState(op, line);
}

function updateLineRiddenState(op, line) {
    const k = lineKey(op, line);
    const segs = segmentsByLine.get(k) || [];
    if (segs.length === 0) return;
    const allRidden = segs.every(s => isSegRidden(op, line, s.from, s.to));
    if (allRidden) questData.lines[k] = true;
    else delete questData.lines[k];
    saveQuestData();
}

const BASE_LINE_W = 1.8;
const ZOOM_BASE = 1.3;
const ZF_LO = Math.pow(ZOOM_BASE, 3 - 7);
const ZF_HI = Math.pow(ZOOM_BASE, 13 - 7);

function coreWidth() {
    return ['interpolate', ['exponential', ZOOM_BASE], ['zoom'],
        3, BASE_LINE_W * ZF_LO,
        13, BASE_LINE_W * ZF_HI];
}
function coreWidthRidden() {
    return ['interpolate', ['exponential', ZOOM_BASE], ['zoom'],
        3, (BASE_LINE_W + 0.8) * ZF_LO,
        13, (BASE_LINE_W + 0.8) * ZF_HI];
}
function casingWidth() {
    return ['interpolate', ['exponential', ZOOM_BASE], ['zoom'],
        3, (BASE_LINE_W + 3) * ZF_LO,
        13, (BASE_LINE_W + 3) * ZF_HI];
}

function dimColor(hex) {
    return '#6b7280';
}

function updateMapQuestState() {
    if (!fcData || !allFeats.length) return;
    const dimAll = viewMode === 'ridden';
    for (let i = 0; i < allFeats.length; i++) {
        const p = allFeats[i].properties;
        const ridden = isSegRidden(p.op, p.line, p.from, p.to) || isLineRidden(p.op, p.line);
        if (ridden) {
            p.color = p.realColor;
        } else {
            p.color = dimAll ? '#4b5563' : '#6b7280';
        }
    }
    const fresh = JSON.parse(JSON.stringify(fcData));
    map.getSource('segs').setData(fresh);
}

map.on('load', async () => {
    const [fc, names] = await Promise.all([
        fetch('data/segments.geojson').then(r => r.json()),
        fetch('data/names_en.json').then(r => r.json()).catch(() => ({ operators: {}, lines: {}, stations: {}, remarks: {} })),
    ]);

    for (let i = 0; i < fc.features.length; i++) {
        const f = fc.features[i];
        f.id = i + 1;
        const p = f.properties;
        p.colorOp = colorOpFor(p.op);
        p.colorLine = colorLineFor(p.op, p.line);
        p.colorDetailed = p.color || colorDetailedFor(p.op, p.line);
        p.realColor = p.colorDetailed;
        p.color = '#6b7280';

        const k = lineKey(p.op, p.line);
        let segs = segmentsByLine.get(k);
        if (!segs) { segs = []; segmentsByLine.set(k, segs); }
        segs.push({ from: p.from, to: p.to, km: Number(p.km) || 0 });

        if (!allOperators.has(p.op)) {
            allOperators.set(p.op, { color: colorOpFor(p.op), lines: new Set() });
        }
        allOperators.get(p.op).lines.add(p.line);
    }

    allFeats = fc.features;
    fcData = fc;

    loadQuestData();

    map.addSource('segs', { type: 'geojson', data: fc });

    map.addLayer({
        id: 'segs-line', type: 'line', source: 'segs',
        paint: {
            'line-color': ['get', 'color'],
            'line-width': coreWidth(),
            'line-opacity': 0.92,
        },
        layout: { 'line-cap': 'round', 'line-join': 'round' },
    });

    updateMapQuestState();

    const tooltip = document.createElement('div');
    tooltip.id = 'tooltip';

    document.body.appendChild(tooltip);

    map.on('mousemove', 'segs-line', (e) => {
        if (!e.features.length) return;

        tooltip.style.left = (e.point.x + 14) + 'px';
        tooltip.style.top = (e.point.y + 14) + 'px';

        const badge = ridden ? '<span style="color:#2eb35a"> ✓</span>' : '';
        tooltip.innerHTML =
            `<div style="font-weight:800;color:${p.realColor}">${opLabel(p.op)} ${lineLabel(p.op, p.line)}</div>` +
            `<div style="color:#fff">${p.from} → ${p.to}</div>` +
            `<div style="color:#8b939e;font-size:11px">${Number(p.km).toFixed(1)} km${badge}</div>`;
        map.getCanvas().style.cursor = 'pointer';
    });
    map.on('mouseleave', 'segs-line', () => {
        tooltip.style.display = 'none';
        map.getCanvas().style.cursor = '';
    });
    map.on('movestart', () => { tooltip.style.display = 'none'; });

    map.on('click', 'segs-line', (e) => {
        if (!e.features.length) return;
        const p = e.features[0].properties;
        toggleSegRidden(p.op, p.line, p.from, p.to);

        updateStats();

    updateStats();
    renderLineList();
});

function updateStats() {
    let totalLines = 0, riddenLines = 0;
    let totalSegs = 0, riddenSegs = 0;
    let totalKm = 0, riddenKm = 0;

    for (const [k, segs] of segmentsByLine) {
        totalLines++;
        const [op, line] = k.split('||');
        if (isLineRidden(op, line)) riddenLines++;
        for (const seg of segs) {
            totalSegs++;
            totalKm += seg.km;
            if (isSegRidden(op, line, seg.from, seg.to)) {
                riddenSegs++;
                riddenKm += seg.km;
            }
        }
    }

    document.getElementById('stat-lines-ridden').textContent = riddenLines;
    document.getElementById('stat-lines-total').textContent = totalLines;
    document.getElementById('stat-lines-pct').textContent = totalLines ? Math.round(riddenLines / totalLines * 100) : 0;

    document.getElementById('stat-segs-ridden').textContent = riddenSegs;
    document.getElementById('stat-segs-total').textContent = totalSegs;
    document.getElementById('stat-segs-pct').textContent = totalSegs ? Math.round(riddenSegs / totalSegs * 100) : 0;

    document.getElementById('stat-km-ridden').textContent = riddenKm.toFixed(1);
    document.getElementById('stat-km-total').textContent = totalKm.toFixed(1);
    document.getElementById('stat-km-pct').textContent = totalKm ? (riddenKm / totalKm * 100).toFixed(1) : 0;

    const pct = totalKm ? (riddenKm / totalKm * 100) : 0;
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-pct').textContent = pct.toFixed(1) + '%';
}

let mode = 'quick';
let searchQuery = '';
let expandedOps = new Set();
let expandedLines = new Set();

function buildOperatorOrder() {
    const jrOps = [];
    const otherOps = [];
    for (const [op] of allOperators) {
        if (JR[op]) jrOps.push(op);
        else otherOps.push(op);
    }
    jrOps.sort((a, b) => {
        const order = ['北海道旅客鉄道','東日本旅客鉄道','東海旅客鉄道','西日本旅客鉄道','四国旅客鉄道','九州旅客鉄道'];
        return order.indexOf(a) - order.indexOf(b);
    });
    otherOps.sort((a, b) => opLabel(a).localeCompare(opLabel(b)));
    return [...jrOps, ...otherOps];
}

function getLineSegments(op, line) {
    return segmentsByLine.get(lineKey(op, line)) || [];
}

function getLineKm(op, line) {
    const segs = getLineSegments(op, line);
    let km = 0;
    for (const s of segs) km += s.km;
    return km;
}

function buildStationOrder(segs) {
    const next = new Map();
    const prev = new Map();
    const allStations = new Set();
    for (const s of segs) {
        if (!next.has(s.from)) next.set(s.from, s.to);
        prev.set(s.to, s.from);
        allStations.add(s.from);
        allStations.add(s.to);
    }
    let start = null;
    for (const s of allStations) { if (!prev.has(s)) { start = s; break; } }
    if (!start) start = segs[0]?.from;
    if (!start) return [];
    const ordered = [start];
    let cur = start;
    const visited = new Set([start]);
    while (next.has(cur) && !visited.has(next.get(cur))) {
        cur = next.get(cur);
        ordered.push(cur);
        visited.add(cur);
    }
    return ordered;
}

function quickSelectRange(op, line, fromSt, toSt) {
    const segs = getLineSegments(op, line);
    const order = buildStationOrder(segs);
    const fi = order.indexOf(fromSt);
    const ti = order.indexOf(toSt);
    if (fi === -1 || ti === -1) return;
    const lo = Math.min(fi, ti);
    const hi = Math.max(fi, ti);
    for (let i = lo; i < hi; i++) {
        const from = order[i];
        const to = order[i + 1];
        const seg = segs.find(s => s.from === from && s.to === to);
        if (seg) setSegRidden(op, line, seg.from, seg.to, true);
    }
    updateLineRiddenState(op, line);
    updateMapQuestState();
    updateStats();
    renderLineList();
}

function getOpProgress(op) {
    const info = allOperators.get(op);
    if (!info) return { ridden: 0, total: 0 };
    let ridden = 0;
    for (const line of info.lines) {
        if (isLineRidden(op, line)) ridden++;
    }
    return { ridden, total: info.lines.size };
}

function flyToLine(op, line) {
    const feats = allFeats.filter(f => f.properties.op === op && f.properties.line === line);
    if (!feats.length) return;
    let minLng = Infinity, minLat = Infinity, maxLng = -Infinity, maxLat = -Infinity;
    for (const f of feats) {
        for (const c of f.geometry.coordinates) {
            if (c[0] < minLng) minLng = c[0];
            if (c[0] > maxLng) maxLng = c[0];
            if (c[1] < minLat) minLat = c[1];
            if (c[1] > maxLat) maxLat = c[1];
        }
    }
    map.fitBounds([[minLng, minLat], [maxLng, maxLat]], { padding: 60, duration: 1200 });
}

function escHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

function matchesSearch(text, query) {
    if (!query) return true;
    const q = query.toLowerCase();
    const qSimp = toSimplified(q);
    const lower = text.toLowerCase();
    return lower.includes(q) || toSimplified(lower).includes(qSimp);
}

function renderLineList() {
    const listEl = document.getElementById('line-list');
    const opOrder = buildOperatorOrder();
    let html = '';

    for (const op of opOrder) {
        const info = allOperators.get(op);
        if (!info) continue;
        const lines = [...info.lines].sort();
        const prog = getOpProgress(op);
        const opColor = info.color;

        const filteredLines = searchQuery
            ? lines.filter(line => matchesSearch(line, searchQuery) || matchesSearch(op, searchQuery) || matchesSearch(opLabel(op) + ' ' + lineLabel(op, line), searchQuery))
            : lines;

        if (filteredLines.length === 0) continue;

        const isExpanded = expandedOps.has(op);
        const opSimp = simpOnly(op);

        html += `<div class="operator-group" data-op="${escHtml(op)}">`;
        html += `<div class="operator-header${isExpanded ? '' : ' collapsed'}" data-op="${escHtml(op)}">`;
        html += `<svg class="op-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>`;
        html += `<div class="op-color" style="background:${opColor}"></div>`;
        html += `<div class="op-name">${escHtml(opLabel(op))}${opSimp ? '<span class="op-simp">(' + escHtml(opSimp) + ')</span>' : ''}</div>`;
        html += `<span class="op-count">${prog.ridden}/${prog.total}</span>`;
        html += `<div class="op-progress-wrap"><div class="op-progress-fill" style="width:${prog.total ? (prog.ridden/prog.total*100) : 0}%"></div></div>`;
        html += `<button class="op-select-all" data-op="${escHtml(op)}" title="${t('select_all')}">${t('select_all')}</button>`;
        html += `</div>`;

        html += `<div class="operator-lines"${isExpanded ? '' : ' style="max-height:0;overflow:hidden"'}>`;

        for (const line of filteredLines) {
            const k = lineKey(op, line);
            const segs = getLineSegments(op, line);
            const km = getLineKm(op, line);
            const ridden = isLineRidden(op, line);
            const lineColor = colorDetailedFor(op, line);
            const lineSimp = simpOnly(line);
            const isLineExpanded = expandedLines.has(k);
            const allSegsRidden = segs.length > 0 && segs.every(s => isSegRidden(op, line, s.from, s.to));
            const someSegsRidden = segs.some(s => isSegRidden(op, line, s.from, s.to));
            const checkClass = allSegsRidden ? '' : someSegsRidden ? ' partial' : '';

            html += `<div class="line-item" data-key="${escHtml(k)}" data-op="${escHtml(op)}" data-line="${escHtml(line)}">`;
            html += `<div class="line-color-dot" style="background:${lineColor}"></div>`;
            html += `<div class="line-info" data-action="fly">`;
            html += `<div class="line-name">${escHtml(lineLabel(op, line))}${lineSimp ? '<span class="line-simp">(' + escHtml(lineSimp) + ')</span>' : ''}</div>`;
            html += `<div class="line-meta">${segs.length} ${t('segments_label')} · ${km.toFixed(1)} ${t('km')}</div>`;
            html += `</div>`;

            if (mode === 'detailed' && segs.length > 0) {
                html += `<div class="line-check${checkClass}" data-action="toggle-line">`;
                html += `<input type="checkbox" ${allSegsRidden ? 'checked' : ''}>`;
                html += `<span class="checkmark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg></span>`;
                html += `</div>`;
                html += `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;margin-left:4px;margin-top:3px;cursor:pointer;color:var(--text-muted);transition:transform 0.2s${isLineExpanded ? ';transform:rotate(180deg)' : ''}" data-action="expand-segs"><polyline points="6 9 12 15 18 9"/></svg>`;
            } else {
                html += `<div class="line-check${checkClass}" data-action="toggle-line">`;
                html += `<input type="checkbox" ${allSegsRidden ? 'checked' : ''}>`;
                html += `<span class="checkmark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg></span>`;
                html += `</div>`;
            }
            html += `</div>`;

            if (mode === 'detailed') {
                const stationOrder = buildStationOrder(segs);
                const qsId = 'qs-' + k.replace(/\|\|/g, '--');
                html += `<div class="segments-wrap${isLineExpanded ? ' open' : ''}">`;

                // Quick select range
                if (stationOrder.length >= 2) {
                    html += `<div class="quick-select-wrap" data-op="${escHtml(op)}" data-line="${escHtml(line)}">`;
                    html += `<div class="quick-select-header">`;
                    html += `<svg class="qs-toggle${isLineExpanded ? '' : ''}" data-action="qs-toggle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>`;
                    html += `<span>${t('quick_select')}</span>`;
                    html += `</div>`;
                    html += `<div class="quick-select-body" id="${qsId}">`;
                    html += `<div class="qs-field"><label>${t('quick_from')}</label><select data-action="qs-from">`;
                    html += `<option value="">${t('quick_placeholder')}</option>`;
                    for (const st of stationOrder) html += `<option value="${escHtml(st)}">${escHtml(st)}</option>`;
                    html += `</select></div>`;
                    html += `<div class="qs-field"><label>${t('quick_to')}</label><select data-action="qs-to">`;
                    html += `<option value="">${t('quick_placeholder')}</option>`;
                    for (const st of stationOrder) html += `<option value="${escHtml(st)}">${escHtml(st)}</option>`;
                    html += `</select></div>`;
                    html += `<button class="qs-apply" data-action="qs-apply" disabled>${t('quick_apply')}</button>`;
                    html += `</div></div>`;
                }

                // Individual segments
                for (const seg of segs) {
                    const segRidden = isSegRidden(op, line, seg.from, seg.to);
                    html += `<div class="segment-item${segRidden ? ' ridden' : ''}" data-action="toggle-seg" data-from="${escHtml(seg.from)}" data-to="${escHtml(seg.to)}" data-op="${escHtml(op)}" data-line="${escHtml(line)}">`;
                    html += `<div class="seg-check"><input type="checkbox" ${segRidden ? 'checked' : ''}><span class="checkmark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg></span></div>`;
                    html += `<span>${escHtml(seg.from)}</span><span class="seg-arrow">→</span><span>${escHtml(seg.to)}</span>`;
                    html += `<span class="seg-km">${seg.km.toFixed(1)} ${t('km')}</span>`;
                    html += `</div>`;
                }
                html += `</div>`;
            }
        }

        html += `</div></div>`;
    }

    if (!html) {
        html = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:12px;">No results</div>';
    }

    listEl.innerHTML = html;
    attachListEvents();
}

function attachListEvents() {
    document.querySelectorAll('.operator-header').forEach(el => {
        el.addEventListener('click', (e) => {
            if (e.target.closest('.op-select-all')) return;
            const op = el.dataset.op;
            if (expandedOps.has(op)) expandedOps.delete(op);
            else expandedOps.add(op);
            const linesEl = el.nextElementSibling;
            if (linesEl) {
                if (el.classList.contains('collapsed')) {
                    el.classList.remove('collapsed');
                    linesEl.style.maxHeight = linesEl.scrollHeight + 'px';
                    setTimeout(() => { linesEl.style.maxHeight = 'none'; }, 300);
                } else {
                    el.classList.add('collapsed');
                    linesEl.style.maxHeight = linesEl.scrollHeight + 'px';
                    requestAnimationFrame(() => { linesEl.style.maxHeight = '0'; });
                }
            }
        });
    });

    document.querySelectorAll('.op-select-all').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const op = btn.dataset.op;
            const info = allOperators.get(op);
            if (!info) return;
            const prog = getOpProgress(op);
            const allDone = prog.ridden === prog.total;
            for (const line of info.lines) {
                setLineRidden(op, line, !allDone);
                const segs = getLineSegments(op, line);
                for (const seg of segs) {
                    setSegRidden(op, line, seg.from, seg.to, !allDone);
                }
            }
            updateMapQuestState();
            updateStats();
            renderLineList();
        });
    });

    document.querySelectorAll('[data-action="fly"]').forEach(el => {
        el.addEventListener('click', (e) => {
            if (e.target.closest('[data-action="toggle-line"]') || e.target.closest('[data-action="expand-segs"]')) return;
            const item = el.closest('.line-item');
            if (item) {
                flyToLine(item.dataset.op, item.dataset.line);
            }
        });
    });

    document.querySelectorAll('[data-action="toggle-line"]').forEach(el => {
        el.addEventListener('click', (e) => {
            e.stopPropagation();
            const item = el.closest('.line-item');
            if (item) {
                toggleLineRidden(item.dataset.op, item.dataset.line);
                updateMapQuestState();
                updateStats();
                renderLineList();
            }
        });
    });

    document.querySelectorAll('[data-action="expand-segs"]').forEach(el => {
        el.addEventListener('click', (e) => {
            e.stopPropagation();
            const item = el.closest('.line-item');
            if (!item) return;
            const k = item.dataset.key;
            if (expandedLines.has(k)) expandedLines.delete(k);
            else expandedLines.add(k);
            const wrap = item.nextElementSibling;
            if (wrap && wrap.classList.contains('segments-wrap')) {
                wrap.classList.toggle('open');
            }
            el.style.transform = expandedLines.has(k) ? 'rotate(180deg)' : '';
        });
    });

    document.querySelectorAll('[data-action="toggle-seg"]').forEach(el => {
        el.addEventListener('click', (e) => {
            const op = el.dataset.op;
            const line = el.dataset.line;
            const from = el.dataset.from;
            const to = el.dataset.to;
            toggleSegRidden(op, line, from, to);
            updateMapQuestState();
            updateStats();
            renderLineList();
        });
    });
}

// Search
document.getElementById('search-input').addEventListener('input', (e) => {
    searchQuery = e.target.value.trim();
    if (searchQuery) {
        expandedOps.clear();
        const opOrder = buildOperatorOrder();
        for (const op of opOrder) {
            const info = allOperators.get(op);
            if (!info) continue;
            for (const line of info.lines) {
                if (matchesSearch(line, searchQuery) || matchesSearch(op, searchQuery)) {
                    expandedOps.add(op);
                    break;
                }
            }
        }
    }
    renderLineList();
});

// Language
document.querySelectorAll('#lang-toggle span').forEach(span => {
    span.addEventListener('click', () => {
        lang = span.dataset.lang;
        applyLang();
        updateStats();
    });
});

// Export
document.getElementById('btn-export').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(questData, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'minijapanrail_quest_' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast(t('exported'));
});

// Import
document.getElementById('btn-import').addEventListener('click', () => {
    document.getElementById('import-file').click();
});
document.getElementById('import-file').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
        try {
            const data = JSON.parse(reader.result);
            if (data && typeof data.lines === 'object' && typeof data.segments === 'object') {
                questData = { lines: data.lines, segments: data.segments };
                saveQuestData();
                updateMapQuestState();
                updateStats();
                renderLineList();
                showToast(t('imported'));
            } else {
                showToast(t('import_error'));
            }
        } catch (err) {
            showToast(t('import_error'));
        }
    };
    reader.readAsText(file);
    e.target.value = '';
});

// Clear
document.getElementById('btn-clear').addEventListener('click', () => {
    document.getElementById('modal-clear').classList.add('show');
});
document.getElementById('clear-cancel').addEventListener('click', () => {
    document.getElementById('modal-clear').classList.remove('show');
});
document.getElementById('clear-confirm').addEventListener('click', () => {
    questData = { lines: {}, segments: {} };
    saveQuestData();
    updateMapQuestState();
    updateStats();
    renderLineList();
    document.getElementById('modal-clear').classList.remove('show');
    showToast(t('cleared'));
});

// Share
document.getElementById('btn-share').addEventListener('click', () => {
    let totalLines = 0, riddenLines = 0;
    let totalSegs = 0, riddenSegs = 0;
    let totalKm = 0, riddenKm = 0;
    for (const [k, segs] of segmentsByLine) {
        totalLines++;
        const [op, line] = k.split('||');
        if (isLineRidden(op, line)) riddenLines++;
        for (const seg of segs) {
            totalSegs++;
            totalKm += seg.km;
            if (isSegRidden(op, line, seg.from, seg.to)) { riddenSegs++; riddenKm += seg.km; }
        }
    }
    const pct = totalKm ? (riddenKm / totalKm * 100).toFixed(1) : '0';

    const title = lang === 'ja' ? '🇯🇵 Mini JapanRail · 日本鉄道制霸 進捗' : lang === 'zh' ? '🇯🇵 Mini JapanRail · 日本铁路制霸 进度' : '🇯🇵 Mini JapanRail · Japan Railway Conquest Progress';
    const text = `${title}\n` +
        `━━━━━━━━━━━━━━━━━━━━\n` +
        `${t('stats_lines')}: ${riddenLines}/${totalLines} (${totalLines ? Math.round(riddenLines/totalLines*100) : 0}%)\n` +
        `${t('stats_segments')}: ${riddenSegs}/${totalSegs} (${totalSegs ? Math.round(riddenSegs/totalSegs*100) : 0}%)\n` +
        `${t('stats_km')}: ${riddenKm.toFixed(1)}/${totalKm.toFixed(1)} km (${pct}%)\n` +
        `━━━━━━━━━━━━━━━━━━━━\n` +
        `Progress bar: [${'█'.repeat(Math.round(pct/5))}${'░'.repeat(20 - Math.round(pct/5))}] ${pct}%`;

    document.getElementById('share-content').innerHTML =

    document.getElementById('modal-share').classList.add('show');

    document.getElementById('share-copy').onclick = () => {
        navigator.clipboard.writeText(text).then(() => showToast(t('copied')));

document.getElementById('share-close').addEventListener('click', () => {

});

let posterOrientation = 'landscape';
let posterTheme = 'light';

function getQuestStats() {
    let totalLines = 0, riddenLines = 0;
    let totalSegs = 0, riddenSegs = 0;
    let totalKm = 0, riddenKm = 0;
    const opStats = new Map();
    for (const [k, segs] of segmentsByLine) {
        totalLines++;
        const [op, line] = k.split('||');
        const lineRidden = isLineRidden(op, line);
        if (lineRidden) riddenLines++;
        let lineKm = 0, lineRiddenKm = 0;
        for (const seg of segs) {
            totalSegs++;
            totalKm += seg.km;
            const segR = isSegRidden(op, line, seg.from, seg.to);
            if (segR) { riddenSegs++; riddenKm += seg.km; lineRiddenKm += seg.km; }
            lineKm += seg.km;
        }
        if (!opStats.has(op)) opStats.set(op, { ridden: 0, total: 0, riddenKm: 0, totalKm: 0 });
        const os = opStats.get(op);
        os.total++;
        os.totalKm += lineKm;
        if (lineRidden || lineRiddenKm > 0) { os.ridden++; os.riddenKm += lineRiddenKm; }
    }
    return { totalLines, riddenLines, totalSegs, riddenSegs, totalKm, riddenKm, opStats };
}

function captureMapForPoster() {
    return new Promise((resolve) => {
        const z = map.getZoom();
        const saved = { center: map.getCenter(), zoom: map.getZoom(), bearing: map.getBearing(), pitch: map.getPitch() };
        const savedView = viewMode;
        const hasRidden = Object.keys(questData.lines).length > 0 || Object.keys(questData.segments).length > 0;
        viewMode = hasRidden ? 'ridden' : 'all';

        function doCapture() {
            updateMapQuestState();
            requestAnimationFrame(() => {
                const dataUrl = map.getCanvas().toDataURL('image/png');
                viewMode = savedView;
                map.jumpTo(saved);
                updateMapQuestState();
                resolve(dataUrl);
            });
        }

        if (z > 5.5) {
            map.fitBounds([[129.0, 30.5], [146.5, 46.0]], { animate: false, padding: 20 });
            map.once('idle', doCapture);
        } else {
            doCapture();
        }
    });
}

async function generatePoster(orient) {
    const W = orient === 'landscape' ? 1920 : 1080;
    const H = orient === 'landscape' ? 1080 : 1920;
    const canvas = document.createElement('canvas');
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d');
    const isL = orient === 'landscape';

    const stats = getQuestStats();
    const pctLines = stats.totalLines ? (stats.riddenLines / stats.totalLines * 100) : 0;
    const pctSegs = stats.totalSegs ? (stats.riddenSegs / stats.totalSegs * 100) : 0;
    const pctKm = stats.totalKm ? (stats.riddenKm / stats.totalKm * 100) : 0;

    const mapDataUrl = await captureMapForPoster();
    const mapImg = new Image();
    mapImg.src = mapDataUrl;

    const dark = posterTheme === 'dark';
    const bg = dark ? '#0a0e14' : '#fafafa';
    const fg = dark ? '#e8ecf1' : '#111';
    const fg2 = dark ? '#8b939e' : '#b0b0b0';
    const fg3 = dark ? '#59616d' : '#ccc';
    const fg4 = dark ? '#3a414c' : '#e5e5e5';
    const fg5 = dark ? '#2a3040' : '#eee';
    const tagBg = dark ? '#555' : '#555';

    // Collect ridden lines grouped by operator
    const riddenByOp = new Map();
    for (const [k, segs] of segmentsByLine) {
        const [op, line] = k.split('||');
        if (isLineRidden(op, line) || segs.some(s => isSegRidden(op, line, s.from, s.to))) {
            if (!riddenByOp.has(op)) riddenByOp.set(op, []);
            riddenByOp.get(op).push({ line, color: colorDetailedFor(op, line) });
        }
    }
    let riddenCount = 0;
    for (const [, lines] of riddenByOp) riddenCount += lines.length;

    return new Promise((resolve) => {
        mapImg.onload = () => {
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, W, H);

            // ── Map ──
            let mapW, mapH;
            if (isL) { mapW = Math.round(W * 0.50); mapH = H; }
            else { mapW = W; mapH = Math.round(H * 0.40); }
            ctx.save();
            ctx.beginPath(); ctx.rect(0, 0, mapW, mapH); ctx.clip();
            const ia = mapImg.width / mapImg.height, ba = mapW / mapH;
            let sx = 0, sy = 0, sw = mapImg.width, sh = mapImg.height;
            if (ia > ba) { sw = mapImg.height * ba; sx = (mapImg.width - sw) / 2; }
            else { sh = mapImg.width / ba; sy = (mapImg.height - sh) / 2; }
            ctx.drawImage(mapImg, sx, sy, sw, sh, 0, 0, mapW, mapH);
            ctx.restore();

            ctx.fillStyle = fg4;
            if (isL) ctx.fillRect(mapW, 0, 1, H);
            else ctx.fillRect(0, mapH, W, 1);

            const pad = isL ? 64 : 44;
            const cx = isL ? mapW + pad : pad;
            const cw = isL ? W - mapW - pad * 2 : W - pad * 2;
            let cy = isL ? pad : mapH + pad;
            const bottom = H - pad;

            // ── Title + Date ──
            const nickname = document.getElementById('poster-nickname').value.trim();
            ctx.fillStyle = fg;
            ctx.font = `900 ${isL ? 26 : 20}px "Noto Sans CJK JP","Hiragino Sans",system-ui,sans-serif`;
            const title = lang === 'ja' ? 'Mini JapanRail · 日本鉄道制霸' : lang === 'zh' ? 'Mini JapanRail · 日本铁路制霸' : 'Mini JapanRail · Japan Railway Conquest';
            ctx.fillText(title, cx, cy + (isL ? 24 : 18));
            ctx.fillStyle = fg2;
            ctx.font = `400 ${isL ? 11 : 9}px system-ui,sans-serif`;
            const d = new Date().toLocaleDateString(lang === 'ja' ? 'ja-JP' : lang === 'zh' ? 'zh-CN' : 'en-US', { year: 'numeric', month: 'long', day: 'numeric' });
            const dateLine = nickname ? `${nickname}  ·  ${d}` : d;
            ctx.fillText(dateLine, cx, cy + (isL ? 42 : 32));
            cy += isL ? 64 : 48;

            // ── Hero number ──
            ctx.fillStyle = fg;
            ctx.font = `100 ${isL ? 100 : 72}px system-ui,sans-serif`;
            const pctStr = pctKm.toFixed(1);
            ctx.fillText(pctStr, cx, cy + (isL ? 76 : 56));
            const pnw = ctx.measureText(pctStr).width;
            ctx.fillStyle = fg3;
            ctx.font = `200 ${isL ? 32 : 24}px system-ui,sans-serif`;
            ctx.fillText('%', cx + pnw + 2, cy + (isL ? 76 : 56));
            cy += isL ? 96 : 72;

            // ── Three stat items in a row ──
            const colGap = isL ? 24 : 16;
            const colW = (cw - colGap * 2) / 3;

            function drawStat(label, value, x, y) {
                ctx.fillStyle = fg2;
                ctx.font = `500 ${isL ? 9 : 7}px system-ui,sans-serif`;
                ctx.fillText(label, x, y);
                ctx.fillStyle = fg;
                ctx.font = `600 ${isL ? 22 : 16}px system-ui,sans-serif`;
                ctx.fillText(value, x, y + (isL ? 26 : 20));
            }

            const sl = lang === 'ja' ? '路線' : lang === 'zh' ? '线路' : 'Lines';
            const ss = lang === 'ja' ? '区間' : lang === 'zh' ? '区间' : 'Segments';
            const sd = lang === 'ja' ? '乗車距離' : lang === 'zh' ? '乘车距离' : 'Distance';
            drawStat(sl, `${stats.riddenLines} / ${stats.totalLines}`, cx, cy);
            drawStat(ss, `${stats.riddenSegs} / ${stats.totalSegs}`, cx + colW + colGap, cy);
            drawStat(sd, `${stats.riddenKm.toFixed(0)} / ${stats.totalKm.toFixed(0)} km`, cx + (colW + colGap) * 2, cy);
            cy += isL ? 60 : 46;

            // ── Single progress bar ──
            ctx.fillStyle = fg5;
            ctx.fillRect(cx, cy, cw, 3);
            if (pctKm > 0) { ctx.fillStyle = fg; ctx.fillRect(cx, cy, cw * pctKm / 100, 3); }
            cy += isL ? 28 : 20;

            ctx.fillStyle = fg4;
            ctx.fillRect(cx, cy, cw, 1);
            cy += isL ? 20 : 14;

            // ── Bottom section: two-column on landscape ──
            const ops = [...stats.opStats.entries()]
                .filter(([, v]) => v.ridden > 0)
                .sort((a, b) => b[1].riddenKm - a[1].riddenKm);

            if (isL) {
                // ── Landscape: two columns ──
                const halfW = (cw - 40) / 2;
                const col2x = cx + halfW + 40;
                let ly = cy, ry = cy;

                // Left: Operators
                ctx.fillStyle = fg2;
                ctx.font = `500 9px system-ui,sans-serif`;
                ctx.fillText((lang === 'ja' ? '事業者' : lang === 'zh' ? '运营商' : 'OPERATORS').toUpperCase(), cx, ly + 6);
                ly += 22;

                for (const [op, v] of ops) {
                    if (ly + 22 > bottom) break;
                    const info = allOperators.get(op);
                    ctx.fillStyle = info ? info.color : '#999';
                    ctx.fillRect(cx, ly + 3, 10, 10);
                    ctx.fillStyle = fg;
                    ctx.font = `500 11px system-ui,sans-serif`;
                    ctx.fillText(opLabel(op), cx + 18, ly + 12);
                    ctx.fillStyle = fg3;
                    ctx.font = `400 10px system-ui,sans-serif`;
                    ctx.textAlign = 'right';
                    ctx.fillText(`${v.ridden} / ${v.total}`, cx + halfW, ly + 12);
                    ctx.textAlign = 'left';
                    ly += 24;
                }

                // Divider between columns
                ctx.fillStyle = fg4;
                ctx.fillRect(cx + halfW + 20, cy, 1, bottom - cy);

                // Right: Ridden lines by operator
                ctx.fillStyle = fg2;
                ctx.font = `500 9px system-ui,sans-serif`;
                ctx.fillText(`${riddenCount} ${(lang === 'ja' ? '路線 乗車済み' : lang === 'zh' ? '条线路已乘坐' : 'LINES RIDDEN')}`.toUpperCase(), col2x, ry + 6);
                ry += 22;

                const fSize = 10;
                const tagH = 18;
                for (const [op, lines] of riddenByOp) {
                    if (ry + 14 > bottom) break;
                    ctx.fillStyle = allOperators.get(op)?.color || '#999';
                    ctx.beginPath(); ctx.arc(col2x + 4, ry + 6, 3, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = fg2;
                    ctx.font = `500 ${fSize}px system-ui,sans-serif`;
                    ctx.fillText(opLabel(op), col2x + 14, ry + 9);
                    ry += 17;

                    let lx = col2x + 8;
                    ctx.font = `400 ${fSize}px system-ui,sans-serif`;
                    for (const rl of lines) {
                        if (ry + tagH > bottom) break;
                        const name = lineLabel(op, rl.line);
                        const nw = ctx.measureText(name).width;
                        const tagW = nw + 12;
                        if (lx + tagW > col2x + halfW) { lx = col2x + 8; ry += tagH + 3; if (ry + tagH > bottom) break; }
                        ctx.fillStyle = rl.color;
                        ctx.fillRect(lx, ry + 1, 2, tagH - 2);
                        ctx.fillStyle = dark ? '#c0c5cc' : '#555';
                        ctx.fillText(name, lx + 6, ry + tagH / 2 + 3);
                        lx += tagW + 3;
                    }
                    ry += tagH + 6;
                }

            } else {
                // ── Portrait: single column ──
                // Operators
                ctx.fillStyle = fg2;
                ctx.font = `500 7px system-ui,sans-serif`;
                ctx.fillText((lang === 'ja' ? '事業者' : lang === 'zh' ? '运营商' : 'OPERATORS').toUpperCase(), cx, cy + 6);
                cy += 18;

                for (const [op, v] of ops.slice(0, 8)) {
                    if (cy + 20 > bottom - 20) break;
                    const info = allOperators.get(op);
                    ctx.fillStyle = info ? info.color : '#999';
                    ctx.fillRect(cx, cy + 3, 10, 10);
                    ctx.fillStyle = fg;
                    ctx.font = `500 10px system-ui,sans-serif`;
                    ctx.fillText(opLabel(op), cx + 18, cy + 12);
                    ctx.fillStyle = fg3;
                    ctx.font = `400 9px system-ui,sans-serif`;
                    ctx.textAlign = 'right';
                    ctx.fillText(`${v.ridden} / ${v.total}`, cx + cw, cy + 12);
                    ctx.textAlign = 'left';
                    cy += 22;
                }

                // Lines
                cy += 6;
                ctx.fillStyle = fg4;
                ctx.fillRect(cx, cy, cw, 1);
                cy += 14;

                ctx.fillStyle = fg2;
                ctx.font = `500 7px system-ui,sans-serif`;
                ctx.fillText(`${riddenCount} ${(lang === 'ja' ? '路線 乗車済み' : lang === 'zh' ? '条线路已乘坐' : 'LINES RIDDEN')}`.toUpperCase(), cx, cy + 6);
                cy += 16;

                const fSize = 8;
                const tagH = 15;
                for (const [op, lines] of riddenByOp) {
                    if (cy + 12 > bottom) break;
                    ctx.fillStyle = allOperators.get(op)?.color || '#999';
                    ctx.beginPath(); ctx.arc(cx + 4, cy + 5, 3, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = fg2;
                    ctx.font = `500 ${fSize}px system-ui,sans-serif`;
                    ctx.fillText(opLabel(op), cx + 14, cy + 8);
                    cy += 15;

                    let lx = cx + 8;
                    ctx.font = `400 ${fSize}px system-ui,sans-serif`;
                    for (const rl of lines) {
                        if (cy + tagH > bottom) break;
                        const name = lineLabel(op, rl.line);
                        const nw = ctx.measureText(name).width;
                        const tagW = nw + 12;
                        if (lx + tagW > cx + cw) { lx = cx + 8; cy += tagH + 3; if (cy + tagH > bottom) break; }
                        ctx.fillStyle = rl.color;
                        ctx.fillRect(lx, cy + 1, 2, tagH - 2);
                        ctx.fillStyle = dark ? '#c0c5cc' : '#555';
                        ctx.fillText(name, lx + 6, cy + tagH / 2 + 3);
                        lx += tagW + 3;
                    }
                    cy += tagH + 5;
                }
            }

            // ── Watermark ──
            ctx.fillStyle = dark ? '#2a3040' : '#ddd';
            ctx.font = `400 ${isL ? 9 : 7}px system-ui,sans-serif`;
            ctx.textAlign = 'right';
            ctx.fillText('minijapanrail.quest', W - pad, H - (isL ? 20 : 16));
            ctx.textAlign = 'left';

            resolve(canvas);
        };
        mapImg.onerror = () => resolve(canvas);
    });
}

async function renderPosterPreview() {
    const previewEl = document.getElementById('poster-preview');
    const genEl = document.getElementById('poster-generating');
    previewEl.style.display = 'none';
    genEl.style.display = 'block';

    const posterCanvas = await generatePoster(posterOrientation);
    const previewW = posterOrientation === 'landscape' ? 1920 : 1080;
    const previewH = posterOrientation === 'landscape' ? 1080 : 1920;
    previewEl.width = previewW;
    previewEl.height = previewH;
    const pctx = previewEl.getContext('2d');
    pctx.drawImage(posterCanvas, 0, 0);

    genEl.style.display = 'none';
    previewEl.style.display = 'block';
}

document.getElementById('poster-download').addEventListener('click', async () => {
    const btn = document.getElementById('poster-download');
    btn.disabled = true;
    btn.textContent = '...';
    try {
        const posterCanvas = await generatePoster(posterOrientation);
        const blob = await new Promise(r => posterCanvas.toBlob(r, 'image/png'));
        const filename = `minijapanrail_quest_${posterOrientation}_${new Date().toISOString().slice(0, 10)}.png`;

        if (navigator.share && navigator.canShare) {
            const file = new File([blob], filename, { type: 'image/png' });
            try {
                await navigator.share({ title: filename, files: [file] });
                showToast(t('poster_exported'));
                return;
            } catch (e) { /* fall through to download */ }
        }

        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        showToast(t('poster_exported'));
    } finally {
        btn.disabled = false;
        btn.textContent = t('poster_download');
    }
});

document.getElementById('poster-close').addEventListener('click', () => {
    document.getElementById('modal-poster').classList.remove('show');
});

// Close modals on overlay click
document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', (e) => {
        if (e.target === overlay) overlay.classList.remove('show');
    });
});

// Toast
function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
}

// Keyboard
window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        document.querySelectorAll('.modal-overlay.show').forEach(m => m.classList.remove('show'));
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        document.getElementById('search-input').focus();
    }
});
