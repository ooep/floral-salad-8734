// Helper: add simplified Chinese annotation if different from original
function simpAnnot(text) {
    const s = toSimplified(text);
    return s !== text ? text + '<span style="color:#59616d;font-size:0.85em">(' + s + ')</span>' : text;
}
function simpOnly(text) {
    const s = toSimplified(text);
    return s !== text ? s : '';

function colorOpFor(op) { return JR[op] ? JR[op].color : OTHER_COLOR; }
function colorLineFor(op, ln) {
    const m = LINE_COLORS[op];
    if (m) {
        if (m[ln]) return m[ln];
        for (const k in m) {
            if (!k.includes('・')) continue;
            for (const part of k.split('・')) {
                if (part === ln || part + '線' === ln) return m[k];
            }
        }
        if (!ln.endsWith('本線')) { const base = ln.replace(/線$/, ''); if (m[base + '本線']) return m[base + '本線']; }
        if (ln.endsWith('本線')) { const short = ln.replace('本線', '線'); if (m[short]) return m[short]; }
    }
    return JR[op] ? JR[op].color : OTHER_COLOR;
}
function colorDetailedFor(op, ln) {
    const m = LINE_COLORS_DETAILED[op];
    if (m) {
        if (m[ln]) return m[ln];
        for (const k in m) {
            if (!k.includes('・')) continue;
            for (const part of k.split('・')) {
                if (part === ln || part + '線' === ln) return m[k];
            }
        }
        // try 本線 variant: 奥羽線 → 奥羽本線, 羽越線 → 羽越本線 etc.
        if (!ln.endsWith('本線')) {
            const base = ln.replace(/線$/, '');
            if (m[base + '本線']) return m[base + '本線'];
        }
        // try without 本: 奥羽本線 → 奥羽線
        if (ln.endsWith('本線')) {
            const short = ln.replace('本線', '線');
            if (m[short]) return m[short];
        }
        // try partial/substring match against combined keys
        for (const k in m) {
            if (k.includes(ln) || ln.includes(k)) return m[k];
        }
    }
    // also try the line alias map
    const alias = LINE_ALIASES[op + '||' + ln];
    if (alias) return colorDetailedFor(op, alias);

}

            if (nl.includes(q) || toSimplified(nl).includes(qSimp)) {
                map.flyTo({ center: f.geometry.coordinates, zoom: 12, duration: 1200 });
                const feat = allFeats.find(ff => ff.properties.op === p.op && ff.properties.line === p.line);
                if (feat) setLineSelection(feat.properties);
                return true;
            }
        }
        return false;
    }

    function flyToLine(lineName, operatorName) {
        const q = lineName.toLowerCase();
        const qSimp = toSimplified(q);
        const opQ = operatorName ? operatorName.toLowerCase() : '';
        const opQSimp = operatorName ? toSimplified(opQ) : '';

        function matchLine(f) {
            const p = f.properties;
            const ll = p.line.toLowerCase();
            const ol = p.op.toLowerCase();
            const lineOk = ll === q || toSimplified(ll) === qSimp;
            const opOk = !operatorName || ol === opQ || toSimplified(ol) === opQSimp;
            return lineOk && opOk;
        }
        function matchLineFuzzy(f) {
            const p = f.properties;
            const ll = p.line.toLowerCase();
            const ol = p.op.toLowerCase();
            const lineOk = ll.includes(q) || toSimplified(ll).includes(qSimp);
            const opOk = !operatorName || ol.includes(opQ) || toSimplified(ol).includes(opQSimp);
            return lineOk && opOk;
        }

        const feats = allFeats.filter(matchLine).length ? allFeats.filter(matchLine) : allFeats.filter(matchLineFuzzy);
        if (feats.length) {
            let minLng = Infinity, minLat = Infinity, maxLng = -Infinity, maxLat = -Infinity;
            for (const f of feats) {
                for (const c of f.geometry.coordinates) {
                    if (c[0] < minLng) minLng = c[0];
                    if (c[0] > maxLng) maxLng = c[0];
                    if (c[1] < minLat) minLat = c[1];
                    if (c[1] > maxLat) maxLat = c[1];
                }
            }
            map.fitBounds([[minLng, minLat], [maxLng, maxLat]], { padding: 60, duration: 1200 });
            setLineSelection(feats[0].properties);
            return true;
        }
        return false;
    }

    if (stationParam) {
        flyToStation(stationParam);
    } else if (lineParam) {
        flyToLine(lineParam, opParam);
    } else if (qParam) {
        if (!flyToStation(qParam)) flyToLine(qParam, null);
    }
    // Enable URL updates after initial load
    skipUrlUpdate = false;
});

// ─────────────────────────── selection / info ────────────────────────────
function selCond(s) {
    const t = [['==', ['get', 'op'], s.op], ['==', ['get', 'line'], s.line]];
    if (s.mode === 'segment') {
        t.push(['==', ['get', 'from'], s.from], ['==', ['get', 'to'], s.to]);
    }
    return ['all', ...t];
}

const STN_NEAR_DEG2 = 0.004 * 0.004;
function recomputeSelStationIds() {
    selStationIds = new Set();
    if (!selected || !sfcData) return;
    if (selected.mode === 'segment') {
        const segs = allFeats.filter(f =>
            f.properties.op === selected.op && f.properties.line === selected.line
            && f.properties.from === selected.from && f.properties.to === selected.to);
        if (!segs.length) return;
        for (const f of sfcData.features) {
            if (f.properties.station !== selected.from && f.properties.station !== selected.to) continue;
            const [sx, sy] = f.geometry.coordinates;
            for (const sg of segs) {
                let hit = false;
                for (const c of sg.geometry.coordinates) {
                    const dx = c[0] - sx, dy = c[1] - sy;
                    if (dx * dx + dy * dy < STN_NEAR_DEG2) { hit = true; break; }
                }
                if (hit) { selStationIds.add(f.id); break; }
            }
        }
        return;
    }
    const names = stationsOnSelectedLine();
    const segs = allFeats.filter(f =>
        f.properties.op === selected.op && f.properties.line === selected.line);
    if (!names.size || !segs.length) return;
    for (const sg of segs) {
        if (sg._bbox) continue;
        let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
        for (const c of sg.geometry.coordinates) {
            if (c[0] < minx) minx = c[0]; if (c[0] > maxx) maxx = c[0];
            if (c[1] < miny) miny = c[1]; if (c[1] > maxy) maxy = c[1];
        }
        sg._bbox = [minx, miny, maxx, maxy];
    }
    const PAD = 0.005;
    for (const f of sfcData.features) {
        if (!names.has(f.properties.station)) continue;
        const [sx, sy] = f.geometry.coordinates;
        let hit = false;
        for (const sg of segs) {
            const [minx, miny, maxx, maxy] = sg._bbox;
            if (sx < minx - PAD || sx > maxx + PAD || sy < miny - PAD || sy > maxy + PAD) continue;
            for (const c of sg.geometry.coordinates) {
                const dx = c[0] - sx, dy = c[1] - sy;
                if (dx * dx + dy * dy < STN_NEAR_DEG2) { hit = true; break; }
            }
            if (hit) break;
        }
        if (hit) selStationIds.add(f.id);
    }
}
function pushStationFeatureState() {
    if (!sfcData) return;
    for (const f of sfcData.features) {
        const on = selStationIds.has(f.id);
        map.setFeatureState({ source: 'stations', id: f.id }, { onLine: on });
    }
}

function applySelection() {
    if (!selected) {
        map.setFilter('segs-casing', NO_MATCH);
        map.setPaintProperty('segs-line', 'line-opacity', 0.92);
        if (map.getLayer('station-dots')) {
            map.setPaintProperty('station-dots', 'circle-opacity', 0.92);
            map.setPaintProperty('station-dots', 'circle-stroke-width', 0);
        }
        if (map.getLayer('station-labels')) {
            map.setPaintProperty('station-labels', 'text-opacity', 1);
        }
        if (map.getLayer('transfer-dots')) {
            map.setPaintProperty('transfer-dots', 'circle-opacity', 0.92);
            map.setPaintProperty('transfer-dots', 'circle-stroke-width', 0);
        }
        selStationIds = new Set();
        pushStationFeatureState();
        return;
    }
    const cond = selCond(selected);
    map.setFilter('segs-casing', cond);
    map.setPaintProperty('segs-line', 'line-opacity', ['case', cond, 0.97, 0.13]);

    recomputeSelStationIds();
    pushStationFeatureState();

    if (map.getLayer('station-dots')) {
        const onLine = ['boolean', ['feature-state', 'onLine'], false];
        map.setPaintProperty('station-dots', 'circle-opacity', ['case', onLine, 0.95, 0.08]);
        map.setPaintProperty('station-dots', 'circle-stroke-color', selected.color);
        map.setPaintProperty('station-dots', 'circle-stroke-width', ['case', onLine, 1.5, 0]);
    }
    if (map.getLayer('station-labels')) {
        const onLine = ['boolean', ['feature-state', 'onLine'], false];
        map.setPaintProperty('station-labels', 'text-opacity', ['case', onLine, 1, 0.1]);
    }
    if (map.getLayer('transfer-dots')) {
        const onLine = ['boolean', ['feature-state', 'onLine'], false];
        map.setPaintProperty('transfer-dots', 'circle-opacity', ['case', onLine, 0.95, 0.15]);
        map.setPaintProperty('transfer-dots', 'circle-stroke-color', selected.color);
        map.setPaintProperty('transfer-dots', 'circle-stroke-width', ['case', onLine, 1.5, 0]);
    }
}

let skipUrlUpdate = true; // skip URL update on initial load from URL params

function updateUrl(params) {
    if (skipUrlUpdate) return;
    const url = new URL(window.location);
    // Clear existing selection params
    url.searchParams.delete('station');
    url.searchParams.delete('line');
    url.searchParams.delete('op');
    url.searchParams.delete('q');
    // Set new params
    for (const [k, v] of Object.entries(params)) {
        if (v) url.searchParams.set(k, v);
    }
    // Preserve lang param
    if (lang !== 'en') url.searchParams.set('lang', lang);
    else url.searchParams.delete('lang');
    history.replaceState(null, '', url);
}

function setLineSelection(p) {
    selected = { mode: 'line', op: p.op, line: p.line, color: p.color };
    applySelection();
    renderInfo();
    updateUrl({ line: p.line, op: p.op });
}

function setSegmentSelection(p) {
    selected = { mode: 'segment', op: p.op, line: p.line,
                 from: p.from, to: p.to, color: p.color, km: p.km };
    applySelection();
    renderInfo();
    updateUrl({ line: p.line, op: p.op, from: p.from, to: p.to });
}

function selectSegment(p) {
    if (selected && selected.mode === 'segment'
        && selected.op === p.op && selected.line === p.line
        && selected.from === p.from && selected.to === p.to) {
        clearSelection(); return;
    }
    setSegmentSelection(p);
}

function clearSelection() {
    if (!selected) return;
    selected = null;
    applySelection();
    document.getElementById('info').style.display = 'none';
    updateUrl({});
}

// ─────────────────────────── colour mode ─────────────────────────────────
function setColorMode(mode) {
    if (mode === colorMode) return;
    colorMode = mode;
    for (const f of allFeats) {
        const p = f.properties;
        p.color = colorMode === 'line' ? p.colorLine : colorMode === 'detailed' ? p.colorDetailed : p.colorOp;
    }
    if (fcData) map.getSource('segs').setData(fcData);
    if (selected) {
        const f = allFeats.find(x => x.properties.op === selected.op
                                  && x.properties.line === selected.line);
        if (f) selected.color = f.properties.color;
        applySelection();
    }
    // Recalculate station colors with updated segment colors
    if (sfcData) {
        const coordColorMap2 = new Map();
        for (const f of allFeats) {
            const color = f.properties.color;
            for (const c of f.geometry.coordinates) {
                const key = Math.round(c[0] * 1000) + ',' + Math.round(c[1] * 1000);
                if (!coordColorMap2.has(key)) coordColorMap2.set(key, new Set());
                coordColorMap2.get(key).add(color);
            }
        }
        for (const f of sfcData.features) {
            const p = f.properties;
            const [sx, sy] = f.geometry.coordinates;
            const nearbyColors = new Set();
            for (let dx = -1; dx <= 1; dx++) {
                for (let dy = -1; dy <= 1; dy++) {
                    const key = Math.round(sx * 1000 + dx) + ',' + Math.round(sy * 1000 + dy);
                    const colors = coordColorMap2.get(key);
                    if (colors) colors.forEach(c => nearbyColors.add(c));
                }
            }
            if (nearbyColors.size === 1) {
                p.color = [...nearbyColors][0];
            } else {
                p.color = colorMode === 'line' ? colorLineFor(p.op, p.line)
                         : colorMode === 'detailed' ? colorDetailedFor(p.op, p.line)
                         : colorOpFor(p.op);
            }
        }
        map.getSource('stations').setData(sfcData);
    }
    // Update line name label colors
    if (map.getSource('line-labels')) {
        const lineLabelFeatures2 = {};
        for (const f of allFeats) {
            const p = f.properties;
            const key = p.op + '||' + p.line;
            if (!lineLabelFeatures2[key]) {
                lineLabelFeatures2[key] = { color: p.color };
            }
        }
        const src = map.getSource('line-labels');
        if (src && src._data) {
            for (const feat of src._data.features) {
                const key = feat.properties.label;
                for (const k in lineLabelFeatures2) {
                    if (k.endsWith('||' + key) || key === k.split('||')[1]) {
                        feat.properties.color = lineLabelFeatures2[k].color;
                        break;
                    }
                }
            }
            src.setData(src._data);
        }
    }
    buildLegend();
    renderInfo();
}

function renderInfo() {
    if (!selected) return;
    const S = STR[lang];
    const box = document.getElementById('info');
    const head = `<div class="ipline" style="color:${selected.color}">` +
                 `${opLabel(selected.op)} ${lineLabel(selected.op, selected.line)}</div>`;

    const simpOpNote = simpOnly(selected.op);
    const simpLineNote = simpOnly(selected.line);
    const simpHead = (simpOpNote || simpLineNote) ? `<div style="color:#8b939e;font-size:11px">${simpOpNote || selected.op} ${simpLineNote || selected.line}</div>` : '';
    if (selected.mode === 'segment') {
        const simpFromN = simpOnly(selected.from);
        const simpToN = simpOnly(selected.to);
        const simpSegNote = (simpFromN || simpToN) ? `<div style="color:#8b939e;font-size:11px">${simpFromN || selected.from} → ${simpToN || selected.to}</div>` : '';
        box.innerHTML = head + simpHead +
            `<div class="ipseg">${selected.from} → ${selected.to}</div>` + simpSegNote +
            `<div class="iprow"><span>${S.panelLength}</span>` +
                `<b>${Number(selected.km).toFixed(1)} ${S.km}</b></div>`;
    } else {
        const parts = allFeats.filter(f =>
            f.properties.op === selected.op && f.properties.line === selected.line);
        let km = 0;
        for (const f of parts) km += Number(f.properties.km) || 0;
        box.innerHTML = head + simpHead +
            `<div class="iprow"><span>${S.panelLength}</span><b>${km.toFixed(1)} ${S.km}</b></div>` +
            `<div class="iprow"><span>${S.panelSections}</span><b>${parts.length}</b></div>`;
    }
    box.innerHTML += `<div class="iphint">${S.panelHint}</div>`;
    box.style.display = 'block';
}

// ───────────────────────────── interface ─────────────────────────────────
function buildLegend() {
    const S = STR[lang];
    let html = `<span class="close" id="lg-close" title="hide">×</span>` +
        `<div class="hd">${S.legLineColors}</div>` +
        `<div class="modetoggle">` +
        `<span id="cm-op" class="${colorMode === 'operator' ? 'on' : ''}">${S.modeOperator}</span>` +
        `<span id="cm-line" class="${colorMode === 'line' ? 'on' : ''}">${S.modeLine}</span>` +
        `<span id="cm-detail" class="${colorMode === 'detailed' ? 'on' : ''}">${S.modeDetailed}</span></div>`;

    html += `<div class="stsec">` +
            `<div class="hd">${S.toggleStations}</div>` +
            `<div class="strow">` +
            `<input type="checkbox" id="st-toggle"${showStations ? ' checked' : ''}>` +
            `</div></div>`;

    html += `<div class="thick"><div class="hd">${S.legLineWidth} ` +
            `<span class="val" id="thickVal">${S.lineWidthVal}${lineScale.toFixed(1)}</span></div>` +
            `<input id="lineScaleSlider" type="range" min="0.3" max="3" step="0.1" value="${lineScale}"></div>`;

    document.getElementById('legend').innerHTML = html;

    document.getElementById('lg-close').onclick = () => setLegendOpen(false);
    document.getElementById('cm-op').onclick = () => setColorMode('operator');
    document.getElementById('cm-line').onclick = () => setColorMode('line');
    document.getElementById('cm-detail').onclick = () => setColorMode('detailed');
    document.getElementById('st-toggle').onchange = (e) => {
        showStations = e.target.checked;
        const vis = showStations ? 'visible' : 'none';
        if (map.getLayer('station-dots'))
            map.setLayoutProperty('station-dots', 'visibility', vis);
        if (map.getLayer('transfer-dots'))
            map.setLayoutProperty('transfer-dots', 'visibility', vis);
        if (map.getLayer('transfer-labels'))
            map.setLayoutProperty('transfer-labels', 'visibility', vis);
        if (map.getLayer('station-labels'))
            map.setLayoutProperty('station-labels', 'visibility', vis);
    };
    const sl = document.getElementById('lineScaleSlider');
    sl.oninput = () => {
        lineScale = parseFloat(sl.value);
        document.getElementById('thickVal').textContent = STR[lang].lineWidthVal + lineScale.toFixed(1);
        applyWidths();
    };
}

// ─────────────────────────── search ────────────────────────────────────
(function() {
    const searchInput = document.getElementById('search-input');
    const resultsBox = document.getElementById('search-results');
    let activeIdx = -1;
    let currentResults = [];

    // Build search index after data loads
    function buildSearchIndex() {
        // Unique stations: dedupe by station name + coordinates
        const stationMap = new Map();
        if (sfcData) {
            for (const f of sfcData.features) {
                const p = f.properties;
                const key = p.station;
                if (!stationMap.has(key)) {
                    stationMap.set(key, {
                        type: 'station',
                        name: p.station,
                        nameEn: NAMES.stations[p.op + '||' + p.station] || '',
                        op: p.op,
                        line: p.line,
                        ops: Array.isArray(p.ops) ? p.ops : JSON.parse(p.ops || '[]'),
                        coord: f.geometry.coordinates,
                        riders: p.riders || 0,
                    });
                }
            }
        }
        // Unique lines
        const lineMap = new Map();
        for (const f of allFeats) {
            const p = f.properties;
            const key = p.op + '||' + p.line;
            if (!lineMap.has(key)) {
                lineMap.set(key, {
                    type: 'line',
                    op: p.op,
                    line: p.line,
                    nameEn: NAMES.lines[p.op + '||' + p.line] || '',
                    color: p.colorLine,
                });
            }
        }
        return { stations: [...stationMap.values()], lines: [...lineMap.values()] };
    }

    let searchIndex = null;

    function ensureIndex() {
        if (!searchIndex && allFeats.length && sfcData) {
            searchIndex = buildSearchIndex();
        }
        return searchIndex;
    }

    function doSearch(query) {
        const idx = ensureIndex();
        if (!idx || !query) return [];
        const q = query.toLowerCase();
        const qSimp = toSimplified(q);
        const S = STR[lang];

        const results = [];

        // Search stations
        for (const s of idx.stations) {
            const nameLower = s.name.toLowerCase();
            const jaMatch = nameLower.includes(q);
            const enMatch = s.nameEn.toLowerCase().includes(q);
            const simpMatch = toSimplified(nameLower).includes(qSimp);
            if (jaMatch || enMatch || simpMatch) {
                const label = lang === 'en' && s.nameEn ? s.nameEn : s.name;
                const simpName = toSimplified(s.name);
                const sub = lang === 'en' ? s.name : (simpName !== s.name ? simpName : (s.nameEn || ''));
                results.push({
                    type: 'station',
                    label,
                    sub,
                    opLabel: s.ops.map(op => opLabel(op)).join(' · '),
                    data: s,
                    score: (jaMatch || simpMatch === jaMatch) ? 0 : 1,
                });
            }
        }

        // Search lines
        for (const l of idx.lines) {
            const lineLower = l.line.toLowerCase();
            const opLower = l.op.toLowerCase();
            const jaMatch = lineLower.includes(q);
            const opJaMatch = opLower.includes(q);
            const enMatch = l.nameEn.toLowerCase().includes(q);
            const simpLineMatch = toSimplified(lineLower).includes(qSimp);
            const simpOpMatch = toSimplified(opLower).includes(qSimp);
            if (jaMatch || opJaMatch || enMatch || simpLineMatch || simpOpMatch) {
                const lbl = lang === 'en' && l.nameEn ? l.nameEn : l.line;
                const simpLine = toSimplified(l.line);
                const sub = lang === 'en' ? l.line : (simpLine !== l.line ? simpLine : (l.nameEn || ''));
                results.push({
                    type: 'line',
                    label: lbl,
                    sub,
                    opLabel: opLabel(l.op),
                    color: l.color,
                    data: l,
                    score: (jaMatch || simpLineMatch || simpOpMatch) ? 0 : 1,
                });
            }
        }

        // Sort: exact starts-with first, then alphabetical
        results.sort((a, b) => {
            const aStarts = a.label.toLowerCase().startsWith(q) || toSimplified(a.label).startsWith(qSimp) || a.sub.toLowerCase().startsWith(q) ? 0 : 1;
            const bStarts = b.label.toLowerCase().startsWith(q) || toSimplified(b.label).startsWith(qSimp) || b.sub.toLowerCase().startsWith(q) ? 0 : 1;
            if (aStarts !== bStarts) return aStarts - bStarts;
            if (a.score !== b.score) return a.score - b.score;
            if (a.type !== b.type) return a.type === 'station' ? -1 : 1;
            return a.label.localeCompare(b.label, lang === 'ja' ? 'ja' : 'en');
        });

        return results.slice(0, 30);
    }

    function renderResults(results) {
        const S = STR[lang];
        if (!results.length) {
            resultsBox.innerHTML = `<div class="sr-empty">${S.searchNoResults}</div>`;
            resultsBox.style.display = 'block';
            currentResults = results;
            activeIdx = -1;
            return;
        }
        currentResults = results;
        activeIdx = -1;
        resultsBox.innerHTML = results.map((r, i) => {
            const typeLabel = r.type === 'station' ? S.searchStation : S.searchLine;
            const dot = r.color ? `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${r.color};margin-right:4px;vertical-align:middle;"></span>` : '';
            return `<div class="sr-item" data-idx="${i}">` +
                `<span class="sr-type">${typeLabel}</span>` +
                dot +
                `<span class="sr-name">${escHtml(r.label)}</span>` +
                (r.sub && r.sub !== r.label ? `<span class="sr-sub">${escHtml(r.sub)}</span>` : '') +
                `<span class="sr-sub"> — ${escHtml(r.opLabel)}</span>` +
            `</div>`;
        }).join('');
        resultsBox.style.display = 'block';
    }

    function escHtml(s) {
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    function clearResults() {
        resultsBox.style.display = 'none';
        resultsBox.innerHTML = '';
        currentResults = [];
        activeIdx = -1;
    }

    function selectResult(idx) {
        const r = currentResults[idx];
        if (!r) return;
        clearResults();
        searchInput.value = '';
        searchInput.blur();

        if (r.type === 'station') {
            const s = r.data;
            map.flyTo({ center: s.coord, zoom: 12, duration: 1200 });
            // Select the station's line
            const feat = allFeats.find(f =>
                f.properties.op === s.op && f.properties.line === s.line);
            if (feat) {
                setLineSelection(feat.properties);
            }
        } else if (r.type === 'line') {
            const l = r.data;
            // Find all features for this line to compute bounds
            const feats = allFeats.filter(f =>
                f.properties.op === l.op && f.properties.line === l.line);
            if (feats.length) {
                let minLng = Infinity, minLat = Infinity, maxLng = -Infinity, maxLat = -Infinity;
                for (const f of feats) {
                    for (const c of f.geometry.coordinates) {
                        if (c[0] < minLng) minLng = c[0];
                        if (c[0] > maxLng) maxLng = c[0];
                        if (c[1] < minLat) minLat = c[1];
                        if (c[1] > maxLat) maxLat = c[1];
                    }
                }
                map.fitBounds([[minLng, minLat], [maxLng, maxLat]], { padding: 60, duration: 1200 });
                setLineSelection(feats[0].properties);
            }
        }
    }

    function updateActiveItem() {
        const items = resultsBox.querySelectorAll('.sr-item');
        items.forEach((el, i) => el.classList.toggle('active', i === activeIdx));
        if (activeIdx >= 0 && items[activeIdx]) {
            items[activeIdx].scrollIntoView({ block: 'nearest' });
        }
    }

    // 性能优化：搜索输入防抖，避免每次按键都执行全量搜索
    let searchDebounce = null;
    searchInput.addEventListener('input', () => {
        const q = searchInput.value.trim();
        if (!q) { clearResults(); return; }
        if (searchDebounce) clearTimeout(searchDebounce);
        searchDebounce = setTimeout(() => {
            const results = doSearch(q);
            renderResults(results);
        }, 120);
    });

    searchInput.addEventListener('keydown', (e) => {
        if (!currentResults.length) return;
        if (e.key === 'ArrowDown') {
            e.preventDefault();
            activeIdx = Math.min(activeIdx + 1, currentResults.length - 1);
            updateActiveItem();
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            activeIdx = Math.max(activeIdx - 1, 0);
            updateActiveItem();
        } else if (e.key === 'Enter') {
            e.preventDefault();
            if (activeIdx >= 0) selectResult(activeIdx);
            else if (currentResults.length) selectResult(0);
        } else if (e.key === 'Escape') {
            clearResults();
            searchInput.blur();
        }
    });

    resultsBox.addEventListener('click', (e) => {
        const item = e.target.closest('.sr-item');
        if (item) {
            const idx = parseInt(item.dataset.idx, 10);
            selectResult(idx);
        }
    });

    // Close results when clicking outside
    document.addEventListener('click', (e) => {
        if (!document.getElementById('searchbox').contains(e.target)) {
            clearResults();
        }
    });

    // Prevent map clicks when clicking inside searchbox
    document.getElementById('searchbox').addEventListener('click', (e) => e.stopPropagation());

    // Keyboard shortcut: Ctrl/Cmd+K to focus search
    document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
            e.preventDefault();
            searchInput.focus();
            searchInput.select();
        }
    });
    window.__jrReady = true;
})();

// ─────────────────── 实时列车位置图层（RailAround live snapshot） ───────────────────
(function () {
    const LIVECTRL = document.getElementById('livetoggle');
    const LIVESTATUS = document.getElementById('livestatus');
    const tipEl = document.getElementById('tooltip');
    let liveOn = false, tmaps = null, trains = null, trainsBit = 0;
    let stationCoord = null, segIndex = null, trainFC = null;
    let adj = null, edgeCoords = null, edgeLine = null, pathMemo = null;
    let timer = null;
    const SHINK = ['Hayabusa', 'Komachi', 'Yamabiko', 'Tsubasa', 'Kagayaki', 'Toki', 'Hakutaka', 'Asama', 'Nasuno', 'Tanigawa'];
    function iconColor(ic) {
        if (SHINK.includes(ic)) return '#2e9e44';
        if (ic === '特') return '#e03e3e';
        if (ic === '急' || ic === '快') return '#f59a23';
        if (ic === '準' || ic === '区' || ic === '通' || ic === '回') return '#8a8f98';
        if (ic === '各' || ic === '普') return '#5aa7e8';
        return '#9aa0ab';
    }
    // rday 位掩码: 1=平日 2=周六 4=周日·假日（JST 当日）
    // 日本国民の祝日・振替休日（2026-2027）。以后年份请按官方公告更新：
    // https://www8.cao.go.jp/chosei/shukujitsu/gaiyou.html
    const HOLIDAYS = new Set([
        '2026-01-01','2026-01-12','2026-02-11','2026-02-23','2026-03-20','2026-04-29',
        '2026-05-03','2026-05-04','2026-05-05','2026-05-06','2026-07-20','2026-08-11',
        '2026-09-21','2026-09-23','2026-10-12','2026-11-03','2026-11-23',
        '2027-01-01','2027-01-11','2027-02-11','2027-02-23','2027-03-21','2027-03-22','2027-04-29',
        '2027-05-03','2027-05-04','2027-05-05','2027-07-19','2027-08-11',
        '2027-09-20','2027-09-23','2027-10-11','2027-11-03','2027-11-23',
    ]);
    function todayBit() {
        const now = new Date(Date.now() + 9 * 3600 * 1000);
        const y = now.getUTCFullYear();
        const md = String(now.getUTCMonth() + 1).padStart(2, '0') + '-' + String(now.getUTCDate()).padStart(2, '0');
        if (HOLIDAYS.has(y + '-' + md)) return 4;
        const d = now.getUTCDay();
        return (d >= 1 && d <= 5) ? 1 : (d === 6 ? 2 : 4);
    }
    function minOfDayJST() { return ((Date.now() / 1000 + 9 * 3600) % 86400) / 60; }
    // 本地时刻表文件：按运行日分组，页面只加载今日对应的一份（无外部抓取）
    const TRAIN_FILES = { 1: 'data/live/trains_wd.json', 2: 'data/live/trains_sa.json', 4: 'data/live/trains_su.json' };
    function inWindow(t, M) {
        const w = t.w;
        if (!w) return false;
        const comma = w.indexOf(',');
        if (comma < 0) return false;
        let lo = +w.slice(0, comma), hi = +w.slice(comma + 1), MM = M;
        if (hi < 300 && M > 1400) MM = M - 1440;
        else if (lo > 1400 && M < 300) MM = M + 1440;
        return MM >= lo && MM <= hi;
    }
    function schsOf(t) { if (!t.__s) t.__s = t.s.split(',').map(Number); return t.__s; }

    function buildIndices() {
        stationCoord = new Map();
        sfcData.features.forEach(f => stationCoord.set(f.properties.station, f.geometry.coordinates));
        segIndex = new Map();
        adj = new Map(); edgeCoords = new Map(); edgeLine = new Map(); pathMemo = new Map();
        allFeats.forEach(f => {
            const p = f.properties;
            // MultiLineString 归一化为单条线（约 32/4729 段为分片几何）
            const coords = f.geometry.type === 'MultiLineString'
                ? f.geometry.coordinates.reduce((a, l) => a.concat(l), [])
                : f.geometry.coordinates;
            const k1 = p.from + '|' + p.to, k2 = p.to + '|' + p.from;
            if (!segIndex.has(k1)) segIndex.set(k1, []);
            if (!segIndex.has(k2)) segIndex.set(k2, []);
            segIndex.get(k1).push(coords);
            segIndex.get(k2).push(coords.slice().reverse());
            edgeCoords.set(k1, coords);
            edgeCoords.set(k2, coords.slice().reverse());
            edgeLine.set(k1, p.line || ''); edgeLine.set(k2, p.line || '');
            if (!adj.has(p.from)) adj.set(p.from, new Set());
            if (!adj.has(p.to)) adj.set(p.to, new Set());
            adj.get(p.from).add(p.to); adj.get(p.to).add(p.from);
        });
    }
    // BFS 沿轨道寻路（处理快车跳站：相邻站无直接段时沿同网路径走真实轨道）
    function pathAlong(A, B) {
        const key = A + '|' + B;
        if (pathMemo.has(key)) { const m = pathMemo.get(key); return m ? { coords: m.coords, lineAt: m.lineAt } : null; }
        if (!adj.has(A) || !adj.has(B)) { pathMemo.set(key, null); return null; }
        const prev = new Map([[A, null]]), q = [A];
        while (q.length && !prev.has(B)) {
            const cur = q.shift();
            const nbs = adj.get(cur);
            if (!nbs) continue;
            for (const nb of nbs) {
                if (!prev.has(nb)) { prev.set(nb, cur); q.push(nb); }
            }
        }
        if (!prev.has(B)) { pathMemo.set(key, null); return null; }
        const stops = [B]; let cur = B;
        while (cur !== A) { cur = prev.get(cur); stops.push(cur); }
        stops.reverse();
        const coords = [], segLines = [], segLens = [];
        for (let i = 0; i < stops.length - 1; i++) {
            const k = stops[i] + '|' + stops[i + 1];
            const c = edgeCoords.get(k);
            const ln = edgeLine.get(k) || '';
            if (i === 0) coords.push(...(c || [[0, 0], [0, 0]]));
            else coords.push(...(c || [[0, 0], [0, 0]]).slice(1));
            segLines.push(ln);
            let len = 0;
            const cc = c || [];
            for (let j = 1; j < cc.length; j++) {
                const dx = cc[j][0] - cc[j - 1][0], dy = cc[j][1] - cc[j - 1][1];
                len += Math.sqrt(dx * dx + dy * dy);
            }
            segLens.push(len);
        }
        const total = segLens.reduce((a, b) => a + b, 0);
        const lineAt = (frac) => {
            if (total <= 0) return segLines[0] || '';
            let target = frac * total, acc = 0;
            for (let i = 0; i < segLens.length; i++) {
                if (acc + segLens[i] >= target) return segLines[i] || '';
                acc += segLens[i];
            }
            return segLines[segLines.length - 1] || '';
        };
        const m = { coords, lineAt };
        pathMemo.set(key, m);
        return { coords, lineAt };
    }
    function pointAlong(coords, frac) {
        if (!coords || coords.length < 2) return null;
        if (frac <= 0) return coords[0];
        if (frac >= 1) return coords[coords.length - 1];
        let total = 0;
        for (let i = 1; i < coords.length; i++) {
            const dx = coords[i][0] - coords[i - 1][0], dy = coords[i][1] - coords[i - 1][1];
            total += Math.sqrt(dx * dx + dy * dy);
        }
        if (total <= 0) return coords[0];
        let target = frac * total, acc = 0;
        for (let i = 1; i < coords.length; i++) {
            const dx = coords[i][0] - coords[i - 1][0], dy = coords[i][1] - coords[i - 1][1];
            const seg = Math.sqrt(dx * dx + dy * dy);
            if (acc + seg >= target) {
                const f = seg === 0 ? 0 : (target - acc) / seg;
                return [coords[i - 1][0] + dx * f, coords[i - 1][1] + dy * f];
            }
            acc += seg;
        }
        return coords[coords.length - 1];
    }
    // schs 解码 + 定位：返回 {pt, A, B, color, icon, line} 或 null
    function trainPosition(t, M) {
        const tm = tmaps ? tmaps[t.t] : null;
        if (!tm || !tm.s_jas || tm.s_jas.length < 2) return null;
        const st = tm.s_jas, schs = schsOf(t), N = st.length;
        if (!schs || schs.length < 2 * N - 2) return null;
        const dep = [], arr = [];
        dep[0] = schs[0];
        for (let i = 1; i < N; i++) {
            arr[i] = dep[i - 1] + schs[2 * i - 1];
            dep[i] = (i < N - 1) ? arr[i] + schs[2 * i] : arr[i];
        }
        let MM = M;
        if (dep[N - 1] < 300 && M > 1400) MM = M - 1440;
        if (dep[0] > 1400 && M < 300) MM = M + 1440;
        if (MM < dep[0] - 1e-6 || MM > arr[N - 1] + 1e-6) return null;
        const meta = { color: iconColor(t.i), icon: t.i, line: (tm.lines && tm.lines.length === 1) ? tm.lines[0] : '' };
        const placeAt = (S) => {
            const c = stationCoord.get(S);
            if (c) return { pt: c, A: S, B: S, color: meta.color, icon: meta.icon, line: meta.line };
            return null;
        };
        const placeBetween = (A, B, frac) => {
            const segs = segIndex.get(A + '|' + B);
            if (segs && segs.length) {
                const pt = pointAlong(segs[0], frac);
                if (pt) return { pt, A, B, color: meta.color, icon: meta.icon, line: edgeLine.get(A + '|' + B) || meta.line };
            }
            const path = pathAlong(A, B);
            if (path) {
                const pt = pointAlong(path.coords, frac);
                if (pt) return { pt, A, B, color: meta.color, icon: meta.icon, line: path.lineAt(frac) || meta.line };
            }
            const ca = stationCoord.get(A), cb = stationCoord.get(B);
            if (ca && cb) return { pt: [ca[0] + (cb[0] - ca[0]) * frac, ca[1] + (cb[1] - ca[1]) * frac], A, B, color: meta.color, icon: meta.icon, line: meta.line };
            if (ca) return { pt: ca, A, B, color: meta.color, icon: meta.icon, line: meta.line };
            if (cb) return { pt: cb, A, B, color: meta.color, icon: meta.icon, line: meta.line };
            return null;
        };
        for (let i = 0; i < N - 1; i++) {
            // 区间运行中
            if (MM >= dep[i] - 1e-6 && MM <= arr[i + 1] + 1e-6) {
                const run = arr[i + 1] - dep[i];
                const frac = run <= 0 ? 0 : (MM - dep[i]) / run;
                const r = placeBetween(st[i], st[i + 1], frac);
                if (r) return r;
            }
            // 到站后停站中（含终点站的停留窗口由上方 MM>arr 过滤处理）
            if (i + 1 < N - 1 && MM > arr[i + 1] + 1e-6 && MM <= dep[i + 1] + 1e-6) {
                const r = placeAt(st[i + 1]);
                if (r) return r;
            }
        }
        return null;
    }
    function refreshPositions() {
        if (!liveOn || !trains || !tmaps || !trainFC) return;
        const bit = todayBit();
        const M = minOfDayJST();
        const feats = [];
        const list = trains.T;
        for (let k = 0; k < list.length; k++) {
            const t = list[k];
            if (!(t.r & bit)) continue;
            if (!inWindow(t, M)) continue;
            const pos = trainPosition(t, M);
            if (!pos) continue;
            feats.push({
                type: 'Feature',
                properties: { icon: pos.icon, color: pos.color, from: pos.A, to: pos.B, line: pos.line || '' },
                geometry: { type: 'Point', coordinates: pos.pt },
            });
        }
        trainFC.features = feats;
        map.getSource('live-trains').setData(trainFC);
        if (LIVESTATUS) {
            const d = new Date();
            const pad = n => String(n).padStart(2, '0');
            LIVESTATUS.textContent = '⚡ ' + feats.length + '/' + (trains.n || list.length) + ' 列运行 · 本地时刻表 @ ' + (trains.b || '') + ' · ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) + ' JST';
        }
    }
    async function loadTrains(bit) {
        const f = TRAIN_FILES[bit];
        if (!f) return;
        try {
            const r = await fetch(f);
            trains = await r.json();
            trainsBit = bit;
            refreshPositions();
        } catch (e) {
            if (LIVESTATUS) LIVESTATUS.textContent = '⚡ 本地时刻表加载失败（' + f + '）';
        }
    }
    function ensureReady(cb) {
        if (sfcData && allFeats && allFeats.length && map.getSource('segs')) cb();
        else setTimeout(() => ensureReady(cb), 400);
    }
    function toggle() {
        liveOn = !liveOn;
        LIVECTRL.classList.toggle('on', liveOn);
        LIVESTATUS.style.display = liveOn ? 'block' : 'none';
        if (liveOn) {
            ensureReady(async () => {
                if (!stationCoord) buildIndices();
                if (!tmaps) {
                    try { tmaps = await (await fetch('data/live/tmaps.json?t=' + Date.now())).json(); } catch (e) { tmaps = {}; }
                }
                if (!map.getSource('live-trains')) {
                    map.addSource('live-trains', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
                    map.addLayer({
                        id: 'live-trains', type: 'circle', source: 'live-trains',
                        paint: {
                            'circle-radius': ['interpolate', ['exponential', ZOOM_BASE], ['zoom'], 3, 2.6 * ZF_LO, 9, 3.4 * ZF_HI, 13, 4.0 * ZF_HI],
                            'circle-color': ['get', 'color'],
                            'circle-opacity': 0.95,
                            'circle-stroke-color': '#ffffff',
                            'circle-stroke-width': 0.7,
                        },
                    });
                    map.on('mousemove', 'live-trains', (e) => {
                        if (!e.features.length) return;
                        const p = e.features[0].properties;
                        tipEl.style.display = 'block';
                        tipEl.style.left = (e.point.x + 14) + 'px';
                        tipEl.style.top = (e.point.y + 14) + 'px';
                        tipEl.innerHTML = '<div class="line" style="color:' + p.color + '">' + (p.icon ? p.icon + ' ' : '') + (p.line ? p.line : '') + '</div><div class="seg">' + (p.from === p.to ? p.from : p.from + ' → ' + p.to) + '</div>';
                        map.getCanvas().style.cursor = 'pointer';
                    });
                    map.on('mouseleave', 'live-trains', () => { tipEl.style.display = 'none'; map.getCanvas().style.cursor = ''; });
                }
                trainFC = { type: 'FeatureCollection', features: [] };
                const bit = todayBit();
                if (!trains || trainsBit !== bit) await loadTrains(bit);
                else refreshPositions();
                if (!timer) {
                    // 性能优化：从 1000ms 降到 5000ms，列车移动慢，5秒刷新足够
                    // 每秒全量 setData 会触发完整地图重绘，老设备压力大
                    timer = setInterval(() => {
                        const b = todayBit();
                        if (b !== trainsBit) { loadTrains(b); return; }
                        refreshPositions();
                    }, 5000);
                }
            });
        } else {
            if (timer) { clearInterval(timer); timer = null; }
            if (map.getSource('live-trains')) map.getSource('live-trains').setData({ type: 'FeatureCollection', features: [] });
        }
    }
    LIVECTRL.addEventListener('click', toggle);
})();

applyLang();
