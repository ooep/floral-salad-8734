<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mini JapanRail 3D — 全日本铁路实时运行地图</title>
<meta name="description" content="本地时刻表驱动的全日本铁路 3D 实时运行地图:Globe 投影、时钟回放、路线搜索,运行时零数据请求。">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.12.0/dist/maplibre-gl.css" crossorigin="anonymous">
<style>
:root {
  --bg:#06080e; --panel:rgba(13,17,27,.84); --panel2:rgba(20,26,40,.94);
  --line:rgba(120,140,180,.18); --txt:#d7dee9; --dim:#7f8ba0; --acc:#4f8ef7; --acc2:#6ee7f7;
  --shadow:0 8px 32px rgba(0,0,0,.55); --r:14px;
}
:root[data-theme="light"] {
  --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel2:rgba(245,247,251,.96);
  --line:rgba(30,50,90,.15); --txt:#1a2333; --dim:#64748b; --acc:#2563eb; --acc2:#0891b2;
  --shadow:0 8px 32px rgba(30,50,90,.18);
}
:root[data-theme="light"] .tbox { background:rgba(255,255,255,.8); color:var(--txt); }
:root[data-theme="light"] .btn { color:var(--txt); }
:root[data-theme="light"] .btn.on { color:#fff; }
:root[data-theme="light"] .chip.on, :root[data-theme="light"] .spb.on { color:#fff; }
:root[data-theme="light"] #status { text-shadow:0 1px 4px rgba(255,255,255,.6); }
:root[data-theme="light"] #sheet { background:linear-gradient(180deg,#f4f6fb,#e9edf4); border-color:var(--line); box-shadow:0 -10px 40px rgba(30,50,90,.25); }
:root[data-theme="light"] #sheet .sh-nm { color:var(--txt); }
:root[data-theme="light"] .lrow { background:rgba(255,255,255,.7); }
:root[data-theme="light"] .hour-row { background:rgba(240,243,248,.8); }
:root[data-theme="light"] .dg-cell.local { background:rgba(200,215,240,.5); }
:root[data-theme="light"] .dg-cell.rapid { background:rgba(255,180,190,.45); }
:root[data-theme="light"] .dg-cell .m, :root[data-theme="light"] .hr-t .m { color:#1a2333; }
:root[data-theme="light"] .day .dlg, :root[data-theme="light"] .d { color:var(--dim); }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--txt);
  font-family:-apple-system,"SF Pro SC","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Yu Gothic UI","Noto Sans JP",sans-serif;
  -webkit-tap-highlight-color:transparent; }
/* iOS 刘海/底部横条安全区 */
@supports (padding: max(0px)) {
  #hud { padding-top: max(10px, env(safe-area-inset-top)); }
  #topr { top: calc(46px + env(safe-area-inset-top)); }
  #clock { bottom: max(12px, env(safe-area-inset-bottom)); }
  #detail { bottom: max(14px, env(safe-area-inset-bottom)); }
  .foot { bottom: max(8px, env(safe-area-inset-bottom)); }
}
#map { position:absolute; inset:0; }
::-webkit-scrollbar { width:6px; } ::-webkit-scrollbar-thumb { background:rgba(120,140,180,.3); border-radius:3px; }
button { font-family:inherit; }

/* ---------- 顶栏 ---------- */
#hud { position:absolute; top:0; left:0; right:0; padding:10px 12px 8px; display:flex; align-items:center; gap:10px;
  background:linear-gradient(rgba(6,8,14,.92),rgba(6,8,14,.4),rgba(6,8,14,0)); z-index:5; pointer-events:none; }
#hud .brand { font-size:14px; font-weight:800; letter-spacing:.4px; display:flex; align-items:center; gap:7px; text-shadow:0 1px 6px rgba(0,0,0,.6); cursor:pointer; }
#hud .brand .lg { width:26px; height:26px; border-radius:8px; background:linear-gradient(135deg,var(--acc),var(--acc2)); display:flex; align-items:center; justify-content:center; font-size:14px; box-shadow:0 0 14px rgba(79,142,247,.5); }
#hud .brand b { background:linear-gradient(90deg,#8fc1ff,#6ee7f7); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
#status { font-size:11px; color:var(--dim); margin-left:auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 1px 4px rgba(0,0,0,.8); }

/* ---------- 右侧按钮组 ---------- */
#topr { position:absolute; top:46px; right:10px; display:flex; flex-direction:column; gap:8px; z-index:7; align-items:flex-end; }
.btn { min-width:46px; min-height:44px; padding:0 14px; border:1px solid var(--line); border-radius:12px; background:var(--panel);
  color:var(--txt); font-size:12px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); box-shadow:var(--shadow); user-select:none; -webkit-user-select:none; transition:all .15s; }
.btn:hover { border-color:var(--acc); background:rgba(79,142,247,.14); }
.btn:active { transform:scale(.97); }
.btn.on { background:rgba(79,142,247,.25); border-color:var(--acc); color:#fff; box-shadow:0 0 18px rgba(79,142,247,.35); }
.btn.icon { padding:0; width:44px; }
.btn:disabled { opacity:.45; cursor:default; }

/* ---------- 左侧面板 ---------- */
#side { position:absolute; top:58px; left:10px; width:min(334px,calc(100vw - 20px)); max-height:calc(100vh - 158px);
  display:flex; flex-direction:column; background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); box-shadow:var(--shadow); z-index:6; overflow:hidden auto;
  transition:transform .25s ease, opacity .25s; }
#side.collapsed { transform:translateX(calc(-100% - 24px)); opacity:0; pointer-events:none; }
#side .sec { padding:10px 12px; border-top:1px solid var(--line); }
#side .sec:first-child { border-top:0; }
.sec-t { font-size:10.5px; font-weight:700; letter-spacing:1.2px; color:var(--dim); text-transform:uppercase; margin-bottom:8px;
  display:flex; align-items:center; gap:6px; }
.sec-t::after { content:''; flex:1; height:1px; background:linear-gradient(90deg,var(--line),transparent); }

/* 搜索 */
.tbox { width:100%; min-height:38px; padding:0 12px; border:1px solid var(--line); border-radius:10px; background:rgba(6,8,14,.6);
  color:var(--txt); font-size:12.5px; outline:none; transition:border-color .15s; }
.tbox:focus { border-color:var(--acc); }
#sug { margin-top:6px; max-height:200px; overflow-y:auto; display:none; border:1px solid var(--line); border-radius:10px; background:var(--panel2); }
.sug-it { padding:8px 11px; font-size:12px; cursor:pointer; display:flex; justify-content:space-between; gap:8px; align-items:center; }
.sug-it:hover { background:rgba(79,142,247,.16); }
.sug-it .k { color:var(--dim); font-size:10px; align-self:center; flex:none; }
.sug-it .hl { color:var(--acc2); }

/* 路线 */
#routeRow { display:flex; gap:6px; margin-top:8px; }
#routeRow .tbox { flex:1; min-width:0; font-size:11.5px; min-height:34px; }
#rGo { min-height:34px; min-width:52px; padding:0 10px; font-size:11.5px; }
#routeRes { margin-top:8px; display:none; }
.leg { display:flex; align-items:center; gap:7px; font-size:11.5px; padding:5px 8px; border-radius:8px; cursor:pointer; margin-bottom:3px; background:rgba(6,8,14,.45); }
.leg:hover { background:rgba(79,142,247,.14); }
.leg .bar { width:16px; height:5px; border-radius:3px; flex:none; box-shadow:0 0 6px currentColor; }
.leg .nm { font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.leg .ds { color:var(--dim); font-size:10px; margin-left:auto; flex:none; }
#routeSum { font-size:11px; color:var(--dim); margin-bottom:6px; line-height:1.6; }
#routeSum b { color:var(--txt); }

/* 类型 chips */
.frow { display:flex; flex-wrap:wrap; gap:5px; }
.chip { padding:4px 10px; border-radius:16px; border:1px solid var(--line); font-size:11px; cursor:pointer; color:var(--dim); background:transparent; transition:all .15s; }
.chip.on { background:rgba(79,142,247,.22); border-color:var(--acc); color:#fff; }

/* 图例 */
.legrow { display:flex; align-items:center; gap:8px; font-size:11.5px; padding:2.5px 0; }
.legrow .dot { width:10px; height:10px; border-radius:50%; box-shadow:0 0 8px currentColor; flex:none; }
.legrow .nm { color:var(--txt); } .legrow .ds { color:var(--dim); font-size:10px; margin-left:auto; }

/* 开关 */
.sw { display:flex; align-items:center; justify-content:space-between; padding:5px 0; font-size:12px; cursor:pointer; }
.sw .trk { width:38px; height:22px; border-radius:11px; background:rgba(120,140,180,.25); position:relative; transition:background .2s; flex:none; }
.sw .trk::after { content:''; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#cfd6e4; transition:all .2s; }
.sw.on .trk { background:var(--acc); } .sw.on .trk::after { left:18px; background:#fff; }

/* 数据/帮助 */
.data-row { display:flex; justify-content:space-between; font-size:11px; color:var(--dim); padding:2px 0; gap:8px; }
.data-row b { color:var(--txt); font-weight:600; text-align:right; }
.help p { font-size:11.5px; color:var(--dim); line-height:1.7; }

/* ---------- 运行日 ---------- */
#dayRow { display:flex; gap:5px; }

/* ---------- 底部时钟条 ---------- */
#clock { position:absolute; bottom:12px; left:50%; transform:translateX(-50%); width:min(600px,calc(100vw - 20px));
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r); backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px); box-shadow:var(--shadow); z-index:7; padding:9px 14px 11px; display:none; }
#clock .r1 { display:flex; align-items:center; gap:10px; }
#clock .t { font-size:20px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:1px; min-width:74px; text-align:center; }
#clock .daychip { font-size:10.5px; padding:3px 9px; border-radius:12px; border:1px solid var(--line); color:var(--dim); white-space:nowrap; }
#clock .sp { margin-left:auto; display:flex; gap:4px; overflow-x:auto; max-width:46%; scrollbar-width:none; }
#clock .sp::-webkit-scrollbar { display:none; }
.spb { padding:3px 9px; border-radius:8px; border:1px solid var(--line); font-size:11px; cursor:pointer; color:var(--dim); background:transparent; white-space:nowrap; flex:none; }
.spb.on { background:rgba(79,142,247,.22); color:#fff; border-color:var(--acc); }
#clock .r2 { display:flex; align-items:center; gap:10px; margin-top:7px; }
#clock input[type=range] { flex:1; -webkit-appearance:none; appearance:none; height:4px; border-radius:2px; background:rgba(120,140,180,.3); outline:none; }
#clock input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:var(--acc); border:3px solid #0b1020; box-shadow:0 0 10px rgba(79,142,247,.6); cursor:pointer; }
#clock .now { font-size:11px; color:var(--acc); cursor:pointer; font-weight:600; white-space:nowrap; }

/* ---------- 详情卡 ---------- */
#detail { position:absolute; left:10px; bottom:14px; width:min(330px,calc(100vw - 20px)); background:var(--panel);
  border:1px solid var(--line); border-radius:var(--r); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  box-shadow:var(--shadow); z-index:8; padding:13px 15px; display:none; }
#detail .d-h { display:flex; align-items:center; gap:10px; }
#detail .d-ic { width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:800; flex:none; }
#detail .d-t { flex:1; min-width:0; }
#detail .d-nm { font-size:14.5px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#detail .d-sb { font-size:11px; color:var(--dim); margin-top:2px; }
#detail .d-meta { margin-top:9px; font-size:11.5px; line-height:1.8; color:var(--txt); }
#detail .d-meta .lb { color:var(--dim); margin-right:6px; }
#detail .d-act { display:flex; gap:8px; margin-top:10px; }
#detail .d-act .btn { min-height:34px; font-size:12px; flex:1; padding:0 10px; }
#detail .d-x { margin-left:auto; flex:none; min-height:30px; min-width:30px; width:30px; }
.lnchip { display:inline-block; padding:1px 8px; border-radius:10px; font-size:10.5px; font-weight:700; color:#0b1020; margin-right:4px; }

/* ---------- 悬浮提示 ---------- */
#tip { position:absolute; display:none; pointer-events:none; z-index:9; max-width:230px; padding:8px 12px; border-radius:11px;
  background:var(--panel); border:1px solid var(--line); font-size:11.5px; line-height:1.6;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); box-shadow:var(--shadow); }
#tip .ln { font-weight:700; font-size:12.5px; } #tip .sg { color:var(--dim); font-size:10.5px; }
#trTag { position:absolute; display:none; pointer-events:none; z-index:10; max-width:200px; padding:3px 9px; border-radius:10px;
  background:rgba(14,22,38,.92); border:1px solid rgba(255,255,255,.18); color:#fff; font-size:11.5px; font-weight:700; white-space:nowrap;
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); box-shadow:0 2px 8px rgba(0,0,0,.35); transform:translate(-50%,-50%); }
#trTag::before { content:''; position:absolute; left:50%; top:100%; transform:translateX(-50%); border:4px solid transparent; border-top-color:rgba(255,255,255,.35); }

/* ---------- 加载遮罩 ---------- */
#loader { position:absolute; inset:0; z-index:50; background:radial-gradient(ellipse at 50% 42%,#0c1322 0%,#06080e 70%);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; transition:opacity .5s; }
#loader.hide { opacity:0; pointer-events:none; }
#loader .lgi { font-size:44px; filter:drop-shadow(0 0 18px rgba(79,142,247,.6)); animation:pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%,100%{transform:scale(1);opacity:.9;} 50%{transform:scale(1.12);opacity:1;} }
#loader .lt { font-size:15px; font-weight:800; letter-spacing:1px; }
#loader .lb { font-size:11px; color:var(--dim); }
#loader .lpd { display:flex; align-items:center; gap:10px; font-size:10.5px; color:var(--dim); }
#loader .lpd b { color:var(--acc2); font-variant-numeric:tabular-nums; }
#lRetry { display:none; min-height:40px; padding:0 22px; border:1px solid var(--acc); border-radius:12px; background:rgba(79,142,247,.18); color:var(--txt); font-size:12.5px; font-weight:700; cursor:pointer; }
#lRetry:hover { background:rgba(79,142,247,.32); }
#lbar { width:min(320px,70vw); height:4px; border-radius:2px; background:rgba(120,140,180,.2); overflow:hidden; }
#lbarF { height:100%; width:0%; border-radius:2px; background:linear-gradient(90deg,var(--acc),var(--acc2)); transition:width .2s; }

#toast { position:absolute; top:52px; left:50%; transform:translateX(-50%); background:var(--panel2); border:1px solid var(--line);
  color:var(--txt); font-size:12px; padding:7px 16px; border-radius:10px; z-index:40; display:none; box-shadow:var(--shadow); max-width:80vw; }
.foot { position:absolute; bottom:8px; right:12px; font-size:9.5px; color:var(--dim); z-index:5; pointer-events:none; text-shadow:0 1px 3px #000; opacity:.85; }
.maplibregl-ctrl-bottom-right { display:none; }
.maplibregl-ctrl-attrib { background:rgba(0,0,0,.35)!important; color:var(--dim)!important; font-size:9px!important; }
.maplibregl-ctrl-attrib a { color:var(--dim)!important; }
.maplibregl-ctrl-group { background:var(--panel)!important; border:1px solid var(--line)!important; backdrop-filter:blur(10px); }
.maplibregl-ctrl-group button { background:var(--panel)!important; }
.maplibregl-ctrl-group button span { filter:invert(.8); }

@media (max-width:640px) {
  #clock { width:calc(100vw - 16px); padding:8px 12px 10px; }
  #detail { width:calc(100vw - 20px); }
  #side { width:calc(100vw - 20px); }
  #status { display:none; }
}
/* ============ 车站底部抽屉(时刻表) ============ */
#sheetMask { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:20; display:none; }
#sheet { position:fixed; left:50%; bottom:0; transform:translate(-50%,102%); width:min(520px,100vw); height:76vh; background:linear-gradient(180deg,#0d1220,#080b13); border:1px solid var(--line); border-bottom:0; border-radius:20px 20px 0 0; box-shadow:0 -10px 40px rgba(0,0,0,.6); z-index:21; display:flex; flex-direction:column; transition:transform .3s cubic-bezier(.2,.8,.2,1); }
#sheet.open { transform:translate(-50%,0); }
#sheet .grab { width:42px; height:5px; border-radius:3px; background:rgba(150,170,200,.35); margin:8px auto 0; flex:none; }
#sheet .sh-head { padding:10px 18px 4px; display:flex; align-items:flex-start; flex:none; }
#sheet .sh-nm { font-size:30px; font-weight:900; line-height:1.05; }
#sheet .sh-sub { font-size:12.5px; color:var(--dim); margin-top:4px; }
#sheet .sh-x { margin-left:auto; flex:none; }
#sheet .sh-tabs { display:flex; border-bottom:1px solid var(--line); flex:none; margin-top:8px; }
#sheet .sh-tabs button { flex:1; padding:11px 0; background:none; border:0; color:var(--dim); font-size:14px; font-weight:700; cursor:pointer; border-bottom:2px solid transparent; }
#sheet .sh-tabs button.on { color:#fff; border-bottom-color:var(--acc,#4f8ef7); }
#sheet .sh-body { flex:1; overflow-y:auto; padding:6px 12px 24px; -webkit-overflow-scrolling:touch; }
#sheet .grp-op { display:flex; align-items:center; gap:8px; padding:14px 4px 6px; font-size:12px; font-weight:800; color:#cfe0ff; }
#sheet .grp-op .op-logo { max-height:22px; max-width:72px; width:auto; height:auto; object-fit:contain; background:#fff; border-radius:4px; padding:2px 5px; flex:none; }
#sheet .grp-op .op-ic { min-width:22px; height:22px; padding:0 4px; border-radius:6px; background:#22a447; color:#fff; font-size:10px; font-weight:900; display:flex; align-items:center; justify-content:center; }
.lrow { display:flex; align-items:center; gap:11px; padding:11px 12px; margin:7px 0; border:1.5px solid var(--lc,#4f8ef7); border-radius:12px; background:rgba(10,14,24,.6); cursor:pointer; user-select:none; -webkit-user-select:none; }
.lrow .lb { width:34px; height:30px; border-radius:8px; background:#fff; color:#111; font-weight:900; font-size:14px; display:flex; align-items:center; justify-content:center; flex:none; }
.lrow .lnm { font-size:17px; font-weight:800; color:var(--lc,#4f8ef7); flex:1; }
.lrow .lgo { width:30px; height:30px; border-radius:9px; background:rgba(120,140,180,.18); display:flex; align-items:center; justify-content:center; font-size:12px; transition:transform .2s; flex:none; }
.lrow.open .lgo { background:var(--lc,#4f8ef7); color:#fff; transform:rotate(90deg); }
.lpanel { margin:2px 0 10px; border-left:3px solid var(--lc,#4f8ef7); padding:0 0 0 10px; display:none; }
.lpanel.open { display:block; }
.type-chips { display:flex; gap:6px; padding:6px 0 8px; flex-wrap:wrap; }
.type-chips .tc { padding:4px 14px; border-radius:8px; font-size:13px; font-weight:800; cursor:pointer; background:rgba(120,140,180,.15); color:var(--dim); }
.type-chips .tc.on { background:#ffcc00; color:#111; }
.dir { margin:8px 0; border-radius:12px; overflow:hidden; border:1px solid color-mix(in srgb,var(--lc,#4f8ef7) 45%, transparent); background:color-mix(in srgb,var(--lc,#4f8ef7) 10%, transparent); }
.dir .d-head { display:flex; align-items:center; padding:10px 12px; gap:8px; }
.dir .d-to { font-size:15.5px; font-weight:800; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dir .d-more { font-size:12px; color:#ffd9a0; cursor:pointer; white-space:nowrap; padding:4px 8px; border-radius:7px; background:rgba(255,255,255,.08); }
.dir .d-more.on { background:var(--lc,#4f8ef7); color:#fff; }
.hour-row { display:flex; align-items:stretch; background:rgba(6,9,16,.55); }
.hour-row .hr-h { width:56px; flex:none; background:var(--lc,#e3000b); color:#fff; font-size:26px; font-weight:900; display:flex; align-items:center; justify-content:center; font-variant-numeric:tabular-nums; }
.hour-row .hr-list { display:flex; overflow-x:auto; padding:8px 10px; flex:1; -webkit-overflow-scrolling:touch; }
.hour-row .hr-t { flex:none; width:52px; text-align:center; align-self:center; }
.hour-row .hr-t .dot { width:9px; height:9px; border-radius:50%; background:#9fb0c8; margin:0 auto 3px; }
.hour-row .hr-t .m { font-size:18px; font-weight:800; color:#dfe7f2; font-variant-numeric:tabular-nums; }
.hour-row .hr-t .d { font-size:10px; color:var(--dim); margin-top:1px; white-space:nowrap; }
.day { display:none; border-top:1px dashed rgba(150,170,200,.25); }
.day.open { display:block; }
.day .dlg { font-size:11px; color:var(--dim); line-height:1.7; padding:8px 12px; }
.day .dlg b { color:#ffcc00; }
.dg-row { display:flex; border-bottom:1px solid rgba(120,140,180,.12); }
.dg-row .dg-h { width:44px; flex:none; background:var(--lc,#e3000b); color:#fff; font-size:21px; font-weight:900; display:flex; align-items:center; justify-content:center; }

window.__errs = [];
function __pushErr(s) { window.__errs.push(String(s).slice(0, 500)); if (window.__errs.length > 300) window.__errs.shift(); }
window.addEventListener('error', e => { __pushErr(String(e.message || e) + ' @ ' + String(e.error && e.error.stack || '').split('\n').slice(0, 4).join(' | ').slice(0, 400)); document.getElementById('lMsg').textContent = 'ERR ' + (e.message || e); });
window.addEventListener('unhandledrejection', e => { __pushErr('REJ ' + (e.reason && e.reason.message || e.reason)); });
(() => { const oc = console.error; console.error = function () { __pushErr('CERR ' + Array.from(arguments).map(a => (a && a.message) ? a.message : String(a)).join(' ;; ').slice(0, 300)); return oc.apply(console, arguments); }; })();
</script>

<script type="module">
/* ================================================================== *
 *  Mini JapanRail 3D — 全日本铁路实时运行地图(单文件版)
 *  数据:本地时刻表(trains_*.json + tmaps.json)+ 轨道几何(segments3d/stations3d)
 *  渲染:MapLibre GL JS v6(Globe 投影)+ projectTile 注入自定义 WebGL 列车层
 *  时钟:JST 每帧推算全部在途列车位置,运行时零数据请求
 * ================================================================== */
import * as maplibregl from 'https://cdn.jsdelivr.net/npm/maplibre-gl@6.12.0/dist/maplibre-gl.mjs';

/* ---------------- 常量 ---------------- */
const JST = 9 * 3600 * 1000;
const TRAIN_FILES = { 1: 'data/trains_wd.json', 2: 'data/trains_sa.json', 4: 'data/trains_su.json' };
const DAY_LABEL = { 1: { zh:'平日', ja:'平日', en:'Weekday' }, 2: { zh:'周六', ja:'土曜', en:'Saturday' }, 4: { zh:'周日・假', ja:'日曜・祝', en:'Sun/Holiday' } };
const KINDS = ['鉄道','路面電車','モノレール','案内軌条式','鋼索鉄道','浮上式','無軌条電車'];
const KIND_I18N = {

  '路面電車':   { zh:'路面电车', ja:'路面電車', en:'Tram' },
  'モノレール': { zh:'单轨',   ja:'モノレール', en:'Monorail' },
  '案内軌条式': { zh:'新交通', ja:'案内軌条式', en:'AGT' },
  '鋼索鉄道':   { zh:'索道铁轨', ja:'鋼索鉄道', en:'Cable' },
  '浮上式':     { zh:'磁浮',   ja:'浮上式',   en:'Maglev' },
  '無軌条電車': { zh:'无轨电车', ja:'無軌条電車', en:'Trolleybus' },
};
const TYPE_COLOR = [
  [/^(Hayabusa|Komachi|Yamabiko|Tsubasa|Kagayaki|Toki|Hakutaka|Asama|Nasuno|Tanigawa|Nozomi|Hikari|Kodama|Hayate|Yamato|Sakura|Mizuho|Tsubame|Kamome|Sonic|Mizuho$)/, '#2ecc71'],
  [/^特/, '#ff5a5a'], [/^(快|急|通特|特快)/, '#ffb340'], [/^(準|区|通|回|ライナー|Liner)/, '#9aa5b5'],

];
function typeColor(ic) {
  if (!ic) return '#8fd0ff';
  for (const [re, c] of TYPE_COLOR) if (re.test(ic)) return c;
  return '#8fd0ff';
}
/* ---- 特急爱称识别（tokkyu.json：按「起点>终点|途经线路」签名映射，普适于时刻表变化） ---- */

const TOKKYU_ICONS = new Set(['特','関','紀','中','丹','寝','京','ミ','フ','富','九','川','Ｔ','Ｓ','Ｎ','ホ','拝','ラ','ア','エ','空']);
/* 特殊 icon 的兜底名（签名表未命中时使用；签名命中优先） */
const ICON_NAME = {
  '関':'はるか','紀':'くろしお','丹':'こうのとり','ミ':'ミュースカイ','フ':'フジサン特急','富':'フジサン特急',
  '九':'九州横断特急','京':'京王特急','川':'川越特急','Ｔ':'東武特急','Ｓ':'直通特急','Ｎ':'西鉄特急',
  'ホ':'ホームライナー','拝':'拝島ライナー','ア':'アクセス特急','エ':'アクセス特急','空':'空港快速',
  '寝':'寝台特急','中':'中央線特急','ラ':'ライナー'
};
function tripSig(N, jas, linesN) {
  const o = normName(jas[0]), d = normName(jas[N - 1]);
  return o + '>' + d + '|' + (linesN || []).map(normName).sort().join('|');
}
function tripName(ic, N, jas, linesN) {
  if (!TOKKYU) return null;
  if (TOKKYU.sh[ic]) return TOKKYU.sh[ic];            // 新干线：icon 自带英文名 → 日语名
  if (!TOKKYU_ICONS.has(ic)) return null;             // 非特急级不参与
  const sig = tripSig(N, jas, linesN);
  return TOKKYU.nmI[sig + '|' + ic] || TOKKYU.nm[sig] || ICON_NAME[ic] || null;
}
/* 日本节假日 2024–2030(固定日 + 春分/秋分),振替休日与国民の休日按规则推导 */
const HOLIDAY_BASE = {
  2024: [[1,1],[1,8],[2,12],[2,23],[3,20],[4,29],[5,3],[5,4],[5,5],[5,6],[7,15],[8,11],[9,16],[9,23],[10,14],[11,4],[11,23]],
  2025: [[1,1],[1,13],[2,11],[2,23],[3,20],[4,29],[5,3],[5,4],[5,5],[5,6],[7,21],[8,11],[9,15],[9,23],[10,13],[11,3],[11,24]],

  2027: [[1,1],[1,11],[2,11],[2,23],[3,22],[4,29],[5,3],[5,4],[5,5],[7,19],[8,11],[9,20],[9,23],[10,11],[11,3],[11,23]],

  2029: [[1,1],[1,8],[2,11],[2,12],[2,23],[3,20],[4,29],[5,3],[5,4],[5,5],[7,16],[8,11],[9,17],[9,23],[10,8],[11,3],[11,23]],
  2030: [[1,1],[1,14],[2,11],[2,23],[3,21],[4,29],[5,3],[5,4],[5,5],[5,6],[7,15],[8,11],[9,16],[9,23],[10,14],[11,4],[11,23]],
};
const HOLIDAYS = (() => {
  const set = new Set();
  for (const y in HOLIDAY_BASE) {
    for (const [m, d] of HOLIDAY_BASE[y]) set.add(`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
    // 振替休日:基日若为周日,顺延至下一个非节假日平日;国民の休日:夹在两节假日间的平日
    const days = HOLIDAY_BASE[y].map(([m, d]) => new Date(Date.UTC(y, m-1, d)));
    for (const dt of days) {
      if (dt.getUTCDay() === 0) { const nx = new Date(dt); do { nx.setUTCDate(nx.getUTCDate()+1); } while (set.has(keyOf(nx)) || nx.getUTCDay() === 0); set.add(keyOf(nx)); }
    }
    for (let t = 0; t < 370; t++) {
      const dt = new Date(Date.UTC(y, 0, 1+t));
      const t0 = dt.getTime(), k = keyOf(dt), kp = keyOf(new Date(t0-86400000)), kn = keyOf(new Date(t0+86400000));
      const wd = dt.getUTCDay();
      if (wd >= 1 && wd <= 5 && set.has(kp) && set.has(kn) && !set.has(k)) set.add(k);
    }
  }
  function keyOf(d) { return d.toISOString().slice(0,10); }
  return set;
})();

/* ---------------- 渲染循环 ---------------- */
let lastActiveN = -1, lastFpsSec = -1;
function startLoop() {
  function tickFollow(M) {
    if (performance.now() - followStartT <= 950) return;
    const p = trainPosition(followTrip, windowShift(followTrip, M));
    if (p) { followNullT = 0; map.jumpTo({ center: [p[0], p[1]] }); }
    else if (++followNullT > 180) stopFollow(true); /* 到终点约 3s 后自动停止跟随 */
  }
  const tick = () => {
    rafId = requestAnimationFrame(tick);
    const now = performance.now();
    if (lastFrameT) { const f = 1000 / (now - lastFrameT); fps = fps ? fps * 0.9 + f * 0.1 : f; }
    lastFrameT = now;
    if (!dataReady) return;
    const M = curMin();
    refreshClockUI(M);
    /* 自适应降载:持续低帧率 → 自动关列车光晕 → 仍不足则隔帧更新(保交互优先于动画流畅) */
    if (fps < 22) lowFpsN++; else if (fps > 30) lowFpsN = Math.max(0, lowFpsN - 2);
    if (lowFpsN > 300) {
      glowAutoOff = true;
      if (!adaptToastDone) { adaptToastDone = true; toast(T().adapt, 3200); }
    }
    if (lowFpsN > 900) frameSkip = !frameSkip; else frameSkip = false;
    /* 暂停且无跟随/详情、或页面隐藏:位置不变,跳过顶点重建与重绘(省 CPU/GPU/电量) */
    const staticFrame = (paused && !followTrip && !liveDetailTrip && !sliderDragging) || document.hidden;
    if (staticFrame || frameSkip) {
      if (followTrip) tickFollow(M);
      return;
    }
    const n = updateTrains(M);
    if (n !== lastActiveN) { $('dActive').textContent = n.toLocaleString(); lastActiveN = n; }
    if (Math.floor(now / 1000) !== lastFpsSec) { $('dFps').textContent = Math.round(fps); lastFpsSec = Math.floor(now / 1000); }
    if (followTrip) { tickFollow(M); updateDetailLive(followTrip, null, M); }
    else if (liveDetailTrip) {
      const p = trainPosition(liveDetailTrip, windowShift(liveDetailTrip, M));
      updateDetailLive(liveDetailTrip, p, M);
    }
    /* 跟随列车名称标签:钉在列车屏幕位置 */
    if (followTrip) {
      const p = trainPosition(followTrip, windowShift(followTrip, M));
      if (p && followTrip.nm) {
        const pp = map.project([p[0], p[1]]);
        trTagEl.style.left = pp.x + 'px'; trTagEl.style.top = pp.y + 'px';
        trTagEl.textContent = followTrip.nm;
        trTagEl.style.display = 'block';
      } else trTagEl.style.display = 'none';
    } else trTagEl.style.display = 'none';
    map.triggerRepaint();
  };
  rafId = requestAnimationFrame(tick);
}

      '<div><span class="lb">' + T().next + '</span>' + nextNm + ' ' + eta + '</div>' +

      if (nCost < (best.get(e.to) ?? 1e18)) {
        best.set(e.to, nCost); prev.set(e.to, state);
        pq.push([nCost, e.to, e.to.split('|')[0], '']);

}
$('rGo').addEventListener('click', () => {

function renderRoute(rt, A, B) {
  // states: ['站|线', ...];换乘 = 同站不同线的相邻状态
  const legs = [];
  const feats = [];
  for (let i = 0; i < rt.states.length - 1; i++) {
    const [st1, ln1] = rt.states[i].split('|');
    const [st2, ln2] = rt.states[i + 1].split('|');
    if (st1 === st2) continue; // 换乘
    const line = ln2 || ln1;
    const e = pickRouteSeg(st1, st2, line);
    if (!e) continue;
    const last = legs[legs.length - 1];
    if (last && last.line === line) { last.km += e.len; last.stops++; last.to = st2; }
    else legs.push({ line, from: st1, to: st2, km: e.len, stops: 2, color: lineColor.get(e.line) || lineColor.get(line) || '#4f8ef7' });
    feats.push({ type: 'Feature', properties: { color: lineColor.get(e.line) || '#fff' }, geometry: { type: 'LineString', coordinates: e.coords } });
  }
  const totalKm = legs.reduce((a, l) => a + l.km, 0);
  const xfr = Math.max(0, legs.length - 1);
  setHighlight(feats, null);
  map.fitBounds(featsToBounds(feats), { padding: 80, pitch: Math.min(map.getPitch(), 40), duration: 1400 });
  $('routeSum').innerHTML = '<b>' + dispName(A) + '</b> → <b>' + dispName(B) + '</b><br>' + totalKm.toFixed(0) + ' km · ' + xfr + ' ' + T().transfers + ' · ' + legs.length + ' ' + T().line;
  $('routeLegs').innerHTML = legs.map((l, i) =>
    '<div class="leg" data-i="' + i + '"><span class="bar" style="color:' + l.color + ';background:' + l.color + '"></span>' +
    '<span class="nm">' + l.line + '</span><span class="ds">' + dispName(l.from) + '→' + dispName(l.to) + ' · ' + l.stops + T().stops + '</span></div>').join('');
  $('routeRes').style.display = 'block';
  $('routeLegs').querySelectorAll('.leg').forEach(el => el.addEventListener('click', () => {
    const l = legs[+el.dataset.i];
    const fs = segFC.features.filter(f => f.properties.line === l.line);
    if (fs.length) map.fitBounds(featsToBounds(fs), { padding: 80, duration: 1000 });
  }));
  detailEl.style.display = 'none';
}

const OFF_RAIL_KM = 3;
function distToRail(c) {
  const gx = Math.floor(c[0] / GRID), gy = Math.floor(c[1] / GRID);
  const lat0 = c[1] * Math.PI / 180;
  let bestD = 1e18;
  for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
    const segs = segGrid.get((gx + dx) * 100000 + (gy + dy));
    if (!segs) continue;
    for (const [a, b] of segs) {
      const ax = (a[0] - c[0]) * Math.cos(lat0) * 111.32, ay = (a[1] - c[1]) * 110.57;
      const bx = (b[0] - c[0]) * Math.cos(lat0) * 111.32, by = (b[1] - c[1]) * 110.57;
      const r = distToSegmentProj(0, 0, ax, ay, bx, by);
      if (r.d < bestD) bestD = r.d;
    }
  }
  return bestD;
}
function collectOffRail(M) {
  const out = [];
  for (const t of tripList) {
    if (t.bad) continue;
    const p = trainPosition(t, M);
    if (!p) continue;
    const d = distToRail([p[0], p[1]]);
    if (d > OFF_RAIL_KM) {
      let ni = 0; while (ni < t.N - 1 && M > t.arr[ni + 1]) ni++;
      out.push({ trip: t.t || '', line: p[3] || (t.lines && t.lines[0]) || '', from: t.jas[0], to: t.jas[t.N - 1], lng: p[0].toFixed(4), lat: p[1].toFixed(4), dist: d.toFixed(1), kmh: Math.round(p[5] || 0), next: t.jas[ni + 1] });
    }
  }
  return out;
}

window.__flyCheck = (minutesAhead) => {
  const M = curMin(), movers = [];
  const KM = (a, b) => Math.hypot((b[0]-a[0]) * 111.32 * Math.cos((a[1]+b[1])/2 * Math.PI/180), (b[1]-a[1]) * 110.57);
  let checked = 0, bad = 0, maxJump = 0, worst = null;
  for (const t of tripList) {
    if (t.bad || !(t.r & dayBit)) continue;
    const M2 = windowShift(t, M);
    if (M2 < t.w0 || M2 > t.w1) continue;
    const p1c = trainPosition(t, M2);
    if (!p1c) continue;
    checked++;
    const p1 = [p1c[0], p1c[1], p1c[2], p1c[3], p1c[4], p1c[5]]; // 拷贝:_pos 为共享数组
    const p2 = trainPosition(t, M2 + (minutesAhead || 1));
    if (!p2) continue;
    const km = KM(p1, p2);
    if (km > maxJump) { maxJump = km; worst = { trip: t.t, from: t.jas[0], to: t.jas[t.N-1] }; }
    if (km > 200) { bad++; if (movers.length < 5) movers.push({ trip: t.t, km: Math.round(km), from: t.jas[0], to: t.jas[t.N-1], line: p1[3] }); }
  }
  return { checked, bad, maxJump: Math.round(maxJump), worst, movers };
};
window.__graphQuery = (st) => {

  }

window.__graphWalk = (startNode, lineName, hops) => {
  const walk = [];
  let cur = startNode;
  const seen = new Set([cur]);
  for (let h = 0; h < (hops || 12); h++) {
    const edges = (routeGraph.get(cur) || []).filter(e => !lineName || lineName === '*' || e.line === lineName);
    const fwd = edges.filter(e => !seen.has(e.to));
    if (!fwd.length) { walk.push('DEAD-END'); break; }
    const next = fwd[0];
    walk.push(next.to + ' (' + Math.round(next.km) + 'km)');
    seen.add(next.to);
    cur = next.to;
  }
  return walk;
};
/* 质量探针:抽样可见列车,量化渲染位置到所属轨道折线的偏差(米) */
window.__probe = (lineFilter, limit) => {
  const M = curMin(), out = [];
  const distToPoly = (p, e) => {
    let best = 1e18;
    const co = e.coords;
    for (let i = 1; i < co.length; i++) {
      const ax = co[i-1][0], ay = co[i-1][1], bx = co[i][0], by = co[i][1];
      const dx = bx - ax, dy = by - ay;
      const L2 = dx*dx + dy*dy;
      let tt = L2 ? ((p[0]-ax)*dx + (p[1]-ay)*dy) / L2 : 0;
      tt = Math.max(0, Math.min(1, tt));
      const qx = ax + dx*tt - p[0], qy = ay + dy*tt - p[1];
      const d2 = (qx*Math.cos((ay+by)/2*Math.PI/180)*111.32)**2 + (qy*110.57)**2;
      if (d2 < best) best = d2;
    }
    return Math.sqrt(best) * 1000;
  };
  for (const t of tripList) {
    if (!(t.r & dayBit)) continue;
    const M2 = windowShift(t, M);
    if (M2 < t.w0 || M2 > t.w1) continue;
    if (lineFilter && !t.lines.some(l => l.includes(lineFilter))) continue;
    const p = trainPosition(t, M2);
    if (!p) continue;
    let i = 0;
    while (i < t.N - 2 && M2 > t.arr[i+1]) i++;
    const e = pickSeg(t, t.jasN[i], t.jasN[i + 1], t.stopC[i]);
    out.push({ trip: t.t, line: p[3], devM: e ? Math.round(distToPoly(p, e)) : -1, kmh: Math.round(p[5]), from: t.jas[i], to: t.jas[i + 1], x: p[0], y: p[1] });
    if (out.length >= (limit || 50)) break;
  }
  return out;
};
