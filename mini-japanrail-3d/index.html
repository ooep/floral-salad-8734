/* 老旧设备自适应降载判定(内联、首帧前执行,避免闪烁)。
   仅在判定为低端设备时给 <html> 挂 perf-low 类并置 window.__PERF_LOW;
   新设备不触发任何降载,视觉与交互与旧版完全一致。
   判定:① WebGL 软件渲染(SwiftShader/llvmpipe 等,典型于无独显老机/虚拟机);
        ② 移动端且 CPU 核心≤4 或 内存≤3GB;
        ③ 桌面端且 CPU 核心≤2 且 内存≤2GB。 */
(function () {
  try {
    var ua = navigator.userAgent || '';
    var mobile = /Mobi|Android|iPhone|iPad|iPod/i.test(ua);
    var cores = navigator.hardwareConcurrency || (mobile ? 4 : 8);
    var mem = navigator.deviceMemory || (mobile ? 4 : 8);
    var soft = false;
    try {
      var c = document.createElement('canvas');
      var gl = c.getContext('webgl') || c.getContext('experimental-webgl');
      if (gl) { var r = String(gl.getParameter(gl.RENDERER) || ''); soft = /swiftshader|llvmpipe|softpipe|software/i.test(r); }
    } catch (e) {}
    if (soft || (mobile && (cores <= 4 || mem <= 3)) || (!mobile && cores <= 2 && mem <= 2)) {
      document.documentElement.classList.add('perf-low');
      window.__PERF_LOW = true;
    } else if (!mobile && cores <= 4) {
      /* 中端档(桌面 3-4 核):保持全部功能与画质设置,仅把渲染分辨率钳到 1.5×。
         全视网膜(2×)渲染像素数是 1.5× 的 1.8 倍,叠加 MSAA 后是持续发热大头;
         视觉差异仅线条稍软,几乎不可感。高端设备不受影响。 */
      window.__PERF_MID = true;

})();
