<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f8ef7'/%3E%3Cpath d='M14 40h36M16 40l3-13a5 5 0 0 1 4.9-4h16.2a5 5 0 0 1 4.9 4l3 13M19 48h.02M45 48h.02' stroke='white' stroke-width='4' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Ccircle cx='21' cy='48' r='3.2' fill='white'/%3E%3Ccircle cx='43' cy='48' r='3.2' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.12.0/dist/maplibre-gl.css" crossorigin="anonymous">
<style>
:root {
  --bg:#0b0f16;
  --panel:rgba(18,24,34,.68);
  --panel2:rgba(30,38,52,.72);
  --line:rgba(255,255,255,.08);
  --txt:#e8edf4; --dim:#bccbdd; --acc:#2f6de8; --acc-txt:#6da9ff; --acc2:#5fd4f4;
  --shadow:0 2px 10px rgba(0,0,0,.28), 0 8px 32px rgba(0,0,0,.2);
  --r:14px; --r-sm:10px; --r-xs:7px; --r-pill:999px;
  --acc-soft:rgba(79,142,247,.16); --acc-border:rgba(79,142,247,.5);
  /* ── Liquid Glass 液态玻璃(深色) ── */
  --glass:rgba(255,255,255,.10);
  --glass-2:rgba(255,255,255,.16);
  --glass-edge:rgba(255,255,255,.22);
  --glass-hi:rgba(255,255,255,.34);
  --glass-lo:rgba(0,0,0,.16);
  --glass-sh:0 6px 20px rgba(0,0,0,.30), 0 2px 6px rgba(0,0,0,.22);
  --glass-solid:rgb(25,32,45);
  /* ── 大面板玻璃:顶部镜面高光 → 中段通透 → 底部微反射(Apple Liquid Glass 分层) ── */
  --glass-panel:linear-gradient(180deg, rgba(255,255,255,.18) 0%, rgba(255,255,255,.05) 34%, rgba(255,255,255,.09) 100%), rgba(255,255,255,.10);
  --glass-panel-blur:blur(26px) saturate(1.9);
  --dock:48px;
  /* ── Liquid Glass 动效曲线 ── */
  --ease-spring:cubic-bezier(.34,1.45,.44,1);   /* 按压松开:轻回弹 */
  --ease-smooth:cubic-bezier(.16,1,.3,1);       /* 出场/形变:顺滑减速 */
  /* ── 真弹簧曲线(二阶欠阻尼 step response 采样,linear() 精确复现) ──
     展开 ζ=0.72:过冲 3.8%,尾部偏差 <0.2% —— 液体铺开的"张力感"
     收起 ζ=0.92:近临界阻尼,几乎无过冲 —— 表面张力收回,干脆不拖尾 */
  --spring-out:linear(0,.0598,.1976,.3654,.5321,.68,.8007,.8924,.9573,.9996,1.0241,1.0356,1.0384,1.0358,1.0304,1.0239,1.0175,1.0119,1.0074,1.0039,1.0015,.9999,.999,.9986,.9985,.9986,.9989,.9991,.9993,.9996,1);
  --spring-in:linear(0,.0368,.1232,.2323,.3473,.458,.5586,.6466,.7215,.7836,.8341,.8746,.9065,.9313,.9503,.9646,.9753,.9831,.9888,.9929,.9957,.9976,.9989,.9997,1.0002,1.0005,1.0006,1.0006,1.0006,1.0005,1);
  --morph-out:460ms;   /* 展开稍慢:液体铺开需要时间 */
  --morph-in:340ms;    /* 收起更快:退出永远比进入利落(HIG) */
}
/* 不支持 linear() 的旧浏览器退化为过冲贝塞尔(视觉近似,非真弹簧) */
@supports not (transition-timing-function:linear(0,1)) {
  :root { --spring-out:cubic-bezier(.22,1.12,.36,1); --spring-in:cubic-bezier(.32,.94,.44,1); }
}
:root[data-theme="light"] {
  --bg:#dfe4ec;
  --panel:rgba(255,255,255,.82);
  --panel2:rgba(245,247,251,.88);
  --line:rgba(15,23,42,.09);
  --txt:#0f172a; --dim:#414e66; --acc:#1c51d6; --acc-txt:#1c51d6; --acc2:#0891b2;
  --shadow:0 1px 3px rgba(15,23,42,.08), 0 8px 24px rgba(15,23,42,.1);
  --r:14px; --r-sm:10px; --r-xs:7px; --r-pill:999px;
  --acc-soft:rgba(37,99,235,.1); --acc-border:rgba(37,99,235,.4);
  /* ── Liquid Glass 液态玻璃(浅色) ── */
  --glass:rgba(255,255,255,.58);
  --glass-2:rgba(255,255,255,.76);
  --glass-edge:rgba(255,255,255,.92);
  --glass-hi:rgba(255,255,255,.95);
  --glass-lo:rgba(15,23,42,.06);
  --glass-sh:0 6px 18px rgba(15,23,42,.14), 0 2px 5px rgba(15,23,42,.08);
  --glass-solid:rgb(247,249,252);
  /* 浅色大面板玻璃:高光更亮、底色更白,保持同一种分层语言 */
  --glass-panel:linear-gradient(180deg, rgba(255,255,255,.78) 0%, rgba(255,255,255,.52) 36%, rgba(255,255,255,.66) 100%), rgba(255,255,255,.58);
  --glass-panel-blur:blur(26px) saturate(1.6);
}
:root[data-theme="light"] .tbox { background:var(--panel2); color:var(--txt); }
:root[data-theme="light"] .btn { color:var(--txt); }
:root[data-theme="light"] .btn.on { color:#fff; }
:root[data-theme="light"] .chip.on, :root[data-theme="light"] .spb.on { color:#fff; }
:root[data-theme="light"] #sheet { box-shadow:inset 0 1px 0 rgba(255,255,255,.85), inset 0 -1px 1px rgba(15,23,42,.05), 0 -10px 30px rgba(15,23,42,.16); }
:root[data-theme="light"] #detail { box-shadow:inset 0 1px 0 rgba(255,255,255,.85), inset 0 -1px 1px rgba(15,23,42,.05), var(--glass-sh); }
:root[data-theme="light"] .lrow { background:rgba(255,255,255,.7); }
:root[data-theme="light"] .hour-row { background:rgba(240,243,248,.8); }
:root[data-theme="light"] .dg-cell.local { background:rgba(200,215,240,.5); }
:root[data-theme="light"] .dg-cell.rapid { background:rgba(255,180,190,.45); }
:root[data-theme="light"] .dg-cell .m, :root[data-theme="light"] .hr-t .m { color:#1a2333; }
:root[data-theme="light"] .day .dlg, :root[data-theme="light"] .d { color:var(--dim); }
/* ── 可读性修复(WCAG 对比度):深色模式激活 Tab 白底配深色文字 ── */
:root[data-theme="dark"] .stab.on { color:#0b0f16; }
/* 深色模式下线路名(Line 大字)颜色提亮,避免深色线路色看不清 */
:root[data-theme="dark"] .lrow .lnm { color:color-mix(in srgb,var(--lc,#4f8ef7) 55%,#fff 45%); }
/* 浅色模式下“方向 ▸”提示与图例关键词改用深琥珀色,避免黄字白底 */
:root[data-theme="light"] .dir .d-more { color:#8a5a00; }
:root[data-theme="light"] .day .dlg b { color:#7a5e00; }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--txt);
  font-family:-apple-system,"SF Pro SC","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Yu Gothic UI","Noto Sans JP",sans-serif;
  -webkit-tap-highlight-color:transparent; }
/* iOS 刘海/底部横条安全区 */
@supports (padding: max(0px)) {
  #side { top: max(10px, env(safe-area-inset-top)); }
  #topHud { top: max(10px, env(safe-area-inset-top)); }
  #dock { bottom: max(12px, env(safe-area-inset-bottom)); }
  #detail { bottom: max(14px, env(safe-area-inset-bottom)); }
  .foot { bottom: max(68px, calc(env(safe-area-inset-bottom) + 60px)); }
}
#map { position:absolute; inset:0; }
::-webkit-scrollbar { width:5px; height:5px; } ::-webkit-scrollbar-thumb { background:rgba(120,140,180,.28); border-radius:3px; } ::-webkit-scrollbar-thumb:hover { background:rgba(120,140,180,.45); } ::-webkit-scrollbar-track { background:transparent; }
button { font-family:inherit; }

/* ---------- 顶部极简 HUD(品牌 + 在途统计,非导航栏) ---------- */
#topHud { position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:9; display:flex; justify-content:center; pointer-events:none; max-width:calc(100vw - 16px); animation:topIn .55s var(--ease-smooth) both; }
@keyframes topIn { from { opacity:0; transform:translateX(-50%) translateY(-12px) scale(.96); } to { opacity:1; transform:translateX(-50%) translateY(0) scale(1); } }
#brand { pointer-events:auto; display:flex; align-items:center; gap:8px; height:38px; padding:0 15px 0 6px; cursor:pointer;
  border-radius:var(--r-pill); color:var(--txt);
  background:var(--glass); border:1px solid var(--glass-edge);
  backdrop-filter:blur(14px) saturate(1.4); -webkit-backdrop-filter:blur(14px) saturate(1.4);
  box-shadow:inset 0 1px 1px var(--glass-hi), inset 0 -1px 2px var(--glass-lo), var(--glass-sh);
  transition:background .2s var(--ease-smooth),border-color .2s var(--ease-smooth),transform .38s var(--ease-spring),box-shadow .25s var(--ease-smooth); white-space:nowrap; -webkit-tap-highlight-color:transparent; }
@media (hover:hover) { #brand:hover { background:var(--glass-2); transform:translateY(-1px); } }
#brand:active { transform:scale(.95); transition:transform .12s ease-in; }
#brand:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
#brand .lg { position:relative; width:26px; height:26px; border-radius:50%; background:var(--acc); color:#fff; display:flex; align-items:center; justify-content:center; flex:none;
  box-shadow:0 2px 8px var(--acc-soft), inset 0 1px 1px rgba(255,255,255,.45); overflow:hidden; }
#brand .lg::after { content:''; position:absolute; inset:0; border-radius:50%; background:linear-gradient(160deg,rgba(255,255,255,.5),rgba(255,255,255,0) 52%); }
#brand .lg svg { position:relative; z-index:1; }
#brand b { font-size:11.5px; font-weight:700; letter-spacing:.2px; color:var(--txt); }
.hud-sep { width:1px; height:15px; background:var(--glass-edge); flex:none; }
.badge { display:flex; align-items:center; gap:11px; }
.badge .b-it { display:flex; align-items:baseline; gap:4px; }
.badge .b-lb { font-size:9px; color:var(--dim); font-weight:600; letter-spacing:.3px; }
.badge b { font-size:12.5px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--txt); line-height:1; }
.badge .b-live-dot { width:6px; height:6px; border-radius:50%; background:#34d399; align-self:center; flex:none; animation:livepulse 1.8s ease-out infinite; }

/* ---------- 底部液态玻璃 Dock ---------- */
#dock { position:absolute; left:0; right:0; bottom:12px; height:var(--dock); z-index:9; pointer-events:none; transition:opacity .22s ease, transform .22s ease; }
#dockCenter { position:absolute; left:50%; bottom:0; transform:translateX(-50%); display:flex; align-items:flex-end; gap:8px; pointer-events:none; max-width:calc(100vw - 132px); animation:dockIn .6s var(--ease-spring) both; }
@keyframes dockIn { from { opacity:0; transform:translateX(-50%) translateY(18px) scale(.92); } to { opacity:1; transform:translateX(-50%) translateY(0) scale(1); } }
#dockCenter > * { pointer-events:auto; }

/* 圆形液态玻璃按钮(菜单 / 搜索 / 3D) */
.gcircle { position:relative; width:var(--dock); height:var(--dock); border-radius:50%; padding:0; flex:none;
  display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--txt);
  background:var(--glass); border:1px solid var(--glass-edge);
  backdrop-filter:blur(14px) saturate(1.4); -webkit-backdrop-filter:blur(14px) saturate(1.4);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5), inset 0 1px 1.5px var(--glass-hi), inset 0 -2px 4px var(--glass-lo), var(--glass-sh);
  transition:transform .38s var(--ease-spring), background .2s var(--ease-smooth), border-color .2s var(--ease-smooth), color .2s, box-shadow .25s var(--ease-smooth), opacity .25s var(--ease-smooth);
  overflow:hidden; -webkit-tap-highlight-color:transparent; }
.gcircle::before { content:''; position:absolute; inset:0; border-radius:50%;
  background:linear-gradient(165deg, rgba(255,255,255,.42) 0%, rgba(255,255,255,.06) 24%, rgba(255,255,255,0) 48%);
  pointer-events:none; transition:opacity .2s var(--ease-smooth), transform .2s var(--ease-smooth); }
/* 按压时泛起的镜面微光 */
.gcircle::after { content:''; position:absolute; inset:0; border-radius:50%; opacity:0; pointer-events:none;
  background:radial-gradient(circle at 50% 38%, rgba(255,255,255,.32), rgba(255,255,255,0) 62%); transition:opacity .18s var(--ease-smooth); }
@media (hover:hover) {
  .gcircle:hover { background:var(--glass-2); border-color:var(--glass-hi); transform:translateY(-1.5px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.6), inset 0 1px 1.5px var(--glass-hi), inset 0 -2px 4px var(--glass-lo), 0 10px 26px rgba(0,0,0,.32); }
  .gcircle:hover svg { transform:scale(1.08); }
}
.gcircle:active { transform:scale(.88); transition:transform .12s ease-in; }
.gcircle:active::before { opacity:.55; transform:scale(.92); }
.gcircle:active::after { opacity:1; }
.gcircle:active svg { transform:scale(.9); transition:transform .12s ease-in; }
.gcircle:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
.gcircle.on { background:var(--acc); border-color:var(--acc); color:#fff; box-shadow:0 6px 18px var(--acc-soft), inset 0 1px 1px rgba(255,255,255,.45); }
.gcircle.on::before { background:linear-gradient(165deg, rgba(255,255,255,.35), rgba(255,255,255,0) 50%); }
.gcircle svg { position:relative; z-index:1; transition:transform .38s var(--ease-spring); }
.btn { min-width:32px; min-height:32px; padding:0 11px; border:1px solid var(--line); border-radius:var(--r-sm); background:transparent;
  color:var(--txt); font-size:12px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); box-shadow:none; user-select:none; -webkit-user-select:none; transition:background .12s,border-color .12s,transform .3s var(--ease-spring); }
.btn:hover { border-color:var(--acc-border); background:var(--acc-soft); }
.btn:active { transform:scale(.94); transition:transform .1s ease-in; }
.btn:focus-visible { outline:2px solid var(--acc); outline-offset:1px; }
.btn.on { background:var(--acc); border-color:var(--acc); color:#fff; box-shadow:0 2px 10px var(--acc-soft); }
#btnLive { position:relative; display:inline-flex; align-items:center; gap:7px; }
#btnLive::before { content:''; width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.4; flex:none; }
#btnLive.on::before { background:#34d399; opacity:1; animation:livepulse 1.6s ease-out infinite; }
@keyframes livepulse { 0% { box-shadow:0 0 0 0 rgba(52,211,153,.5); } 70% { box-shadow:0 0 0 7px rgba(52,211,153,0); } 100% { box-shadow:0 0 0 0 rgba(52,211,153,0); } }
.btn.icon { padding:0; width:36px; }
.btn:disabled { opacity:.45; cursor:default; }

/* ---------- 左侧工具面板 ---------- */
#side { position:absolute; top:10px; left:10px; width:252px; max-height:calc(100vh - 84px);
  display:flex; flex-direction:column; background:transparent; border:0; border-radius:0;
  box-shadow:none; z-index:11; overflow:visible; opacity:1; visibility:visible;
  transition:width .2s ease, opacity .26s var(--ease-smooth), visibility 0s linear .26s;
  animation:sideIn .28s cubic-bezier(.2,.9,.3,1.12); }
@keyframes sideIn { from { opacity:0; transform:translateX(-14px) scale(.97); } to { opacity:1; transform:translateX(0) scale(1); } }
/* 分段控件:去外层底板后成为独立浮起的毛玻璃胶囊,与下方分组卡等宽对齐 */
#sideTabs { display:flex; gap:3px; padding:4px; margin:3px 2px 7px; background:rgba(120,140,180,.22);
  border:1px solid var(--glass-edge); border-radius:11px; flex:none;
  backdrop-filter:blur(14px) saturate(1.4); -webkit-backdrop-filter:blur(14px) saturate(1.4);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 4px 14px rgba(0,0,0,.18);
  transition:backdrop-filter .34s var(--ease-smooth), -webkit-backdrop-filter .34s var(--ease-smooth); }
.stab { flex:1; height:28px; display:flex; align-items:center; justify-content:center; gap:3px; background:transparent; border:0;
  border-radius:7px; color:var(--dim); font-size:11px; font-weight:600; cursor:pointer; transition:color .15s, background .28s var(--ease-spring), box-shadow .2s, transform .12s; }
.stab:hover { color:var(--txt); }
.stab:active { transform:scale(.93); }
.stab.on { color:var(--txt); background:rgba(255,255,255,.92); font-weight:700; box-shadow:0 1px 5px rgba(0,0,0,.28); }
#sideBody { overflow-y:auto; scrollbar-width:none; -ms-overflow-style:none; }
#sideBody::-webkit-scrollbar { width:0; height:0; display:none; }
.stab-sec { display:none; }
.stab-sec.on { display:block; }
#side .sec { padding:4px 10px 8px; margin:10px 2px; border-radius:13px; background:var(--glass-2); border:1px solid var(--glass-edge);
  backdrop-filter:blur(14px) saturate(1.4); -webkit-backdrop-filter:blur(14px) saturate(1.4);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 4px 14px rgba(0,0,0,.18);
  transition:backdrop-filter .34s var(--ease-smooth), -webkit-backdrop-filter .34s var(--ease-smooth); }
#side .sec:first-child { margin-top:6px; }
/* 空区块自动隐藏(无chips时不占高度) */
#side .sec:has(.frow:empty) { display:none; }
.sec-t { font-size:10px; font-weight:600; letter-spacing:.3px; color:var(--dim); margin:8px 2px 6px; opacity:.85; }
.sec-t::before { content:none; }

/* 收起态:玻璃整体淡出(不再 display 硬切) */
#side.collapsed { opacity:0; visibility:hidden; pointer-events:none;
  transition:opacity .22s var(--ease-smooth), visibility 0s linear .22s; }
/* 菜单收起时各卡片模糊同步归零(展开时模糊渐显,可见高斯痕迹) */
#side.collapsed #sideTabs, #side.collapsed .sec {
  backdrop-filter:blur(0) saturate(1); -webkit-backdrop-filter:blur(0) saturate(1); }

/* ---------- 左侧面板 morph(与时间胶囊同一套弹簧语言) ----------
   原先 #side 的开关只有 opacity .22~.26s 的原地淡入:sideIn 那段位移动画只在页面
   加载时跑一次,点菜单按钮切换时完全不参与 —— 面板是"闪出来"而不是"长出来"。
   现在:壳以菜单按钮为水平锚点做 scale+位移+透明度(真弹簧,复用 --spring-out),
   内部卡片(分段控件 + 各分组卡)错峰浮现并带模糊消解;
   收起 = 展开的时间反向:卡片按倒序错峰退场,壳延迟到与最后一张卡片同时收拢回按钮,
   进出共用同一条弹簧曲线 —— 从哪来回哪去,来去动效互为镜像。 */
#side { transform-origin:var(--side-ox,12px) 100%; }
/* morph 期间必须关掉 CSS 过渡与 visibility 延迟:基础规则里 visibility 有 .26s 延迟,
   不关掉的话展开动画的前 260ms 面板根本不可见。will-change 仅动画期挂载,结束即摘。 */
#side.morphing { transition:none !important; visibility:visible !important; will-change:transform,opacity; }
/* 收起时卡片由 CSS 兜住 opacity:0(倒序退场动画进行中或动画被取消后都不会闪回不透明) */
#side.leaving #sideTabs, #side.leaving .sec { opacity:0; }
/* 菜单↔关闭 图标切换:与播放键同款 iconPop,让按钮自己也参与这套动效语言 */
#btnSide svg { animation:iconPop .3s var(--ease-spring); }

/* 搜索 */
.tbox { width:100%; min-height:36px; padding:0 12px; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--panel2);
  color:var(--txt); font-size:12.5px; outline:none; transition:border-color .15s, box-shadow .15s; }
.tbox:focus { border-color:var(--acc); box-shadow:0 0 0 3px var(--acc-soft); }
.tbox::placeholder { color:var(--dim); opacity:.7; }
#sug { margin-top:6px; max-height:220px; overflow-y:auto; display:none; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--panel2); box-shadow:var(--shadow); }
.sug-it { padding:6px 10px; font-size:11.5px; cursor:pointer; display:flex; justify-content:space-between; gap:8px; align-items:center; }
.sug-it:hover, .sug-it:focus-visible, .sug-it.hl-it { background:var(--acc-soft); outline:none; }
.sug-it.hl-it { box-shadow:inset 2px 0 0 var(--acc); }
.sug-it .k { color:var(--dim); font-size:10px; align-self:center; flex:none; }

  color:var(--txt); font-size:11.5px; font-weight:600; padding:7px 15px; border-radius:var(--r-pill); z-index:40;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2), var(--glass-sh); max-width:80vw;
  opacity:0; visibility:hidden; pointer-events:none;
  backdrop-filter:blur(0) saturate(1); -webkit-backdrop-filter:blur(0) saturate(1);
  transition:opacity .24s var(--ease-smooth), backdrop-filter .24s var(--ease-smooth), -webkit-backdrop-filter .24s var(--ease-smooth), visibility 0s linear .24s; }
#toast.show { opacity:1; visibility:visible; backdrop-filter:blur(14px) saturate(1.4); -webkit-backdrop-filter:blur(14px) saturate(1.4);
  transition:opacity .24s var(--ease-smooth), backdrop-filter .24s var(--ease-smooth), -webkit-backdrop-filter .24s var(--ease-smooth), visibility 0s linear 0s; }

/* ---------- 独立搜索浮层(iOS Spotlight) ---------- */
#searchMask { position:fixed; inset:0; background:rgba(0,0,0,.32); z-index:24; opacity:0; visibility:hidden; pointer-events:none; transition:opacity .25s ease, visibility 0s linear .25s; }
#searchMask.open { opacity:1; visibility:visible; pointer-events:auto; transition:opacity .25s ease, visibility 0s linear 0s; }
#searchPanel { position:fixed; top:max(10px,env(safe-area-inset-top)); left:50%; transform:translate(-50%,-14px) scale(.96); width:min(520px,calc(100vw - 24px)); z-index:25;
  background:var(--panel); border:1px solid var(--glass-edge); border-radius:20px; overflow:hidden; opacity:0; visibility:hidden; pointer-events:none;
  backdrop-filter:blur(26px) saturate(1.6); -webkit-backdrop-filter:blur(26px) saturate(1.6);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2), var(--glass-sh);
  transition:opacity .26s var(--ease-smooth), transform .42s var(--ease-spring), visibility 0s linear .26s; }
#searchPanel.open { opacity:1; visibility:visible; pointer-events:auto; transform:translate(-50%,0) scale(1);
  transition:opacity .26s var(--ease-smooth), transform .42s var(--ease-spring), visibility 0s linear 0s; }
.sp-bar { display:flex; align-items:center; gap:9px; padding:12px 14px; }
.sp-ic { color:var(--dim); display:flex; flex:none; }
#searchPanel .tbox { flex:1; min-width:0; border:0; background:transparent; padding:0; font-size:16px; min-height:24px; }
#searchPanel .tbox:focus { border:0; box-shadow:none; }
#spClear { flex:none; width:20px; height:20px; border-radius:50%; border:0; background:rgba(120,140,180,.45); color:#fff; display:none; align-items:center; justify-content:center; cursor:pointer; padding:0; }
#spClear.show { display:flex; }
#searchPanel #sug { margin:0; max-height:min(52vh,420px); border:0; border-radius:0; background:transparent; box-shadow:none; border-top:1px solid var(--line); }
#searchPanel #sug .sug-it { padding:9px 14px; font-size:13px; }
#searchPanel #sug .sug-empty { padding:14px; font-size:13px; }
.foot { position:absolute; bottom:68px; right:12px; font-size:9px; color:var(--dim); z-index:5; pointer-events:none; text-shadow:0 1px 3px rgba(0,0,0,.6); opacity:.9; max-width:min(260px,calc(100vw - 24px)); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:right; }
.maplibregl-ctrl-attrib { background:color-mix(in srgb,var(--panel) 65%,transparent)!important; backdrop-filter:blur(8px); color:var(--dim)!important; font-size:8.5px!important; padding:2px 7px!important; border-radius:8px 0 0 0!important; }
.maplibregl-ctrl-attrib a { color:var(--dim)!important; }

@media (max-width:2000px) {
  :root { --dock:46px; }
  /* 顶部 HUD:隐藏标题文字,保留在途/今日统计 */
  #topHud { top:8px; }
  #brand { height:34px; padding:0 12px 0 5px; gap:7px; }
  #brand .lg { width:24px; height:24px; }
  #brand b { display:none; }
  .badge { gap:9px; }
  /* 左侧面板:近全屏 */
  #side { top:8px; left:8px; width:calc(100vw - 16px); max-height:calc(100vh - 104px); border-radius:18px; }
  #side .sec { padding:6px 10px; }
  /* 底部 Dock */
  #dock { bottom:10px; }
  #dockCenter { gap:7px; max-width:calc(100vw - 124px); }
  /* ---- 时间胶囊:折叠药丸 ----
     几何量(width/height/border-radius/padding)全部交给 WAAPI 的单条弹簧时间轴驱动,
     CSS 只过渡颜色与阴影 —— 原先 width(280ms spring)/radius(.4s smooth)/padding(.32s smooth)
     三条曲线各自收尾,视觉上是"散"的;统一后整体像一块玻璃在形变。 */
  #clock { width:max-content; max-width:100%; padding:7px 10px; border-radius:999px;
    transition:box-shadow .3s var(--ease-smooth), background .3s var(--ease-smooth), border-color .3s var(--ease-smooth); }
  #clock .r2, #clock .sp-main, #clock .daychip { display:none; }
  #clock .ldot { display:none; }
  #clock .ct { cursor:pointer; -webkit-tap-highlight-color:transparent; }
  #clock .t { font-size:15px; min-width:0; }
  #clock #btnPlay { flex:none !important; width:32px !important; min-width:32px !important; aspect-ratio:1 !important; border-radius:50% !important; padding:0 !important; box-sizing:border-box !important; }
  /* flex:none 是 snap() 能量准的前提:否则测量瞬间两侧圆按钮还没收缩完(仍 46px),
     flex-shrink 会把胶囊挤窄约 106px,量到偏小的目标值,WAAPI 结束回落 CSS 时宽度会跳 */
  #clock.expanded { width:calc(100vw - 16px); flex:none; padding:6px 10px 7px; border-radius:18px; }
  #clock.expanded .r1 { gap:6px; }
  #clock.expanded .r2, #clock.expanded .sp-main, #clock.expanded .daychip { display:flex; }

  /* 内容分层入场:壳在长的同时,倍速→运行日→滑块行依次浮现(stagger),
     带 2px 起手的模糊消解 —— 玻璃里的东西是"透出来"的,不是"插进来"的 */
  #clock.expanded .sp-main { animation:capIn .34s var(--ease-smooth) .05s both; }
  #clock.expanded .daychip { animation:capIn .34s var(--ease-smooth) .09s both; }
  #clock.expanded .r2      { animation:capIn .38s var(--ease-smooth) .13s both; }
  /* 收起:内容先走(130ms),壳再收 —— 修掉原先"内容瞬间消失、空壳再瘪"的时序倒置。
     .leaving 规则须写在 .expanded 之后:同特异度下后者胜出 */
  #clock.leaving .r2, #clock.leaving .sp-main, #clock.leaving .daychip { animation:capOut .13s ease-in both; }
  @keyframes capIn  { from { opacity:0; transform:translateY(7px) scale(.94); filter:blur(2px); }
                        to { opacity:1; transform:none; filter:blur(0); } }
  @keyframes capOut { from { opacity:1; transform:none; }
                        to { opacity:0; transform:translateY(-5px) scale(.96); } }

  /* 形变期间:裁掉溢出 + 隔离布局 + 提升合成层;动画结束立即移除(不常驻 will-change) */
  #clock.morphing { overflow:hidden; contain:layout paint; will-change:width,height; }


  /* ---- 两侧圆按钮:留在布局里连续收缩 ----
     原先用 position:absolute 瞬间脱离布局,dockCenter 的 flex 在一帧内从
     "按钮+胶囊+按钮"变成"只剩胶囊",胶囊左边缘瞬跳 —— 那是"闪一下"的来源。
     改为 width→0 + 负 margin 吃掉 gap,让宽度变化全程连续。 */
  .gcircle { transition:transform .38s var(--ease-spring), background .2s var(--ease-smooth),
      border-color .2s var(--ease-smooth), color .2s, box-shadow .25s var(--ease-smooth),
      opacity .22s var(--ease-smooth),
      width var(--morph-out) var(--spring-out), border-width var(--morph-out) var(--spring-out),
      margin var(--morph-out) var(--spring-out); }
  #dock:has(#clock.expanded) #btnSide, #dock:has(#clock.expanded) #btnSearch {
    width:0; margin-inline:-3.5px; border-width:0;   /* -3.5×2×2 = -14px,正好抵消两个 7px gap */
    opacity:0; transform:scale(.5); pointer-events:none; }
  /* justify-content:center:展开后 dockCenter 变全宽,若仍左对齐,胶囊左边缘会瞬移到最左;
     居中后胶囊以中心为基准向两侧对称生长,圆按钮同步让位 —— 这才是 morph 而不是位移。
     dockCenter 的宽度不给过渡:max-content → calc() 不可插值,跳变时机由浏览器决定,
     会让 snap() 量到的目标值不确定;改成即时生效 + 居中,测量结果完全确定。 */
  #dockCenter { justify-content:center; }
  #dock:has(#clock.expanded) #dockCenter { max-width:calc(100vw - 16px); width:calc(100vw - 16px); }
  /* 详情卡打开时整体隐藏底部 Dock */
  #dock.hide { opacity:0; pointer-events:none; transform:translateY(14px); }
  #detail { width:calc(100vw - 12px); left:6px; border-radius:22px; padding:12px 13px 11px; bottom:8px; }
  #detail .d-x { min-width:32px; min-height:32px; width:32px; }
  #detail .d-act .btn { min-height:40px; }
  /* ---- 移动端详情卡:默认折叠为头部胶囊,拖拽头部行三档吸附(折叠/中/全),点击头部切换 ----
     折叠态 z-index:12 高于 Dock(9),重叠区点击归窗口所有,杜绝穿透 */
  #detail { height:68px;
    transition:opacity .26s var(--ease-smooth), backdrop-filter .26s var(--ease-smooth), -webkit-backdrop-filter .26s var(--ease-smooth), transform .34s var(--ease-spring), height .32s var(--ease-spring), visibility 0s linear .26s; }
  #detail.fold { display:flex; align-items:center; }
  #detail.fold .d-h { width:100%; }
  #detail.fold .d-meta, #detail.fold .d-sep, #detail.fold .d-stops, #detail.fold .d-act { display:none; }
  #detail.medium { height:62vh; }
  #detail.medium .d-act { display:none; }
  #detail.medium .st-list { max-height:calc(62vh - 300px); }
  #detail.full { height:92vh; }
  #detail.full .st-list { max-height:min(264px, calc(92vh - 330px)); }
  #detail.dragging { transition:none; }
  .foot { display:none; }
  /* 表单元素 ≥16px 防止 iOS 聚焦自动缩放 */
  .tbox, #rFrom, #rTo { font-size:16px; }
  .btn { min-height:38px; min-width:38px; }
  .btn.icon { width:38px; }
  .chip { padding:4px 10px; font-size:10.5px; min-height:22px; }
  .sw { padding:8px 2px; font-size:12.5px; }
  .sw .trk { width:40px; height:24px; border-radius:12px; }
  .sw .trk::after { width:20px; height:20px; }
  .sw.on .trk::after { left:18px; }
}

/* 极窄屏(≤380px)进一步收紧,给时间胶囊留出呼吸空间 */
@media (max-width:380px) {
  :root { --dock:44px; }
  #dockCenter { gap:6px; max-width:calc(100vw - 108px); }
  #clock { padding:6px 8px; }
  #clock .t { font-size:14px; }
  #clock #btnPlay { width:30px !important; min-width:30px !important; }
}

/* 可访问性:尊重系统"降低透明度",液态玻璃回退为不透明实底(:not(.on) 保留激活蓝) */
@media (prefers-reduced-transparency: reduce) {
  #brand, .gcircle:not(.on), #clock, #side .sec, #sideTabs, #detail, #sheet, .spb:not(.on), #clock .daychip {
    background:var(--glass-solid) !important;
    backdrop-filter:none !important; -webkit-backdrop-filter:none !important;
  }
}
/* 可访问性:尊重系统"减弱动态效果",关闭脉冲与过渡 */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
}

/* ============ 车站底部抽屉(时刻表 · Liquid Glass,保留抽屉形态) ============ */
#sheetMask { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:20; display:block; opacity:0; visibility:hidden; transition:opacity .3s ease, visibility 0s linear .3s; }
#sheetMask.open { opacity:1; visibility:visible; transition:opacity .3s ease, visibility 0s linear 0s; }
#sheet { position:fixed; left:50%; bottom:0; width:min(520px,100vw); height:76vh;
  background:var(--glass-panel); border:1px solid var(--glass-edge); border-bottom:0; border-radius:26px 26px 0 0;
  box-shadow:inset 0 1px 0 var(--glass-hi), inset 0 -1px 1px var(--glass-lo), 0 -12px 44px rgba(0,0,0,.45);
  z-index:21; display:flex; flex-direction:column;
  opacity:0; visibility:hidden; pointer-events:none;
  backdrop-filter:blur(0) saturate(1); -webkit-backdrop-filter:blur(0) saturate(1); transform:translate(-50%,26px);
  transition:opacity .3s var(--ease-smooth), backdrop-filter .3s var(--ease-smooth), -webkit-backdrop-filter .3s var(--ease-smooth), transform .42s var(--ease-spring), visibility 0s linear .3s; }

  backdrop-filter:blur(34px) saturate(1.9); -webkit-backdrop-filter:blur(34px) saturate(1.9);
  transition:opacity .3s var(--ease-smooth), backdrop-filter .3s var(--ease-smooth), -webkit-backdrop-filter .3s var(--ease-smooth), transform .42s var(--ease-spring), visibility 0s linear 0s; }
#sheet .grab { width:44px; height:5px; border-radius:3px; background:rgba(150,170,200,.5); margin:11px auto 3px; flex:none; }
#sheet .sh-head { padding:13px 20px 4px; display:flex; align-items:flex-start; flex:none; }
#sheet .sh-nm { font-size:30px; font-weight:800; letter-spacing:-.5px; line-height:1.05; }

#sheet .sh-tabs button:hover { color:var(--txt); }

#sheet .grp-op .op-logo { max-height:22px; max-width:72px; width:auto; height:auto; object-fit:contain; background:#fff; border-radius:4px; padding:2px 5px; flex:none; }
#sheet .grp-op .op-ic { min-width:22px; height:22px; padding:0 4px; border-radius:6px; background:#1a853c; color:#fff; font-size:10px; font-weight:900; display:flex; align-items:center; justify-content:center; }
.lrow { display:flex; align-items:center; gap:12px; padding:13px 14px; margin:8px 0; border:1px solid var(--glass-edge); border-radius:16px; background:var(--glass); cursor:pointer; user-select:none; -webkit-user-select:none;
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  box-shadow:inset 0 1px 0 var(--glass-hi), 0 2px 8px var(--glass-lo);
  transition:background .12s, transform .18s var(--ease-smooth); }

.lpanel { margin:2px 0 12px; border-left:3px solid var(--lc,#4f8ef7); padding:0 0 0 12px; display:none; }
.lpanel.open { display:block; }

.type-chips .tc:hover { background:rgba(120,140,180,.24); color:var(--txt); }

.dir { margin:10px 0; border-radius:16px; overflow:hidden; border:1px solid color-mix(in srgb,var(--lc,#4f8ef7) 40%, transparent); background:color-mix(in srgb,var(--lc,#4f8ef7) 8%, transparent); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }

</style>

<script type="module">
/* ================================================================== *
 *  Mini JapanRail 3D — 全日本铁路实时运行地图(单文件版)
 *  数据:本地时刻表(trains_*.json + tmaps.json)+ 轨道几何(segments3d/stations3d)
 *  渲染:MapLibre GL JS v6(Globe 投影)+ projectTile 注入自定义 WebGL 列车层
 *  时钟:JST 每帧推算全部在途列车位置,运行时零数据请求
 * ================================================================== */
import * as maplibregl from 'https://cdn.jsdelivr.net/npm/maplibre-gl@6.12.0/dist/maplibre-gl.mjs';

/* ---------------- 常量 ---------------- */
const JST = 9 * 3600 * 1000;
const TRAIN_FILES = { 1: 'data/trains_wd.json', 2: 'data/trains_sa.json', 4: 'data/trains_su.json' };
const DAY_LABEL = { 1: { zh:'平日', ja:'平日', en:'Weekday' }, 2: { zh:'周六', ja:'土曜', en:'Saturday' }, 4: { zh:'周日・假', ja:'日曜・祝', en:'Sun/Holiday' } };
const KINDS = ['鉄道','路面電車','モノレール','案内軌条式','鋼索鉄道','浮上式','無軌条電車'];
const KIND_I18N = {
  '鉄道':       { zh:'铁路',   ja:'鉄道',     en:'Railway' },
  '路面電車':   { zh:'路面电车', ja:'路面電車', en:'Tram' },
  'モノレール': { zh:'单轨',   ja:'モノレール', en:'Monorail' },
  '案内軌条式': { zh:'新交通', ja:'案内軌条式', en:'AGT' },
  '鋼索鉄道':   { zh:'索道铁轨', ja:'鋼索鉄道', en:'Cable' },
  '浮上式':     { zh:'磁浮',   ja:'浮上式',   en:'Maglev' },
  '無軌条電車': { zh:'无轨电车', ja:'無軌条電車', en:'Trolleybus' },
};
const TYPE_COLOR = [
  [/^(Hayabusa|Komachi|Yamabiko|Tsubasa|Kagayaki|Toki|Hakutaka|Asama|Nasuno|Tanigawa|Nozomi|Hikari|Kodama|Hayate|Yamato|Sakura|Mizuho|Tsubame|Kamome|Sonic|Mizuho$)/, '#2ecc71'],
  [/^特/, '#ff5a5a'], [/^(快|急|通特|特快)/, '#ffb340'], [/^(準|区|通|回|ライナー|Liner)/, '#9aa5b5'],
  [/^(各|普|ワンマン)/, '#4f8ef7'],
];
function typeColor(ic) {
  if (!ic) return '#8fd0ff';
  for (const [re, c] of TYPE_COLOR) if (re.test(ic)) return c;
  return '#8fd0ff';
}
/* ---- 特急爱称识别（tokkyu.json：按「起点>终点|途经线路」签名映射，普适于时刻表变化） ---- */
let TOKKYU = null; // {sh: icon->日语名, nm: 签名->爱称, nmI: 签名|icon->爱称}
const TOKKYU_ICONS = new Set(['特','関','紀','中','丹','寝','京','ミ','フ','富','九','川','Ｔ','Ｓ','Ｎ','ホ','拝','ラ','ア','エ','空']);
/* 特殊 icon 的兜底名（签名表未命中时使用；签名命中优先） */
const ICON_NAME = {
  '関':'はるか','紀':'くろしお','丹':'こうのとり','ミ':'ミュースカイ','フ':'フジサン特急','富':'フジサン特急',
  '九':'九州横断特急','京':'京王特急','川':'川越特急','Ｔ':'東武特急','Ｓ':'直通特急','Ｎ':'西鉄特急',
  'ホ':'ホームライナー','拝':'拝島ライナー','ア':'アクセス特急','エ':'アクセス特急','空':'空港快速',
  '寝':'寝台特急','中':'中央線特急','ラ':'ライナー'
};
function tripSig(N, jas, linesN) {
  const o = normName(jas[0]), d = normName(jas[N - 1]);
  return o + '>' + d + '|' + (linesN || []).map(normName).sort().join('|');
}
function tripName(ic, N, jas, linesN) {
  if (!TOKKYU) return null;
  if (TOKKYU.sh[ic]) return TOKKYU.sh[ic];            // 新干线：icon 自带英文名 → 日语名
  if (!TOKKYU_ICONS.has(ic)) return null;             // 非特急级不参与
  const sig = tripSig(N, jas, linesN);
  return TOKKYU.nmI[sig + '|' + ic] || TOKKYU.nm[sig] || ICON_NAME[ic] || null;
}
/* ---- 併结/分割列车检测:同发车时刻 + 同起点同向 + 共享连续站序 ≥3 站 + 运行窗重叠
       → 登记併结窗口 [t0,t1]、分割站、伙伴车次。併结区间内两车坐标重合,
         渲染时沿车尾方向错开一个车长(一前一后紧贴),分割后各自运行 ---- */
function buildCouplings(trips) {
  const byDep = new Map();
  for (let i = 0; i < trips.length; i++) {
    const t = trips[i];
    if (t.bad || t.N < 4) continue;
    const k = t.dep[0];
    let b = byDep.get(k); if (!b) byDep.set(k, b = []);
    b.push(t);
  }
  let pairs = 0;
  for (const bucket of byDep.values()) {
    if (bucket.length < 2) continue;
    for (let a = 0; a < bucket.length; a++) for (let b = a + 1; b < bucket.length; b++) {
      const A = bucket[a], B = bucket[b];
      if (A.jasN[0] !== B.jasN[0] || A.jasN[1] !== B.jasN[1]) continue; // 同起点且同向(第二站相同)
      /* 最长公共连续站序(双向遍历,含起点) */
      let best = 0, endA = 0, endB = 0;
      for (let i = 0; i < A.N; i++) for (let j = 0; j < B.N; j++) {
        if (A.jasN[i] !== B.jasN[j]) continue;
        let k = 0;
        while (i + k < A.N && j + k < B.N && A.jasN[i + k] === B.jasN[j + k]) k++;
        if (k > best) { best = k; endA = i + k - 1; endB = j + k - 1; }
      }
      if (best < 3) continue;                                    // 至少 3 站(2+ 区间)才算併结
      if (endA === A.N - 1 && endB === B.N - 1) continue;        // 公共段覆盖双方全程 = 重复记录/完全相同列车
      const na = A.nm || '', nb = B.nm || '';
      if (na && nb && na === nb) continue;                       // 同爱称非同向併结(如のぞみ×のぞみ)
      const stA = endA - best + 1, stB = endB - best + 1;
      const t0 = Math.max(A.dep[stA], B.dep[stB]);               // 进入併结段(发车)
      const t1 = Math.min(A.dep[endA], B.dep[endB]);             // 离开分割站(发车)
      const w0 = Math.max(A.w0, B.w0), w1 = Math.min(A.w1, B.w1);
      if (t0 > w1 || t1 < w0) continue;                          // 运行窗无交集
      const c0 = Math.max(t0, w0), c1 = Math.min(t1, w1);
      const split = A.jasN[endA];
      (A.cpl = A.cpl || []).push({ p: B, t0: c0, t1: c1, split, name: nb || B.i || '' });
      (B.cpl = B.cpl || []).push({ p: A, t0: c0, t1: c1, split, name: na || A.i || '' });
      pairs++;
    }
  }
  if (window.__dbgOn) console.log('[couple] ' + pairs + ' pairs');
  return trips;
}
/* 日本节假日 2024–2030(固定日 + 春分/秋分),振替休日与国民の休日按规则推导 */
const HOLIDAY_BASE = {
  2024: [[1,1],[1,8],[2,12],[2,23],[3,20],[4,29],[5,3],[5,4],[5,5],[5,6],[7,15],[8,11],[9,16],[9,23],[10,14],[11,4],[11,23]],
  2025: [[1,1],[1,13],[2,11],[2,23],[3,20],[4,29],[5,3],[5,4],[5,5],[5,6],[7,21],[8,11],[9,15],[9,23],[10,13],[11,3],[11,24]],
  2026: [[1,1],[1,12],[2,11],[2,23],[3,20],[4,29],[5,3],[5,4],[5,5],[5,6],[7,20],[8,11],[9,21],[9,22],[9,23],[10,12],[11,3],[11,23]],
  2027: [[1,1],[1,11],[2,11],[2,23],[3,22],[4,29],[5,3],[5,4],[5,5],[7,19],[8,11],[9,20],[9,23],[10,11],[11,3],[11,23]],
  2028: [[1,1],[1,10],[2,11],[2,23],[3,20],[4,29],[5,3],[5,4],[5,5],[7,17],[8,11],[9,18],[9,22],[10,9],[11,3],[11,23]],
  2029: [[1,1],[1,8],[2,11],[2,12],[2,23],[3,20],[4,29],[5,3],[5,4],[5,5],[7,16],[8,11],[9,17],[9,23],[10,8],[11,3],[11,23]],
  2030: [[1,1],[1,14],[2,11],[2,23],[3,21],[4,29],[5,3],[5,4],[5,5],[5,6],[7,15],[8,11],[9,16],[9,23],[10,14],[11,4],[11,23]],

const HOLIDAYS = (() => {
  const set = new Set();

      const lm = cached.lm;

        if (res.status === 304) { updateBar(fIdx, 1, 1); return cached.j; }

      followNullT = 0;
      /* 跟随相机(MC v2):「精确锁定 + 大跳变缓动」——
         矩阵 float32 量化已修复(投影误差 0),正常行驶时列车每帧屏幕位移 ≤1.4px(z16 上限,
         新干线 300km/h),直接 jumpTo 对准列车 → 列车锁死在屏幕中心,无缓动滞后漂移 = 无抖动;
         仅当列车位置出现偶发大跳变(数据刷新/到站 snap,屏幕位移 >6px)时走指数缓动平滑过渡,
         避免镜头突跳。 */
      const sp = map.project([p[0], p[1]]);
      const cwpx = map.getCanvas().clientWidth || 1, chpx = map.getCanvas().clientHeight || 1;
      const ddx = sp.x - cwpx / 2, ddy = sp.y - chpx / 2;

        const a = 1 - Math.exp(-dt / 0.12);

    const staticFrame = (paused && !followTrip && !liveDetailTrip && !sliderDragging) || document.hidden;

    if (n !== lastActiveN) { lastActiveN = n; $('bLive').textContent = n.toLocaleString(); pulseStat($('bLive')); }
    if (Math.floor(now / 1000) !== lastFpsSec) { $('dFps').textContent = Math.round(fps); lastFpsSec = Math.floor(now / 1000); }
    if (followTrip) { tickFollow(M, dt); updateDetailLive(followTrip, null, M); }

            (k < N - 1 ? '<span class="vln dn" style="background:' + dnCol + '"></span>' : '') +
            '</span><span class="vc"><span class="vnm">' + esc(t.jas[k]) + '</span>' +
            (tm.length ? '<span class="vtm">' + tm.join('<i class="sep">·</i>') + '</span>' : '') +
            '</span></div>';
        }
        return s;
      })() +
      '</div></div>' +
      '<div class="d-act"><button class="btn' + (followTrip === t ? ' on' : '') + '" id="dFollow">' + (followTrip === t ? ICO.stop : ICO.follow) + ' ' + (followTrip === t ? T().stopFollowBtn : T().followBtn) + '</button>' +
      '<button class="btn" id="dLoc">' + ICO.loc + ' ' + T().locateBtn + '</button></div>';
    /* 立即标记停靠站状态(已过/停靠中/下一站),并滚动时间线到当前站——不依赖下一帧差异检测 */
    t._dI = i;
    const stl0 = detailEl.querySelector('.d-stops');
    if (stl0) {
      const ni0 = Math.min(i + 1, N - 1);
      stl0.querySelectorAll('.dstop').forEach(row => {
        const k = parseInt(row.dataset.i, 10);
        row.classList.remove('here', 'next', 'done');
        if (k < i) row.classList.add('done');
        else if (k === i) { if (!running && k < N - 1) row.classList.add('here'); else row.classList.add('done'); }
        if (ni0 > i && k === ni0) row.classList.add('next');
      });
      const actRow = stl0.querySelector('.dstop.here, .dstop.next');
      if (actRow) actRow.scrollIntoView({ block: 'center', behavior: 'auto' });
    }
    $('dClose').onclick = () => { closeDetail(); liveDetailTrip = null; if (followTrip) stopFollow(); };
    $('dFollow').onclick = () => { if (followTrip === t) stopFollow(); else startFollow(t); };
    $('dLoc').onclick = () => { if (p) map.flyTo({ center: [p[0], p[1]], zoom: Math.max(map.getZoom(), 12), pitch: 55, duration: 1200 }); };
  } else {
    /* 每帧 innerHTML 重写有 GC/排版开销:内容不变时跳过,只写变化行 */
    const st = detailEl.querySelector('.d-meta');
    if (st) {
      const s1 = '<span class="lb">' + T().status + '</span><span class="mv"><span class="st-badge ' + (running ? 'run' : 'dwell') + '"></span>' + (running ? T().running + ' · ' + Math.round(p[5]) + ' ' + T().kmh : '<b>' + T().dwelling + '</b> @ ' + jas[i]) + '</span>';
      if (s1 !== t._dS1) { st.children[0].innerHTML = s1; t._dS1 = s1; }
      const s2 = '<span class="lb">' + T().next + '</span><span class="mv">' + nextNm + ' ' + eta + '</span>';
      if (s2 !== t._dS2) { st.children[1].innerHTML = s2; t._dS2 = s2; }
      /* 停靠站动态高亮:当前停靠站/已过站/前方下一站 */
      const stl = detailEl.querySelector('.d-stops');
      if (stl && i !== t._dI) {
        t._dI = i;
        const ni2 = Math.min(i + 1, N - 1);
        stl.querySelectorAll('.dstop').forEach(row => {
          const k = parseInt(row.dataset.i, 10);
          row.classList.remove('here', 'next', 'done');
          if (k < i) row.classList.add('done');
          else if (k === i) { if (!running && k < N - 1) row.classList.add('here'); else row.classList.add('done'); }
          if (ni2 > i && k === ni2) row.classList.add('next');
        });
      }
    }
  }
}
let followStartT = 0;
function startFollow(t) {
  followTrip = t;
  followStartT = performance.now();
  if (!liveOn) setLive(true);
  liveDetailTrip = t;
  const p = trainPosition(t, windowShift(t, curMin()));
  if (p) map.flyTo({ center: [p[0], p[1]], zoom: Math.max(map.getZoom(), 11.5), pitch: Math.max(map.getPitch(), 45), duration: 900 });
  toast(T().follow + (t.nm ? ' · ' + t.nm : '') + ' · #' + t.t);
  if (liveDetailTrip) showTrainDetail(t);
  detailEl.classList.add('following');
  const df = $('dFollow'); if (df) { df.classList.add('on'); df.textContent = T().followBtn; }
}
function stopFollow(silent) {
  if (followTrip && !silent) toast(T().followStop);
  followTrip = null;
  trTagEl.classList.remove('show');
  detailEl.classList.remove('following');
  if (liveDetailTrip && $('dFollow')) {
    $('dFollow').classList.remove('on'); $('dFollow').textContent = T().followBtn;
  }
}

      if (x === src[0].idx) continue;
      const j = src[a].entry.indexOf(src[0].entry[x]);
      if (j >= 0 && j !== src[a].idx) { X = src[0].entry[x]; break; }
    }
    if (!X) { src[a].side = 1; continue; }

class Heap {

    if (st === B) {

/* 菜单面板 morph —— 与时间胶囊同一套弹簧语言:
   壳(整叠玻璃卡)以菜单按钮为水平锚点做 scale+位移+透明度;
   内部分段控件与各分组卡错峰浮现(capIn 同款:透明度 + 位移 + 2px 模糊消解);
   收起 = 展开的时间反向:卡片按倒序错峰退场,壳延迟到与最后一张卡片同时收拢回按钮,
   进出共用同一条弹簧曲线 —— 从哪来回哪去,来去动效互为镜像。 */
(function () {
  if (!sideEl) return;
  const btn = $('btnSide');
  const RM = window.matchMedia('(prefers-reduced-motion: reduce)');
  const SPRING_OUT = 'linear(0,.0598,.1976,.3654,.5321,.68,.8007,.8924,.9573,.9996,1.0241,1.0356,1.0384,1.0358,1.0304,1.0239,1.0175,1.0119,1.0074,1.0039,1.0015,.9999,.999,.9986,.9985,.9986,.9989,.9991,.9993,.9996,1)';
  const BEZ_OUT = 'cubic-bezier(.22,1.12,.36,1)';
  const SMOOTH = 'cubic-bezier(.16,1,.3,1)';
  const DUR_OUT = 460, CARD_DUR = 340, CARD_STEP = 45;
  const supportsLinear = !!(window.CSS && CSS.supports && CSS.supports('transition-timing-function', 'linear(0,1)'));
  const easeOut = () => supportsLinear ? SPRING_OUT : BEZ_OUT;
  const CARD_IN  = [{ opacity:0, transform:'translateY(9px) scale(.985)', filter:'blur(2.5px)' },
                    { opacity:1, transform:'none', filter:'blur(0)' }];
  /* 卡片退场 = 进场帧的精确反向(同一弹簧语言、同一方向、同一模糊),实现"从哪来回哪去" */
  const CARD_OUT = [{ opacity:1, transform:'none', filter:'blur(0)' },
                    { opacity:0, transform:'translateY(9px) scale(.985)', filter:'blur(2.5px)' }];
  let anims = [];

  function cancelAll() { anims.forEach(a => { try { a.cancel(); } catch (e) {} }); anims = []; }
  /* 所有动画自然落定后摘掉 morphing,让纯 CSS 接管终态(关键帧末值与 CSS 终值一致,无跳变) */
  function settle(after) {

      cancelAll(); sideEl.classList.remove('morphing');
      if (after) after();
    });
  }
  /* 锚点:水平方向对准菜单按钮中心,垂直方向取面板底边 —— 面板从按钮那一侧长出来。
     只算水平是因为按钮在屏幕底部、面板在顶部,若垂直锚点也取按钮中心(距面板顶 ~700px),
     0.045 的缩放会让顶边位移 30px+,变成"甩上来"而不是"长出来"。 */
  function setOrigin() {
    if (!btn) return;
    const p = sideEl.getBoundingClientRect(), b = btn.getBoundingClientRect();
    if (b.width < 1) return;      /* 按钮被时间胶囊挤成 0 宽时不更新,沿用上次锚点 */
    sideEl.style.setProperty('--side-ox', Math.round(b.left + b.width / 2 - p.left) + 'px');
  }
  /* 参与错峰的卡片:分段控件 + 各分组卡(跳过 display:none 的空区块,否则白占 stagger 序号) */
  function cards() {
    const out = [], t = document.getElementById('sideTabs');
    if (t) out.push(t);
    sideEl.querySelectorAll('.sec').forEach(el => {
      if (getComputedStyle(el).display !== 'none') out.push(el);
    });
    return out;
  }

  function open() {
    cancelAll();
    sideEl.classList.add('morphing');      /* 必须先挂:关掉 visibility 的 .26s 延迟 */
    sideEl.classList.remove('leaving', 'collapsed');
    setOrigin(); syncSideBtn();
    if (RM.matches || !sideEl.animate) { sideEl.classList.remove('morphing'); return; }
    anims.push(sideEl.animate([
      { opacity:0, transform:'translateY(14px) scale(.955)' },
      { opacity:1, transform:'translateY(0) scale(1)' },
    ], { duration:DUR_OUT, easing:easeOut(), fill:'both' }));
    cards().forEach((c, i) => anims.push(c.animate(CARD_IN,
      { duration:CARD_DUR, delay:i * CARD_STEP, easing:SMOOTH, fill:'both' })));
    settle();
  }
  /* 关闭 = 打开的时间反向:卡片按倒序错峰退场(最后出现的先消失,方向和模糊与进场互为镜像),
     壳用同一条弹簧曲线收拢回菜单按钮锚点,并延迟到与最后一张卡片同时落定 —— 从哪来回哪去。 */
  function close() {
    cancelAll();

    const shellDelay = Math.max(0, (cs.length - 1) * CARD_STEP + CARD_DUR - DUR_OUT);
    sideEl.classList.add('morphing', 'leaving'); setOrigin(); syncSideBtn();
    cs.forEach((c, i) => anims.push(c.animate(CARD_OUT,
      { duration:CARD_DUR, delay:(cs.length - 1 - i) * CARD_STEP, easing:SMOOTH, fill:'both' })));

      { opacity:0, transform:'translateY(14px) scale(.955)' },
    ], { duration:DUR_OUT, delay:shellDelay, easing:easeOut(), fill:'both' }));

  }

  window.__sideSet = function (wantOpen) {

  const M = curMin(), movers = [];

    if (t.bad || !(t.r & dayBit)) continue;
    const M2 = windowShift(t, M);
    if (M2 < t.w0 || M2 > t.w1) continue;
    const p1c = trainPosition(t, M2);
    if (!p1c) continue;
    checked++;
    const p1 = [p1c[0], p1c[1], p1c[2], p1c[3], p1c[4], p1c[5]]; // 拷贝:_pos 为共享数组
    const p2 = trainPosition(t, M2 + (minutesAhead || 1));

window.__graphQuery = (st) => {

window.__graphWalk = (startNode, lineName, hops) => {
  const walk = [];
  let cur = startNode;
  const seen = new Set([cur]);
  for (let h = 0; h < (hops || 12); h++) {
    const edges = (routeGraph.get(cur) || []).filter(e => !lineName || lineName === '*' || e.line === lineName);
    const fwd = edges.filter(e => !seen.has(e.to));
    if (!fwd.length) { walk.push('DEAD-END'); break; }
    const next = fwd[0];
    walk.push(next.to + ' (' + Math.round(next.km) + 'km)');
    seen.add(next.to);
    cur = next.to;
  }

};
/* 质量探针:抽样可见列车,量化渲染位置到所属轨道折线的偏差(米) */
window.__probe = (lineFilter, limit) => {
  const M = curMin(), out = [];
  const distToPoly = (p, e) => {
    let best = 1e18;
    const co = e.coords;
    for (let i = 1; i < co.length; i++) {
      const ax = co[i-1][0], ay = co[i-1][1], bx = co[i][0], by = co[i][1];
      const dx = bx - ax, dy = by - ay;
      const L2 = dx*dx + dy*dy;
      let tt = L2 ? ((p[0]-ax)*dx + (p[1]-ay)*dy) / L2 : 0;
      tt = Math.max(0, Math.min(1, tt));
      const qx = ax + dx*tt - p[0], qy = ay + dy*tt - p[1];
      const d2 = (qx*Math.cos((ay+by)/2*Math.PI/180)*111.32)**2 + (qy*110.57)**2;
      if (d2 < best) best = d2;
    }
    return Math.sqrt(best) * 1000;
  };
  for (const t of tripList) {
    if (!(t.r & dayBit)) continue;
    const M2 = windowShift(t, M);
    if (M2 < t.w0 || M2 > t.w1) continue;
    if (lineFilter && !t.lines.some(l => l.includes(lineFilter))) continue;
    const p = trainPosition(t, M2);
    if (!p) continue;
    let i = 0;
    while (i < t.N - 2 && M2 > t.arr[i+1]) i++;
    const e = pickSeg(t, t.jasN[i], t.jasN[i + 1], t.stopC[i]);
    out.push({ trip: t.t, line: p[3], devM: e ? Math.round(distToPoly(p, e)) : -1, kmh: Math.round(p[5]), from: t.jas[i], to: t.jas[i + 1], x: p[0], y: p[1] });
    if (out.length >= (limit || 50)) break;
  }
  return out;
};
