<!DOCTYPE html>
<html lang="zh-Hans" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0b0f16">
<title>乗換案内 · Mini JapanRail</title>
<meta name="description" content="全日本铁路换乘案内：班次时刻、换乘次数、列车爱称与目的地、营业里程。纯静态时刻表检索。">
<link rel="icon" href="favicon.png">
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.12.0/dist/maplibre-gl.css" rel="stylesheet" />
<!-- MapLibre 6.x 仅 ESM 构建, 由 initMap() 动态 import(失败不影响检索功能) -->
<style>
/* ══════════════ 液态玻璃 token(与主页 index.html 完全一致) ══════════════ */
:root {
  --bg:#0b0f16; --panel:rgba(18,24,34,.68); --panel2:rgba(30,38,52,.72);
  --line:rgba(255,255,255,.08); --txt:#e8edf4; --dim:#bccbdd; --acc:#2f6de8; --acc-txt:#6da9ff; --acc2:#5fd4f4;
  --shadow:0 2px 10px rgba(0,0,0,.28), 0 8px 32px rgba(0,0,0,.2);
  --r:14px; --r-sm:10px; --r-xs:7px; --r-pill:999px;
  --acc-soft:rgba(79,142,247,.16); --acc-border:rgba(79,142,247,.5);
  /* ── Liquid Glass ── */
  --glass:rgba(255,255,255,.10);
  --glass-2:rgba(255,255,255,.16);
  --glass-edge:rgba(255,255,255,.22);
  --glass-hi:rgba(255,255,255,.34);
  --glass-lo:rgba(0,0,0,.16);
  --glass-sh:0 6px 20px rgba(0,0,0,.30), 0 2px 6px rgba(0,0,0,.22);
  --glass-solid:rgb(25,32,45);
  --glass-panel:linear-gradient(180deg, rgba(255,255,255,.18) 0%, rgba(255,255,255,.05) 34%, rgba(255,255,255,.09) 100%), rgba(255,255,255,.10);
  --glass-panel-blur:blur(26px) saturate(1.9);
  --ease-spring:cubic-bezier(.34,1.45,.44,1);
  --ease-smooth:cubic-bezier(.16,1,.3,1);
  --spring-out:linear(0,.0598,.1976,.3654,.5321,.68,.8007,.8924,.9573,.9996,1.0241,1.0356,1.0384,1.0358,1.0304,1.0239,1.0175,1.0119,1.0074,1.0039,1.0015,.9999,.999,.9986,.9985,.9986,.9989,.9991,.9993,.9996,1);
  --spring-in:linear(0,.0368,.1232,.2323,.3473,.458,.5586,.6466,.7215,.7836,.8341,.8746,.9065,.9313,.9503,.9646,.9753,.9831,.9888,.9929,.9957,.9976,.9989,.9997,1.0002,1.0005,1.0006,1.0006,1.0005,1);
  --morph-out:460ms; --morph-in:340ms;
  /* ── 布局 token ── */
  --sbw:400px;            /* 桌面侧栏宽度 */
  --pad:14px;             /* 外边距 */
  --dock:44px;
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
}
@supports not (transition-timing-function:linear(0,1)) {
  :root { --spring-out:cubic-bezier(.22,1.12,.36,1); --spring-in:cubic-bezier(.32,.94,.44,1); }
}
:root[data-theme="light"] {
  --bg:#dfe4ec; --panel:rgba(255,255,255,.82); --panel2:rgba(245,247,251,.88);
  --line:rgba(15,23,42,.09); --txt:#0f172a; --dim:#414e66; --acc:#1c51d6; --acc-txt:#1c51d6; --acc2:#0891b2;
  --shadow:0 1px 3px rgba(15,23,42,.08), 0 8px 24px rgba(15,23,42,.1);
  --acc-soft:rgba(37,99,235,.1); --acc-border:rgba(37,99,235,.4);
  --glass:rgba(255,255,255,.58); --glass-2:rgba(255,255,255,.76);
  --glass-edge:rgba(255,255,255,.92); --glass-hi:rgba(255,255,255,.95); --glass-lo:rgba(15,23,42,.06);
  --glass-sh:0 6px 18px rgba(15,23,42,.14), 0 2px 5px rgba(15,23,42,.08);
  --glass-solid:rgb(247,249,252);
  --glass-panel:linear-gradient(180deg, rgba(255,255,255,.78) 0%, rgba(255,255,255,.52) 36%, rgba(255,255,255,.66) 100%), rgba(255,255,255,.58);
  --glass-panel-blur:blur(26px) saturate(1.6);
}

* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--txt);
  font-family:-apple-system,"SF Pro SC","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Yu Gothic UI","Noto Sans JP",sans-serif;
  -webkit-tap-highlight-color:transparent; }
/* 全局锁定: body 固定 + 根禁滚动链 → 杜绝 iOS 橡皮筋过滚把整页拖出视口(黑边) */
html { overscroll-behavior:none; }
body { position:fixed; top:0; left:0; overscroll-behavior:none; }
button,input,select { font-family:inherit; }
::-webkit-scrollbar { width:5px; height:5px; }
::-webkit-scrollbar-thumb { background:rgba(120,140,180,.28); border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:rgba(120,140,180,.45); }
::-webkit-scrollbar-track { background:transparent; }
.maplibregl-ctrl-attrib { font-size:10px !important; }
:focus-visible { outline:2px solid var(--acc-border); outline-offset:2px; border-radius:6px; }

#map { position:absolute; inset:0; }

/* ══════════════ 顶部 HUD(移动端居中 / 桌面右上) ══════════════ */
#topHud { position:absolute; top:calc(10px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
  z-index:9; display:flex; align-items:center; gap:8px; pointer-events:none; max-width:calc(100vw - 20px); }
#brand { pointer-events:auto; display:flex; align-items:center; gap:8px; height:var(--dock); padding:0 13px 0 5px;
  cursor:pointer; border-radius:var(--r-pill); color:var(--txt); text-decoration:none;
  background:var(--glass); border:1px solid var(--glass-edge);
  backdrop-filter:blur(14px) saturate(1.4); -webkit-backdrop-filter:blur(14px) saturate(1.4);
  box-shadow:inset 0 1px 0 var(--glass-hi), inset 0 -1px 2px var(--glass-lo), var(--glass-sh);
  transition:background .2s var(--ease-smooth), transform .38s var(--ease-spring); white-space:nowrap; }
@media (hover:hover) { #brand:hover { background:var(--glass-2); transform:translateY(-1px); } }
#brand:active { transform:scale(.95); transition:transform .12s ease-in; }
#brand .lg { width:28px; height:28px; border-radius:50%; background:#fff; display:flex; align-items:center;
  justify-content:center; flex:none; box-shadow:0 2px 8px var(--acc-soft), inset 0 0 0 1px rgba(255,255,255,.35); overflow:hidden; }
#brand .lg img { width:100%; height:100%; object-fit:cover; display:block; }
#brand b { font-size:12px; font-weight:800; letter-spacing:-.2px; }
#brand .sub { font-size:9.5px; color:var(--dim); font-weight:600; }
#hudRight { pointer-events:auto; display:flex; align-items:center; gap:5px; height:var(--dock); padding:0 6px;
  border-radius:var(--r-pill); background:var(--glass); border:1px solid var(--glass-edge);
  backdrop-filter:blur(14px) saturate(1.4); -webkit-backdrop-filter:blur(14px) saturate(1.4);
  box-shadow:inset 0 1px 0 var(--glass-hi), inset 0 -1px 2px var(--glass-lo), var(--glass-sh); }
.chip { min-height:26px; padding:0 9px; border-radius:var(--r-pill); border:1px solid transparent; font-size:10px;
  font-weight:700; cursor:pointer; color:var(--dim); background:transparent; display:flex; align-items:center; gap:3px;
  transition:background .14s var(--ease-smooth), color .14s, transform .3s var(--ease-spring), border-color .14s; }
.chip:hover { color:var(--txt); }
.chip:active { transform:scale(.9); transition:transform .1s ease-in; }
.chip.on { background:var(--acc); border-color:var(--acc); color:#fff; box-shadow:0 2px 8px var(--acc-soft); }

/* ══════════════ 主面板: 移动端底部抽屉(默认) ══════════════ */
/* ══════ 宿主 + 两级抽屉(Apple Maps 式: 主抽屉 → 路线详情抽屉) ══════ */
#panel { position:absolute; inset:0; z-index:10; pointer-events:none; background:none; border:0; box-shadow:none;
  overflow:hidden; overscroll-behavior:none; }
.sheet { position:absolute; left:8px; right:8px; bottom:calc(8px + env(safe-area-inset-bottom));
  z-index:1; display:flex; flex-direction:column; border-radius:26px; overflow:hidden;
  max-height:min(88dvh, 820px); pointer-events:auto;
  background:var(--glass-panel); border:1px solid var(--glass-edge);
  backdrop-filter:var(--glass-panel-blur); -webkit-backdrop-filter:var(--glass-panel-blur);
  box-shadow:inset 0 1px 0 var(--glass-hi), inset 0 -1px 2px var(--glass-lo), 0 12px 40px rgba(0,0,0,.36);
  transition:transform .48s var(--ease-spring), opacity .28s var(--ease-smooth); will-change:transform; }
:root[data-theme="light"] .sheet { box-shadow:inset 0 1px 0 rgba(255,255,255,.85), inset 0 -1px 1px var(--glass-lo), 0 12px 36px rgba(15,23,42,.16); }
.sheet.dragging { transition:none; }
/* 主抽屉: 折叠到「仅搜索卡」的 peek 档; 详情打开时整体收起隐藏 */
#sheetMain.collapsed { transform:translateY(calc(100% - var(--peek, 170px))); }
#sheetMain.stowed { transform:translateY(112%); opacity:0; pointer-events:none; }
/* 路线详情抽屉: hidden → medium(露出地图) → full */
#sheetDetail { z-index:2; max-height:min(66dvh, 660px); transform:translateY(112%); pointer-events:none; }
#sheetDetail.show { transform:translateY(0); pointer-events:auto; }
#sheetDetail.show.medium { transform:translateY(calc(100% - var(--med, 34dvh))); }

/* ───── 抽屉把手 ───── */
#grip, #dgrip { display:flex; align-items:flex-start; justify-content:center; width:100%; height:22px;
  padding:8px 0 0; margin:0; border:0; background:transparent; cursor:pointer; touch-action:none; flex:none;
  -webkit-tap-highlight-color:transparent; user-select:none; }
#grip span, #dgrip span { width:40px; height:4.5px; border-radius:3px; background:var(--dim); opacity:.5;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28); transition:opacity .2s, width .3s var(--ease-spring); }
#grip:active span, #dgrip:active span { opacity:.95; width:48px; }

/* ───── 详情抽屉头部(返回 + 概要标题) ───── */
#detailHead { display:flex; align-items:center; gap:8px; padding:6px 13px 10px; flex:none; border-bottom:1px solid var(--line); }
#backBtn { display:flex; align-items:center; gap:2px; height:30px; padding:0 11px 0 7px; flex:none;
  border:1px solid var(--glass-edge); border-radius:var(--r-pill); background:var(--glass);
  color:var(--acc-txt); font-size:11.5px; font-weight:800; cursor:pointer;
  transition:transform .25s var(--ease-spring), background .2s; }
@media (hover:hover) { #backBtn:hover { background:var(--glass-2); } }
#backBtn:active { transform:scale(.93); }
#dTitle { flex:1; min-width:0; font-size:12px; font-weight:800; color:var(--txt);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums; }

/* ───── 搜索卡 ───── */
#searchCard { padding:12px 13px 12px; flex:none; position:relative; }
.srow { display:flex; align-items:center; gap:8px; }
.sfield { flex:1; min-width:0; position:relative; }
.sfield label { position:absolute; left:11px; top:4px; font-size:8.5px; font-weight:700; letter-spacing:.4px;
  color:var(--dim); pointer-events:none; z-index:1; }
.sfield input { width:100%; height:42px; padding:16px 10px 5px; border:1px solid var(--glass-edge);
  border-radius:var(--r-sm); background:var(--glass); color:var(--txt); font-size:15px; font-weight:700;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); outline:none;
  transition:border-color .15s, background .15s, box-shadow .15s; }
.sfield input:focus { border-color:var(--acc-border); background:var(--glass-2); box-shadow:0 0 0 3px var(--acc-soft); }
.sfield input::placeholder { color:var(--dim); font-weight:500; }
:root[data-theme="light"] .sfield input { background:rgba(255,255,255,.85); }
.gcircle { position:relative; width:36px; height:36px; flex:none; border-radius:50%; padding:0;
  display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--txt);
  background:var(--glass); border:1px solid var(--glass-edge);
  backdrop-filter:blur(14px) saturate(1.4); -webkit-backdrop-filter:blur(14px) saturate(1.4);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5), inset 0 1px 1.5px var(--glass-hi), inset 0 -2px 4px var(--glass-lo), var(--glass-sh);
  transition:transform .38s var(--ease-spring), background .2s var(--ease-smooth); overflow:hidden; }
.gcircle::before { content:''; position:absolute; inset:0; border-radius:50%;
  background:linear-gradient(165deg, rgba(255,255,255,.42) 0%, rgba(255,255,255,.06) 24%, rgba(255,255,255,0) 48%); pointer-events:none; }
@media (hover:hover) { .gcircle:hover { background:var(--glass-2); } }
.gcircle:active { transform:scale(.88) rotate(180deg); transition:transform .18s ease-in; }
#goBtn { height:42px; padding:0 16px; flex:none; border:0; border-radius:var(--r-sm);
  background:var(--acc); color:#fff; font-size:13.5px; font-weight:800; cursor:pointer;
  display:flex; align-items:center; gap:5px; box-shadow:0 2px 10px var(--acc-soft);
  transition:transform .3s var(--ease-spring), filter .15s; }
@media (hover:hover) { #goBtn:hover { filter:brightness(1.1); } }
#goBtn:active { transform:scale(.94); transition:transform .1s ease-in; }

/* ───── 模式分段控件 + 时刻 ───── */
.mrow { display:flex; align-items:center; gap:6px; margin-top:9px; flex-wrap:wrap; }
.mchip { height:30px; padding:0 11px; border:1px solid var(--glass-edge); border-radius:var(--r-pill);
  background:transparent; color:var(--dim); font-size:11.5px; font-weight:700; cursor:pointer;
  display:flex; align-items:center; gap:4px; white-space:nowrap;
  transition:color .15s, background .28s var(--ease-spring), border-color .15s, transform .25s var(--ease-spring); }
.mchip:active { transform:scale(.94); }
@media (hover:hover) { .mchip:hover { color:var(--txt); background:rgba(255,255,255,.08); } }
.mchip.on { color:#fff; background:var(--acc); border-color:var(--acc); box-shadow:0 2px 8px var(--acc-soft); }
.mchip .k { font-size:8.5px; opacity:.78; font-weight:600; display:none; }
.mchip.on .k { display:inline; }
#timeWrap { display:none; align-items:center; gap:5px; height:30px; padding:0 10px; border:1px solid var(--glass-edge);
  border-radius:var(--r-pill); background:var(--glass); }
#timeWrap.show { display:flex; }
#timeWrap input { border:0; background:transparent; color:var(--txt); font-size:12.5px; font-weight:800; outline:none; font-variant-numeric:tabular-nums; }
#timeWrap input::-webkit-calendar-picker-indicator { filter:invert(.6); cursor:pointer; }
:root[data-theme="light"] #timeWrap input::-webkit-calendar-picker-indicator { filter:none; }
.daySel { height:26px; border:1px solid var(--glass-edge); border-radius:var(--r-pill); background:var(--glass);
  color:var(--txt); font-size:11px; font-weight:700; padding:0 7px; outline:none; cursor:pointer; }
.daySel option { background:var(--glass-solid); color:var(--txt); }

/* ───── 层级菜单: 詳細条件(可折叠, 移动端默认收起以释放空间) ───── */
#optSec { margin-top:9px; border-top:1px solid var(--line); padding-top:7px; }
#optToggle { width:100%; display:flex; align-items:center; gap:7px; height:32px; padding:0 2px;
  border:0; background:transparent; color:var(--txt); cursor:pointer; font-size:11.5px; font-weight:800;
  border-radius:var(--r-xs); transition:background .2s var(--ease-smooth); }
@media (hover:hover) { #optToggle:hover { background:rgba(255,255,255,.06); } }
#optToggle:active { transform:scale(.99); }
#optToggle .cv { flex:none; color:var(--dim); transition:transform .34s var(--ease-spring); }
#optToggle[aria-expanded="true"] .cv { transform:rotate(90deg); color:var(--acc-txt); }
#optToggle .sum { margin-left:auto; font-size:10px; color:var(--dim); font-weight:700;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:56%; }
#optCollapse { display:grid; grid-template-rows:0fr; transition:grid-template-rows .38s var(--ease-smooth); }
#optCollapse.open { grid-template-rows:1fr; }
#optCollapse > #optWrap { overflow:hidden; min-height:0; padding:8px 0 2px;
  transition:padding .34s var(--ease-smooth); }
#optCollapse:not(.open) > #optWrap { padding-top:0; padding-bottom:0; }
#optWrap { display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
#optWrap .olb { font-size:9px; font-weight:700; letter-spacing:.5px; color:var(--dim); flex:none; }
#optWrap .osep { width:1px; height:13px; background:var(--line); flex:none; margin:0 4px; }
.ochip { height:28px; padding:0 10px; border:1px solid var(--glass-edge); border-radius:var(--r-pill);
  background:transparent; color:var(--dim); font-size:10.5px; font-weight:700; cursor:pointer;
  display:flex; align-items:center; gap:5px;
  transition:color .15s, background .28s var(--ease-spring), border-color .15s, opacity .15s, transform .2s var(--ease-spring); }
.ochip::before { content:''; width:5px; height:5px; border-radius:50%; flex:none;
  background:var(--dim); opacity:.45; transition:background .2s, opacity .2s; }
.ochip:not(.on) { opacity:.55; }
.ochip:active { transform:scale(.93); }
@media (hover:hover) { .ochip:hover { color:var(--txt); background:rgba(255,255,255,.07); } }
.ochip.on { color:var(--txt); background:var(--acc-soft); border-color:var(--acc-border); }
.ochip.on::before { background:var(--acc); opacity:1; }

/* ───── 联想面板 ───── */
#sug { position:absolute; left:12px; right:12px; top:58px; z-index:20; display:none;
  max-height:min(320px, 44dvh); overflow-y:auto; overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch; border-radius:16px;
  background:var(--glass-solid); border:1px solid var(--glass-edge);
  box-shadow:0 14px 44px rgba(0,0,0,.42), inset 0 1px 0 var(--glass-hi);
  animation:sugIn .22s var(--ease-smooth) both; }
@keyframes sugIn { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:none; } }
:root[data-theme="light"] #sug { background:rgba(255,255,255,.97); box-shadow:0 14px 44px rgba(15,23,42,.18), inset 0 1px 0 #fff; }
.sug-grp { font-size:9px; font-weight:700; letter-spacing:.4px; color:var(--dim); padding:8px 12px 3px; }
.sug-it { display:flex; align-items:center; gap:8px; padding:9px 12px; cursor:pointer; font-size:13.5px; font-weight:600; transition:background .1s; }
.sug-it:hover, .sug-it.hl-it { background:var(--acc-soft); }
.sug-it .k { font-size:10px; color:var(--dim); font-weight:500; }
.sug-it .rt { margin-left:auto; font-size:9.5px; color:var(--dim); font-weight:600; font-variant-numeric:tabular-nums; }
.sug-it .hl { color:var(--acc-txt); font-weight:800; }
.sug-empty { padding:14px 12px; text-align:center; color:var(--dim); font-size:12px; }
.sug-empty .sug-q { color:var(--txt); font-weight:700; }

/* ───── 结果区 ───── */
#result { display:none; flex-direction:column; min-height:0; border-top:1px solid var(--line);
  overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
#result.show { display:flex; animation:resIn .34s var(--ease-smooth) both; }
@keyframes resIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }

/* 概要: 発→着 大时刻 + 三项统计 */
#sumBar { padding:12px 13px 9px; flex:none; }
.sum-head { display:flex; align-items:baseline; gap:9px; }
.sum-t { display:flex; align-items:baseline; gap:3px; }
.sum-t .tm { font-size:27px; font-weight:900; font-variant-numeric:tabular-nums; letter-spacing:-.7px; line-height:1; }
.sum-t .lb { font-size:10px; font-weight:800; color:var(--dim); }
.sum-t .nd { font-size:11px; color:var(--warn); font-weight:800; }
.sum-arw { color:var(--dim); font-weight:700; font-size:15px; padding:0 1px; }
.sum-stats { display:flex; gap:7px; margin-top:10px; }
.stat { flex:1; min-width:0; padding:7px 9px; border-radius:var(--r-xs); background:var(--glass);
  border:1px solid var(--glass-edge); display:flex; flex-direction:column; gap:1px; }
.stat i { font-size:9px; font-style:normal; font-weight:700; color:var(--dim); letter-spacing:.3px; }
.stat b { font-size:13.5px; font-weight:900; font-variant-numeric:tabular-nums; letter-spacing:-.2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sum-note { margin-top:8px; font-size:10px; color:var(--warn); font-weight:700; line-height:1.45; }

/* 方案卡片(横向滚动) */
#routes { display:flex; gap:8px; padding:0 13px 10px; overflow-x:auto; flex:none; scrollbar-width:none;
  overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
#routes::-webkit-scrollbar { height:0; display:none; }
.rcard { flex:none; width:136px; padding:10px 11px; border-radius:var(--r-sm); cursor:pointer;
  border:1px solid var(--glass-edge); background:var(--glass);
  transition:background .15s, transform .3s var(--ease-spring), border-color .15s, box-shadow .2s; }
@media (hover:hover) { .rcard:hover { background:var(--glass-2); transform:translateY(-2px); } }
.rcard:active { transform:scale(.97); }
.rcard.on { border-color:var(--acc); background:var(--acc-soft); box-shadow:0 2px 10px var(--acc-soft); }
.rcard .rt { display:flex; align-items:baseline; gap:4px; font-size:14px; font-weight:900; font-variant-numeric:tabular-nums; letter-spacing:-.3px; }
.rcard .rt .nd { font-size:8.5px; color:var(--warn); font-weight:800; }
.rcard .rd { font-size:10.5px; font-weight:700; color:var(--dim); margin-top:2px; font-variant-numeric:tabular-nums; }
.rcard .rx { display:flex; align-items:center; gap:5px; margin-top:3px; font-size:9.5px; color:var(--dim); font-weight:600; }
.rcard .rtag { display:inline-block; padding:2px 7px; border-radius:var(--r-pill); font-size:8.5px; font-weight:800;
  background:var(--acc); color:#fff; margin-top:6px; }
.rcard .rtag.g { background:rgba(120,140,180,.28); color:var(--txt); }

/* 时间轴 */
#legs { flex:1 1 auto; min-height:0; overflow-y:auto; padding:0 13px 12px; overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch; scrollbar-width:none; }
#legs::-webkit-scrollbar { width:0; display:none; }
.tl { position:relative; }
.tl-node { display:flex; align-items:stretch; gap:10px; position:relative; }
.tl-ic { width:20px; flex:none; display:flex; flex-direction:column; align-items:center; }
.tl-dot { width:11px; height:11px; border-radius:50%; border:2.5px solid var(--acc); background:var(--bg); flex:none; z-index:1; margin-top:4px; }
.tl-dot.end { background:var(--acc); }
.tl-line { width:2.5px; flex:1; background:var(--glass-edge); margin:2px 0; border-radius:2px; min-height:12px; }
.tl-line.xfr { background:repeating-linear-gradient(180deg, var(--dim) 0 3px, transparent 3px 6px); opacity:.5; width:2px; }
.tl-line.walk { background:repeating-linear-gradient(180deg, #7dd3fc 0 4px, transparent 4px 7px); width:2px; }
.tl-body { flex:1; min-width:0; padding-bottom:2px; }
.tl-st { display:flex; align-items:center; gap:7px; padding:2px 0; flex-wrap:wrap; }
.tl-st .nm { font-size:16px; font-weight:800; letter-spacing:-.3px; }
.tl-st .zh { font-size:10.5px; color:var(--dim); font-weight:600; }
.tl-st .t { margin-left:auto; font-size:15px; font-weight:900; font-variant-numeric:tabular-nums; white-space:nowrap; }
.tl-st .t .lb { font-size:9px; font-weight:700; color:var(--dim); margin-right:3px; }
.tl-st .t .nd { font-size:9.5px; color:var(--warn); font-weight:800; }
/* 列车卡 */
.tcard { margin:3px 0 4px; border-radius:var(--r-xs); border:1px solid var(--glass-edge);
  border-left:3px solid var(--lc, #4f8ef7); background:var(--glass);
  box-shadow:0 1px 4px var(--glass-lo); overflow:hidden; }
.tcard .th { display:flex; align-items:center; gap:7px; padding:7px 10px; flex-wrap:wrap; }
.tcard .tn { font-size:12.5px; font-weight:800; color:color-mix(in srgb, var(--lc,#4f8ef7) 62%, var(--txt) 38%); }
.tcard .ty { padding:2px 6px; border-radius:5px; font-size:9.5px; font-weight:800;
  background:color-mix(in srgb, var(--lc,#4f8ef7) 24%, transparent); color:color-mix(in srgb, var(--lc,#4f8ef7) 70%, var(--txt) 30%); }
.tcard .tnm { font-size:11.5px; font-weight:800; color:var(--txt); }
.tcard .dst { margin-left:auto; font-size:10.5px; font-weight:700; color:var(--dim); white-space:nowrap; }
.tcard .tf { padding:0 10px 7px; font-size:10px; color:var(--dim); font-weight:600; font-variant-numeric:tabular-nums; }
.tcard .nxt { display:flex; align-items:center; gap:5px; width:100%; padding:6px 10px; border:0; border-top:1px solid var(--line);
  background:transparent; color:var(--acc-txt); font-size:10.5px; font-weight:800; cursor:pointer; transition:background .15s; }
@media (hover:hover) { .tcard .nxt:hover { background:var(--acc-soft); } }
.tcard .nxt .cv { margin-left:auto; color:var(--dim); font-weight:600; font-size:9px; }
.tcard .nxt.open .cv { color:var(--acc-txt); }
/* 后续班次列表 */
.nlist { border-top:1px solid var(--line); background:var(--glass-lo); animation:nlistIn .26s var(--ease-smooth) both; }
@keyframes nlistIn { from { opacity:0; } to { opacity:1; } }
.nitem { display:flex; align-items:center; gap:8px; padding:8px 10px; cursor:pointer; font-size:11.5px; font-weight:700;
  transition:background .1s; border-top:1px solid var(--line); }
.nitem:first-child { border-top:0; }
.nitem:hover { background:var(--acc-soft); }
.nitem .nt { font-variant-numeric:tabular-nums; font-size:12.5px; font-weight:900; }
.nitem .nty { font-size:9.5px; font-weight:700; color:var(--dim); }
.nitem .nr { margin-left:auto; font-size:9.5px; color:var(--dim); font-weight:700; font-variant-numeric:tabular-nums; }
.nitem .nr.ok { color:var(--ok); }
.nitem .nr.bad { color:var(--bad); }
.tl-xfr { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--dim); font-weight:700; padding:2px 0 4px 30px; }
.tl-xfr .xm { color:var(--warn); font-weight:800; }
.tl-walk { display:flex; align-items:center; gap:5px; font-size:11px; color:#7dd3fc; font-weight:700; padding:2px 0 4px 30px; }
.tl-note { font-size:9.5px; color:var(--dim); padding:8px 0 2px 30px; font-weight:600; line-height:1.55; }
.tl-empty { padding:22px 4px; text-align:center; font-size:12.5px; color:var(--dim); font-weight:600; }

/* ───── 加载遮罩 ───── */
#loader { position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:14px; background:var(--bg); transition:opacity .45s var(--ease-smooth); }
#loader.done { opacity:0; pointer-events:none; }
#loader .lt { font-size:13px; font-weight:700; color:var(--dim); letter-spacing:.3px; }
#loader .lb2 { width:min(280px, 70vw); height:4px; border-radius:2px; background:var(--glass-2); overflow:hidden; }
#loader .lb2 i { display:block; height:100%; width:0%; border-radius:2px;
  background:linear-gradient(90deg, var(--acc), var(--acc2)); transition:width .3s var(--ease-smooth); }
#loader .lp { font-size:11px; font-weight:800; color:var(--acc-txt); font-variant-numeric:tabular-nums; }
#loader .brand2 { display:flex; align-items:center; gap:9px; animation:brPulse 2.4s var(--ease-smooth) infinite; }
@keyframes brPulse { 0%,100% { opacity:.92; } 50% { opacity:1; } }
#loader .brand2 .lg { width:40px; height:40px; border-radius:50%; background:#fff; display:flex; align-items:center;
  justify-content:center; box-shadow:0 4px 16px var(--acc-soft); overflow:hidden; }
#loader .brand2 .lg img { width:100%; height:100%; object-fit:cover; }
#loader .brand2 b { font-size:15px; font-weight:900; }

/* ───── toast ───── */
#toast { position:fixed; left:50%; top:calc(62px + env(safe-area-inset-top)); transform:translateX(-50%) translateY(-8px); z-index:60;
  padding:9px 16px; border-radius:var(--r-pill); background:var(--glass-solid); color:var(--txt);
  border:1px solid var(--glass-edge); box-shadow:0 8px 28px rgba(0,0,0,.4); font-size:12.5px; font-weight:700;
  opacity:0; pointer-events:none; transition:opacity .25s var(--ease-smooth), transform .25s var(--ease-spring); max-width:calc(100vw - 32px); }
#toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
:root[data-theme="light"] #toast { background:rgba(255,255,255,.97); box-shadow:0 8px 28px rgba(15,23,42,.2); }

/* ───── 可访问性 / 性能回退 ───── */
@media (prefers-reduced-transparency: reduce) {
  #brand, #hudRight, .gcircle, #panel, .rcard, .tcard, #toast, #sug, .stat {
    background:var(--glass-solid) !important; backdrop-filter:none !important; -webkit-backdrop-filter:none !important; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration:.001ms !important; transition-duration:.001ms !important; }
}
html.perf-low #brand, html.perf-low #hudRight, html.perf-low .gcircle, html.perf-low #panel,
html.perf-low .rcard, html.perf-low .tcard, html.perf-low .stat { backdrop-filter:none !important; -webkit-backdrop-filter:none !important; box-shadow:0 1px 4px rgba(0,0,0,.3) !important; }

/* ══════════════ 窄屏(<700px): 起终点上下排布, 释放横向空间 ══════════════ */
@media (max-width:700px) {
  .srow { display:grid; grid-template-columns:1fr 38px; gap:8px; align-items:center; }
  .sfield:nth-child(1) { grid-area:1 / 1 / 2 / 2; }
  #swapBtn { grid-area:1 / 2 / 3 / 3; align-self:center; justify-self:center; }
  .sfield:nth-child(3) { grid-area:2 / 1 / 3 / 2; }
  #goBtn { grid-area:3 / 1 / 4 / 3; justify-content:center; height:44px; }
  .sum-t .tm { font-size:24px; }
  .stat { min-width:0; padding:6px 8px; }
  .stat b { font-size:12.5px; }
  #brand .sub { display:none; }
  #brand b { font-size:11.5px; }
}

/* ══════════════ 桌面(≥900px): 面板改为左侧栏, 地图完整可见 ══════════════ */
@media (min-width:900px) {
  #topHud { left:auto; right:var(--pad); transform:none; top:var(--pad); }
  #panel { left:var(--pad); right:auto; top:var(--pad); bottom:var(--pad); width:var(--sbw);
    display:flex; flex-direction:column; border-radius:22px; overflow:hidden; pointer-events:auto;
    background:var(--glass-panel); border:1px solid var(--glass-edge);
    backdrop-filter:var(--glass-panel-blur); -webkit-backdrop-filter:var(--glass-panel-blur);
    box-shadow:inset 0 1px 0 var(--glass-hi), inset 0 -1px 2px var(--glass-lo), 0 12px 40px rgba(0,0,0,.36);
    animation:sbIn .55s var(--ease-smooth) both; }
  /* 桌面不做抽屉: 两层内容上下堆叠, 全部可见 */
  .sheet { position:static; max-height:none; border-radius:0; border:0; background:none;
    backdrop-filter:none; -webkit-backdrop-filter:none; box-shadow:none; overflow:visible;
    transform:none !important; opacity:1 !important; transition:none; will-change:auto; }
  #sheetMain { flex:none; }
  #sheetDetail { flex:1 1 auto; min-height:0; display:flex; flex-direction:column; z-index:1; }
  #grip, #dgrip { display:none; }
  #detailHead { display:none; }
  #searchCard { padding:14px 14px 12px; }
  #result { flex:none; }
  #legs { flex:1 1 auto; min-height:0; }
  #sug { top:62px; }
  @keyframes sbIn { from { opacity:0; transform:translateX(-18px); } to { opacity:1; transform:none; } }
  /* 结果卡错落入场 */
  .rcard { animation:rise .42s var(--ease-smooth) both; }
  .rcard:nth-child(1) { animation-delay:.02s; }
  .rcard:nth-child(2) { animation-delay:.07s; }
  .rcard:nth-child(3) { animation-delay:.12s; }
  .rcard:nth-child(4) { animation-delay:.17s; }
  .rcard:nth-child(5) { animation-delay:.22s; }
  .rcard:nth-child(n+6) { animation-delay:.26s; }
}
@keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }

@media (max-width:520px) {
  .mchip { padding:0 9px; font-size:11px; }
  .ochip { padding:0 8px; font-size:10px; }
  #brand b { font-size:11px; }
  .chip { padding:0 7px; }
}

@media (max-width:899px) {
  /* 移动端: 结果卡片同样错落入场 */
  .rcard { animation:rise .4s var(--ease-smooth) both; }
  .rcard:nth-child(1) { animation-delay:.02s; }
  .rcard:nth-child(2) { animation-delay:.07s; }
  .rcard:nth-child(3) { animation-delay:.12s; }
  .rcard:nth-child(n+4) { animation-delay:.16s; }
}

/* ══════ 方案卡线路色条 / 中间站展开(层级) / 输入框清除 ══════ */
.rbar { display:flex; gap:1.5px; height:4px; border-radius:2px; overflow:hidden; margin-bottom:7px; }
.rbar i { display:block; height:100%; border-radius:2px; min-width:3px; }
.stops-btn { display:flex; align-items:center; gap:5px; width:100%; padding:6px 10px; border:0;
  border-top:1px solid var(--line); background:transparent; color:var(--dim); font-size:10.5px;
  font-weight:800; cursor:pointer; transition:background .15s, color .15s; }
@media (hover:hover) { .stops-btn:hover { background:var(--acc-soft); color:var(--acc-txt); } }
.stops-btn .cv { flex:none; transition:transform .3s var(--ease-spring); }
.stops-btn.open { color:var(--acc-txt); background:var(--acc-soft); }
.stops-btn.open .cv { transform:rotate(90deg); }
.stops-list { display:grid; grid-template-rows:0fr; transition:grid-template-rows .32s var(--ease-smooth); }
.stops-list.open { grid-template-rows:1fr; }
.stops-list > div { overflow:hidden; min-height:0; }
.sitem { display:flex; align-items:center; gap:8px; padding:6px 10px 6px 18px; border-top:1px solid var(--line); font-size:11px; }
.sitem .sn { font-weight:700; color:var(--txt); }
.sitem .st2 { margin-left:auto; font-variant-numeric:tabular-nums; font-weight:800; color:var(--dim); white-space:nowrap; }
.sitem .dw { color:var(--dim); opacity:.6; font-weight:600; }
.sfield input { padding-right:34px; }
.clr { position:absolute; right:5px; top:50%; transform:translateY(-50%); width:24px; height:24px;
  border:0; border-radius:50%; background:var(--glass-2); color:var(--dim); display:none;
  align-items:center; justify-content:center; cursor:pointer; z-index:2;
  transition:background .15s, color .15s, transform .2s var(--ease-spring); }
.sfield.has-v .clr { display:flex; }
@media (hover:hover) { .clr:hover { background:var(--acc-soft); color:var(--txt); } }
.clr:active { transform:translateY(-50%) scale(.85); }

</style>
</head>
<body>
<div id="map"></div>

<header id="topHud">
  <a id="brand" href="./index.html" title="Mini JapanRail">
    <span class="lg"><img src="logo.png" alt=""></span>

      </div>

        <svg class="cv" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>

      </div>

<script>
'use strict';
/* ══════════════════ 工具 ══════════════════ */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function debounce(fn, ms) { let t; return function (...a) { clearTimeout(t); t = setTimeout(() => fn.apply(this, a), ms); }; }
const toastEl = $('toast');
let toastT = 0;
function toast(s, ms = 2600) { toastEl.textContent = s; toastEl.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), ms); }
/* 绝对分钟(可跨日) → HH:MM */
function fmtMin(m) {
  const d = Math.floor(m / 1440), mm = m % 1440;
  return pad(Math.floor(mm / 60)) + ':' + pad(mm % 60) + (d > 0 ? '<span class="nd">+' + d + 'd</span>' : '');
}
function fmtMinRaw(m) { const d = Math.floor(m / 1440), mm = m % 1440; return pad(Math.floor(mm / 60)) + ':' + pad(mm % 60) + (d > 0 ? '+' + d + 'd' : ''); }
function fmtDur(m) { const h = Math.floor(m / 60), mm = m % 60; return h > 0 ? h + 'h' + pad(mm) + 'm' : mm + 'm'; }
function minToTime(m) { const mm = ((m % 1440) + 1440) % 1440; return pad(Math.floor(mm / 60)) + ':' + pad(mm % 60); }
function timeToMin(v) { const p = (v || '0:0').split(':'); return (+p[0] || 0) * 60 + (+p[1] || 0); }

/* ══════════════════ i18n ══════════════════ */
const I18N = {

/* ══════════════════ 移动端抽屉: 折叠/展开(把手可点可拖) ══════════════════ */
const isMobileView = () => window.matchMedia('(max-width:899px)').matches;
function peekHeight() {
  const g = $('grip'), sc = $('searchCard');
  return (g && sc && sc.offsetHeight) ? g.offsetHeight + sc.offsetHeight + 14 : 162;
}
function setCollapsed(v) {
  const pn = $('sheetMain');
  if (!isMobileView()) { pn.classList.remove('collapsed'); pn.style.removeProperty('--peek'); return; }
  pn.style.setProperty('--peek', peekHeight() + 'px');
  pn.classList.toggle('collapsed', !!v);
  /* 折叠态变化后, 把已选径路重新聚焦到可见地图区域 */
  if (curResult) setTimeout(() => highlightOnMap(curResult.cands[curResult.idx].r), 80);
}
(function () {
  const g = $('grip'), pn = $('sheetMain');
  let y0 = 0, base = 0, dragging = false, moved = false;
  const maxOff = () => Math.max(120, pn.offsetHeight - peekHeight());
  g.addEventListener('pointerdown', e => {
    if (!isMobileView()) return;
    dragging = true; moved = false; y0 = e.clientY;
    base = pn.classList.contains('collapsed') ? maxOff() : 0;
    try { g.setPointerCapture(e.pointerId); } catch (err) { }
  });
  g.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dy = e.clientY - y0;
    if (!moved && Math.abs(dy) > 7) { moved = true; pn.classList.add('dragging'); }
    if (!moved) return;
    pn.style.transform = 'translateY(' + Math.min(maxOff(), Math.max(0, base + dy)) + 'px)';
  });
  const end = e => {
    if (!dragging) return; dragging = false;
    pn.classList.remove('dragging'); pn.style.removeProperty('transform');
    if (!moved) { setCollapsed(!pn.classList.contains('collapsed')); return; }
    const off = Math.min(maxOff(), Math.max(0, base + (e.clientY - y0)));
    setCollapsed(off > maxOff() * 0.35);
  };
  g.addEventListener('pointerup', end);
  g.addEventListener('pointercancel', end);
  /* 折叠时点输入框 → 展开(否则联想列表被抽屉裁掉) */
  $('rFrom').addEventListener('focus', () => { if (pn.classList.contains('collapsed')) setCollapsed(false); });
  $('rTo').addEventListener('focus', () => { if (pn.classList.contains('collapsed')) setCollapsed(false); });
  /* 视口变化: 重算折叠留白 / 退出移动端时复位 */
  window.addEventListener('resize', () => {
    if (!isMobileView()) setCollapsed(false);
    else if (pn.classList.contains('collapsed')) setCollapsed(true);
  });
})();

/* ══════════════════ IndexedDB 缓存(与主页同款) ══════════════════ */
const DATA_VERSION = 'mjrj2';
let idb = null;
function openIDB() {
  return new Promise((res, rej) => {
    try {
      const r = indexedDB.open('mjrj-cache', 1);
      r.onupgradeneeded = () => { try { r.result.createObjectStore('files'); } catch (e) { } };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  });
}
function idbGet(key) {
  return new Promise(res => {
    if (!idb) return res(null);
    try {
      const tx = idb.transaction('files', 'readonly');
      const req = tx.objectStore('files').get(key);
      req.onsuccess = () => res(req.result || null);
      req.onerror = () => res(null);
    } catch (e) { res(null); }
  });
}
function idbPut(key, val) {
  return new Promise(res => {
    if (!idb) return res();
    try {
      const tx = idb.transaction('files', 'readwrite');
      tx.objectStore('files').put(val, key);
      tx.oncomplete = () => res();
      tx.onerror = () => res();
    } catch (e) { res(); }
  });
}
async function fetchJSONWithCache(url, onProg) {
  const key = DATA_VERSION + '|' + url;
  try {
    if (!idb) idb = await openIDB();
    const cached = await idbGet(key);
    if (cached && cached.v === DATA_VERSION && cached.j != null) {
      if (cached.lm) {
        try {
          const res = await fetch(url, { headers: { 'If-Modified-Since': cached.lm } });
          if (res.status === 304) { if (onProg) onProg(1, 1); return cached.j; }
          if (res.ok) {
            const j = await res.json();
            if (onProg) onProg(1, 1);
            await idbPut(key, { v: DATA_VERSION, j, lm: res.headers.get('Last-Modified') || cached.lm });
            return j;
          }
        } catch (e) { /* 走缓存 */ }
      }
      if (onProg) onProg(1, 1);
      return cached.j;
    }
  } catch (e) { console.warn('[cache]', e); }
  const res = await fetch(url);
  if (!res.ok) throw new Error(url + ' HTTP ' + res.status);
  let j;
  if (res.body && res.headers.get('content-length')) {
    const reader = res.body.getReader(), chunks = [];
    let got = 0;
    const total = +res.headers.get('content-length') || 0;
    for (; ;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value); got += value.length;
      if (onProg) onProg(got, total);
    }
    j = JSON.parse(new TextDecoder().decode(await new Blob(chunks).arrayBuffer()));
  } else j = await res.json();
  if (onProg) onProg(1, 1);
  try { if (idb) await idbPut(key, { v: DATA_VERSION, j, lm: res.headers.get('Last-Modified') || '' }); } catch (e) { }
  return j;
}

/* ══════════════════ 数据加载 ══════════════════ */
const FILES = [
  ['stations.json', 'stations'], ['lines.json', 'lines'], ['types.json', 'types'],
  ['tmaps.json', 'tmaps'], ['transfers.json', 'transfers'],
  ['trips_wd.json', 'tripsWd'], ['trips_sa.json', 'tripsSa'], ['trips_su.json', 'tripsSu'],
];
function setLoad(p, msg) {
  p = Math.max(0, Math.min(1, p));
  $('lbar').style.width = Math.round(p * 100) + '%';
  $('lpct').textContent = Math.round(p * 100) + '%';
  if (msg) $('lmsg').textContent = msg;
}
async function loadData() {
  const n = FILES.length + 1;
  let done = 0;
  const bump = () => setLoad(++done / n, T().loading + ' ' + Math.round(done / n * 100) + '%');
  const tasks = FILES.map(async ([f, key]) => {
    const j = await fetchJSONWithCache('data/journey/' + f, (g, t) => setLoad((done + Math.min(1, t ? g / t : 0)) / n));
    assignData(key, j); bump();
  });
  tasks.push(fetchJSONWithCache('data/segments3d.geojson', (g, t) => setLoad((done + Math.min(1, t ? g / t : 0)) / n))
    .then(j => { SEG = j; }).catch(e => console.warn('[segments3d]', e)));
  await Promise.all(tasks);
  bump();
}
function assignData(key, j) {
  if (key === 'stations') ST = j;
  else if (key === 'lines') LINES = j.L;
  else if (key === 'types') TYPES = j.T;
  else if (key === 'tmaps') TM = j;
  else if (key === 'transfers') TRF = j;
  else if (key === 'tripsWd') (TRIPS = TRIPS || {}).wd = j.T;
  else if (key === 'tripsSa') (TRIPS = TRIPS || {}).sa = j.T;

    const cand = out.slice().sort((a, b) => a.arr - b.arr || a.xfr - b.xfr)[0];
    if (!cand) break;
    let added = false;
    for (const lg of cand.legs) if (!banned.has(lg.tmap)) { banned.add(lg.tmap); added = true; }
    if (!added) break;
  }
  out.sort((a, b) => a.arr - b.arr || a.xfr - b.xfr);
  return out;
}
/* 挑选展示方案: 最快 / 乗換少 / 备选。严格过滤荒谬慢方案。 */
function pickRoutes(cands, maxShow) {
  if (!cands.length) return [];
  const fastest = cands.reduce((a, b) => (b.arr < a.arr || (b.arr === a.arr && b.xfr < a.xfr)) ? b : a);
  const dur = fastest.arr - fastest.dep;
  const lim = fastest.arr + Math.max(25, dur * 0.5);
  const ok = cands.filter(r => r.arr <= lim);
  const res = [{ tag: 'fast', r: fastest }];
  let easy = null;
  const byX = ok.slice().sort((a, b) => a.xfr - b.xfr || b.dep - a.dep || a.arr - b.arr);
  for (const r of byX) if (sig(r) !== sig(fastest)) { easy = r; break; }
  if (easy) res.push({ tag: 'easy', r: easy });
  for (const r of ok) {
    if (res.length >= (maxShow || 4)) break;
    if (res.some(x => sig(x.r) === sig(r))) continue;
    res.push({ tag: 'alt', r });
  }
  return res;
}
/* 起点当日最早出发 */
function firstDeparture(orig, day) {
  const list = node2tmaps[orig];
  if (!list) return null;
  let best = null;
  for (const ti of list) {
    const S = TM.T[ti][0];
    const si = S.indexOf(orig);
    if (si < 0) continue;
    const gs = groupsByDay[day].get(ti);
    if (!gs) continue;
    for (const g of gs) {
      if (g.length > 3) { const d = g[3] + patOffsets(ti, g[1])[1][si]; if (best === null || d < best) best = d; }
    }
  }
  return best;
}
/* 无路径兜底(now/dep 模式): ①放宽乗換上限 ②退回当日首班起检索。
   跨日/隔夜等待已由 raptorFwd 的 earliestTrip 处理, 此处不再做整条方案的时间平移。 */
function noRouteFallback(f, t, tStart, day, opt) {
  if ((opt.maxK || 5) < 9) {
    const c = searchRoutes(f, t, tStart, day, { ...opt, maxK: 9 });
    if (c.length) return { cands: c, note: '' };
  }
  const fd = firstDeparture(f, day);
  if (fd != null && fd < tStart) {
    const c = searchRoutes(f, t, fd, day, { ...opt, maxK: 9 });
    if (c.length) return { cands: c, note: T().autoFirst };
  }
  return { cands: [], note: '' };
}
/* 終電: 反向搜索起点最晚可出发时刻(当日 24:00 + 4h 的运行窗口内) */
function lastDeparture(orig, dest, day, opt) {
  for (let limit = 1440 + 300; limit >= 1440 - 120; limit -= 30) {
    const res = raptorRev(orig, dest, limit, day, opt || {});
    if (res.rev[orig] > -INF) {
      const legs = finishRev(res, orig, dest);
      if (legs.length) return { dep: res.rev[orig], limit, cands: legs };
    }
  }
  return null;
}
/* 某 tmap 在 si 站、after 之后的后续 n 班 */
function nextTrips(ti, si, after, day, n) {
  const gs = groupsByDay[day].get(ti);
  if (!gs) return [];
  const all = [];
  for (const g of gs) {
    const dep = patOffsets(ti, g[1])[1][si];
    for (let k = 3; k < g.length; k++) {
      const da = g[k] + dep;
      if (da > after) all.push({ dep: da, pi: g[1], ty: g[2], d0: g[k] });
    }
  }
  all.sort((a, b) => a.dep - b.dep);
  return all.slice(0, n);
}
/* 后续班次 = 同一「乘→下车」区间上、同一主导线路的后续列车。
   只在原 tmap 内找是不够的: 单个 tmap 往往一天只有几班(如新宿→大船的直通 tmap 仅 4 班),
   而同一区间实际上十几分钟就有一班, 分布在不同的 tmap 上。 */
function nextLegTrips(lg, day, n, catOff) {
  const ti = lg.tmap, S = TM.T[ti][0];
  const bNode = S[lg.board], aNode = S[lg.alight];
  const after = lg.dep;
  const mainLine = legLine(ti, lg.board, lg.alight);
  const out = [];
  const seen = new Set();
  const list = node2tmaps[bNode] || [];
  for (const tj of list) {
    const T2 = TM.T[tj], S2 = T2[0];
    const bi = S2.indexOf(bNode); if (bi < 0) continue;
    const ai = S2.indexOf(aNode); if (ai <= bi) continue;
    if (legLine(tj, bi, ai) !== mainLine) continue;   /* 只保留同一条线路 */
    const gs = groupsByDay[day].get(tj);
    if (!gs) continue;
    for (const g of gs) {
      if (catOff && catOff[TYPE_CAT[g[2]]]) continue;
      const off = patOffsets(tj, g[1])[1][bi];
      for (let k = 3; k < g.length; k++) {
        const da = g[k] + off;
        if (da <= after) continue;
        const key = tj + '|' + g[k];
        if (seen.has(key)) continue;
        seen.add(key);
        out.push({ tmap: tj, board: bi, alight: ai, dep: da, pi: g[1], ty: g[2], d0: g[k] });
      }
    }
  }
  out.sort((a, b) => a.dep - b.dep);
  return out.slice(0, n || 6);
}

/* ══════════════════ 检索执行 ══════════════════ */
function doSearch() {
  hideSug();
  /* 优先用点击建议列表时记录的节点: 输入框里是显示名 D, 重名站(带括号)必须靠它精确定位,
     否则 大宮(京都府) 会被 nodeIdx 解析成另一个 大宮。文本没变才复用, 改过就重新解析。 */
  const fv = normName($('rFrom').value), tv = normName($('rTo').value);
  let f = state.from != null && ST.D[state.from] === fv ? state.from : nodeIdx(fv);
  let t = state.to != null && ST.D[state.to] === tv ? state.to : nodeIdx(tv);
  if (f < 0 || t < 0) { toast(T().badSta); return; }
  if (f === t) { toast(T().sameSta); return; }
  state.from = f; state.to = t;
  $('rFrom').value = ST.D[f]; $('rTo').value = ST.D[t];
  const day = state.day, mode = state.mode;
  let cands = [], note = '';
  const opt = { catOff: catOffArr(), maxK: state.maxXfr || 5, want: 8 };
  if (mode === 'first') {
    const fd = firstDeparture(f, day);
    if (fd == null) { toast(T().noRoute); return; }
    cands = searchRoutes(f, t, fd, day, opt);
  } else if (mode === 'last') {
    const lr = lastDeparture(f, t, day, opt);
    if (!lr) { toast(T().noRoute); return; }
    cands = searchRoutes(f, t, lr.dep, day, opt);
    if (!cands.length) cands = lr.cands;
    note = T().lastNote;
  } else if (mode === 'arr') {
    const tArr = timeToMin($('depTime').value);
    const res = raptorRev(f, t, tArr, day, opt);
    cands = finishRev(res, f, t);
    note = tf(T().arrNote, fmtMinRaw(tArr));
    /* 指定时刻前无法到达 → 退回「最早到达」方案, 避免直接显示「未找到连通路径」 */
    if (!cands.length) {
      const fd = firstDeparture(f, day);
      if (fd != null) {
        cands = searchRoutes(f, t, fd, day, opt);
        if (!cands.length && (opt.maxK || 5) < 9) cands = searchRoutes(f, t, fd, day, { ...opt, maxK: 9 });
        if (cands.length) note = T().arrEarliest;
      }
    }
  } else {
    let tStart = mode === 'now' ? Math.floor(nowMin()) : Math.floor(timeToMin($('depTime').value));
    cands = searchRoutes(f, t, tStart, day, opt);
    /* 该时刻起已无衔接班次 → 次日检索(跨日, +1 天) + 放宽乗換上限, 最后退回当日首班。
       偏远小站/长途(喜多灘→秋田/大阪等)晚间出发时不再直接显示「未找到连通路径」。 */
    if (!cands.length) { const fb = noRouteFallback(f, t, tStart, day, opt); cands = fb.cands; note = fb.note; }
  }
  if (!cands.length) { toast(T().noRoute); $('result').classList.remove('show'); return; }
  const picked = pickRoutes(cands, 4);
  curResult = { cands: picked, all: cands, idx: 0, note, from: f, to: t, day, mode };
  openNext = -1;
  renderResult(curResult);
  highlightOnMap(picked[0].r);
  stateHash();
  $('result').classList.add('show');
  /* 移动端: 新结果出来时展开抽屉 */
  closeDetail();
  if (isMobileView() && $('sheetMain').classList.contains('collapsed')) setCollapsed(false);
}
/* 改乘后续班次: 前 i 段固定, 第 i 段换成新班次, 后续重算。
   新班次可能属于另一个 tmap(同区间不同停站), 所以按「乘/下车站节点」在新 tmap 重新定位。 */
function reRouteWith(legIdx, newTrip, alightNode) {
  const cur = curResult.cands[curResult.idx].r;
  const prefix = cur.legs.slice(0, legIdx);
  const lg = cur.legs[legIdx];
  const oldS = TM.T[lg.tmap][0];
  const bNode = oldS[lg.board];
  const ti = (newTrip && newTrip.tmap != null) ? newTrip.tmap : lg.tmap;
  const S = TM.T[ti][0];
  const board = (newTrip && newTrip.board != null) ? newTrip.board : S.indexOf(bNode);
  if (board < 0) return null;
  let alight = -1;
  if (newTrip && newTrip.alight != null) alight = newTrip.alight;
  else {
    const aNode = alightNode != null ? alightNode : oldS[lg.alight];
    const ai = S.indexOf(aNode);
    alight = ai > board ? ai : -1;
  }
  if (alight < 0 || alight <= board) return null;
  const nl = {
    tmap: ti, pi: newTrip.pi, ty: newTrip.ty, d0: newTrip.d0,
    board, walkFrom: lg.walkFrom, alight,
  };
  const off = patOffsets(ti, nl.pi);
  nl.dep = nl.d0 + off[1][nl.board];
  nl.arr = nl.d0 + off[0][nl.alight];
  nl.fromNode = nl.walkFrom >= 0 ? nl.walkFrom : S[nl.board];
  nl.toNode = S[nl.alight];
  nl.walkMin = nl.walkFrom >= 0 ? (walkMin.get(nl.walkFrom + ',' + S[nl.board]) || 0) : 0;
  const prevEnd = prefix.length ? prefix[prefix.length - 1].arr : -1;
  if (prevEnd >= 0 && nl.dep < prevEnd) return null;
  const legs = prefix.concat([nl]);
  /* 从下车站重跑后续 */
  if (nl.toNode !== cur.to) {
    const tStart = nl.arr + transferMin(nl.toNode);
    const rounds = raptorFwd(nl.toNode, cur.to, tStart, curResult.day, { maxK: state.maxXfr || 5, catOff: catOffArr() });
    if (rounds && rounds.length) {
      const rest = finishFwd(rounds, nl.toNode, cur.to).sort((a, b) => a.arr - b.arr || a.xfr - b.xfr)[0];
      if (rest) {
        for (const rl of rest.legs) legs.push(rl);
        const r = finalizeLegs(legs, cur.from, cur.to, rest.finalWalk);
        if (r) return r;
      }
    }
    return null;
  }
  const r = finalizeLegs(legs, cur.from, cur.to, null);
  return r;
}

/* ══════════════════ 站名解析与联想 ══════════════════ */
/* 输入归一化: 全角括号 → 半角。数据里 858 个重名站的消歧后缀统一用半角 ()。 */
function normName(s) {
  return String(s || '').trim().replace(/（/g, '(').replace(/）/g, ')');
}
/* 名字 → 节点。精确匹配优先, 且必须覆盖显示名 d(带括号后缀)。
   否则「大宮(京都府)」这类站搜得到却解析不了。 */
function nodeIdx(nm) {
  nm = normName(nm);
  if (!nm) return -1;
  let best = -1, bestSc = 99;
  for (const e of nameIndex) {
    let sc = -1;
    if (nm === e.d || nm === e.n || nm === e.z) sc = 0;
    else if (e.d.startsWith(nm) || e.n.startsWith(nm) || (e.z && e.z.startsWith(nm))) sc = 1;
    else if (e.d.indexOf(nm) >= 0 || e.n.indexOf(nm) >= 0 || (e.z && e.z.indexOf(nm) >= 0)) sc = 2;
    if (sc >= 0 && sc < bestSc) { bestSc = sc; best = e.i; if (sc === 0) break; }
  }
  return best;
}
let sugWhich = null, sugItems = [];
function hlText(text, q) {
  if (!q) return esc(text);
  const i = text.indexOf(q);
  if (i < 0) return esc(text);
  return esc(text.slice(0, i)) + '<span class="hl">' + esc(text.slice(i, i + q.length)) + '</span>' + esc(text.slice(i + q.length));
}
function doSuggest(which) {
  const input = which === 'from' ? $('rFrom') : $('rTo');
  const q = normName(input.value);
  const box = $('sug');
  if (!q) { box.style.display = 'none'; sugItems = []; sugWhich = null; return; }
  const items = [];
  for (const e of nameIndex) {
    let sc = -1;
    if (q === e.d || q === e.n || q === e.z) sc = 0;
    else if (e.d.startsWith(q) || e.n.startsWith(q) || (e.z && e.z.startsWith(q))) sc = 1;
    else if (e.d.indexOf(q) >= 0 || e.n.indexOf(q) >= 0 || (e.z && e.z.indexOf(q) >= 0)) sc = 2;
    if (sc >= 0) items.push([sc, e.n.length, -ST.R[e.i], e]);
  }
  items.sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2]);
  sugItems = items.slice(0, 12).map(x => x[3]);
  sugWhich = which;
  if (!sugItems.length) {
    box.innerHTML = '<div class="sug-empty"><span class="sug-q">' + esc(q) + '</span> — ' + esc(T().noMatch) + '</div>';
    box.style.display = 'block'; return;
  }
  box.innerHTML = '<div class="sug-grp">' + esc(T().from === undefined ? '' : (lang === 'zh' ? '车站' : lang === 'ja' ? '駅' : 'Stations')) + '</div>' +
    sugItems.map((e, i) =>
      '<div class="sug-it' + (i === 0 ? ' hl-it' : '') + '" data-i="' + e.i + '">' +
      '<span>' + hlText(ST.D[e.i], q) + (ST.Z[e.i] && ST.Z[e.i] !== ST.D[e.i] ? ' <span class="k">' + hlText(ST.Z[e.i], q) + '</span>' : '') + '</span>' +
      '<span class="rt">' + ST.R[e.i] + '</span>' +
      '</div>').join('');
  box.style.display = 'block';
}
function hideSug() { $('sug').style.display = 'none'; sugWhich = null; }
function pickStation(i, which) {
  state[which] = i;
  (which === 'from' ? $('rFrom') : $('rTo')).value = ST.D[i];
  hideSug();
}
$('sug').addEventListener('mousedown', ev => {
  const it = ev.target.closest('.sug-it');
  if (it && sugWhich) { ev.preventDefault(); pickStation(+it.dataset.i, sugWhich); }
});
function bindInput(which) {
  const input = which === 'from' ? $('rFrom') : $('rTo');
  input.addEventListener('input', debounce(() => doSuggest(which), 110));
  input.addEventListener('focus', () => doSuggest(which));
  input.addEventListener('keydown', ev => {
    if (ev.key === 'Enter') {
      ev.preventDefault();
      if (sugItems.length && sugWhich === which) { pickStation(sugItems[0].i, which); $('rTo').focus(); }
      else doSearch();
    } else if (ev.key === 'Escape') hideSug();
  });
  input.addEventListener('blur', () => setTimeout(hideSug, 130));
}
bindInput('from'); bindInput('to');

/* ══════════════════ 结果渲染 ══════════════════ */
const TYPE_JA = { Nozomi: 'のぞみ', Hikari: 'ひかり', Kodama: 'こだま', Tsubasa: 'つばさ', Hayabusa: 'はやぶさ', Komachi: 'こまち', Asama: 'あさま', Kagayaki: 'かがやき', Yamabiko: 'やまびこ', Toki: 'とき', Tanigawa: 'たにがわ', Nasuno: 'なすの', Hakutaka: 'はくたか', Hayate: 'はやて', Mizuho: 'みずほ', Sakura: 'さくら', Tsubame: 'つばめ', Kamome: 'かもめ', Tsurugi: 'つるぎ' };
function typeJa(ty) { const n = TYPES[ty] ? TYPES[ty][0] : ''; return TYPE_JA[n] || n; }
function typeZh(ty) { return TYPES[ty] ? TYPES[ty][1] : ''; }
/* 乘车区间内的「主导线路」= 区间线路众数, 平局取里程大者。
   不能直接用全程众数: 直通运行会把「大船→鎌倉」的横須賀線误标成総武線,
   把「新宿→大船」的湘南新宿ライン误标成高崎線。 */
function legLine(ti, board, alight) {
  const t = TM.T[ti], L = t[1], K = t[2];
  const cnt = new Map(), km = new Map();
  let best = -1, bestN = 0, bestK = -1;
  for (let i = board; i < alight; i++) {
    const li = L[i];
    if (li < 0) continue;
    const n = (cnt.get(li) || 0) + 1, k = (km.get(li) || 0) + K[i];
    cnt.set(li, n); km.set(li, k);
    if (n > bestN || (n === bestN && k > bestK)) { bestN = n; bestK = k; best = li; }
  }
  return best >= 0 ? best : tmapLine[ti];
}
function lineName(ti, b, a) { const li = (b == null) ? tmapLine[ti] : legLine(ti, b, a); return li >= 0 ? LINES[li] : null; }
function lineColorOf(ti, b, a) { const li = (b == null) ? tmapLine[ti] : legLine(ti, b, a); return li >= 0 && LINES[li][2] ? LINES[li][2] : '#4f8ef7'; }
/* 列车爱称: tmap 的 TN 表按种别取 */
function trainName(ti, ty) {
  const TN = TM.T[ti][4];
  if (!TN) return '';
  const ic = TYPES[ty] ? TYPES[ty][0] : '';
  return TN[ic] || TN['_'] || '';
}
function renderResult(res) {
  const t = T();
  const cur = res.cands[res.idx].r;
  const depS = fmtMin(cur.dep), arrS = fmtMin(cur.arr);
  const durS = fmtDur(cur.arr - cur.dep);
  let html = '<div class="sum-head">' +
    '<div class="sum-t"><span class="tm">' + depS + '</span><span class="lb">' + t.sumDep + '</span></div>' +
    '<span class="sum-arw">→</span>' +
    '<div class="sum-t"><span class="tm">' + arrS + '</span><span class="lb">' + t.sumArr + '</span></div>' +
    '</div>' +
    '<div class="sum-stats">' +
    '<div class="stat"><i>' + t.sumDur + '</i><b>' + durS + '</b></div>' +
    '<div class="stat"><i>' + t.sumXfr + '</i><b>' + xfrLabel(cur.xfr) + '</b></div>' +
    '<div class="stat"><i>' + t.sumKm + '</i><b>' + cur.km.toFixed(1) + ' ' + t.kmUnit + '</b></div>' +
    '</div>';
  if (res.note) html += '<div class="sum-note">' + esc(res.note) + '</div>';
  $('sumBar').innerHTML = html;
  $('dTitle').textContent = fmtMinRaw(cur.dep) + ' → ' + fmtMinRaw(cur.arr) + ' · ' + durS;
  /* 方案卡 */
  $('routes').innerHTML = res.cands.map((c, i) => {
    const r = c.r;
    const tg = c.tag === 'fast' ? t.tagFast : c.tag === 'easy' ? t.tagEasy : t.tagAlt;
    const cls = c.tag === 'fast' ? '' : ' g';
    /* 线路色条: 按区间营业里程分配宽度, 换乘处自然分段 */
    let bar = '';
    if (r.legs && r.legs.length) {
      const segs = r.legs.map(lg => {
        let km = 0; const K = TM.T[lg.tmap][2];
        if (K) for (let k = lg.board; k < lg.alight; k++) km += (K[k] || 0);
        return { c: lineColorOf(lg.tmap, lg.board, lg.alight), km: Math.max(km / 10, 0.2) };
      });
      const tot = segs.reduce((a, b) => a + b.km, 0) || 1;
      bar = '<div class="rbar">' + segs.map(s =>
        '<i style="flex:' + (s.km / tot * 100).toFixed(2) + ';background:' + esc(s.c) + '"></i>').join('') + '</div>';
    }
    return '<div class="rcard' + (i === res.idx ? ' on' : '') + '" data-i="' + i + '">' + bar +

      const segJa = L[i] >= 0 && LINES[L[i]] ? LINES[L[i]][0] : null;
      let idxArr = segJa ? legGeomIdx(ST.N[S[i]], ST.N[S[i + 1]], segJa) : null;
      if ((!idxArr || !idxArr.length) && lineNameJa) idxArr = legGeomIdx(ST.N[S[i]], ST.N[S[i + 1]], lineNameJa);
      if (idxArr && idxArr.length) {
        for (const fi of idxArr) feats.push({ type: 'Feature', properties: { color }, geometry: SEG.features[fi].geometry });
      } else {
        feats.push({ type: 'Feature', properties: { color }, geometry: { type: 'LineString', coordinates: [ST.S[S[i]], ST.S[S[i + 1]]] } });
      }
    }
  }
  if (r.finalWalk) walkFeats.push({ type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: [ST.S[r.finalWalk[0]], ST.S[r.to]] } });
  /* 有径路 → 全网灰化, 只保留径路彩色(初次进入时保持原样) */
  const dim = feats.length > 0;
  if (dim !== mapDim && mapReady) { mapDim = dim; refreshTrackColors(); }
  try {
    map.getSource('hl').setData({ type: 'FeatureCollection', features: feats });
    map.getSource('hlwalk').setData({ type: 'FeatureCollection', features: walkFeats });
    map.getSource('hl-sta').setData({ type: 'FeatureCollection', features: pts });
  } catch (e) { return; }
  let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  const acc = c => {
    if (!c) return;
    if (typeof c[0] === 'number') { if (c[0] < minX) minX = c[0]; if (c[0] > maxX) maxX = c[0]; if (c[1] < minY) minY = c[1]; if (c[1] > maxY) maxY = c[1]; }
    else for (const cc of c) acc(cc);
  };
  for (const f of feats) acc(f.geometry.coordinates);
  for (const f of walkFeats) acc(f.geometry.coordinates);
  for (const p of pts) acc(p.geometry.coordinates);
  if (minX <= maxX) {
    /* 移动端: 抽屉占据下半屏, 径路聚焦到抽屉以上的可见区域 */
    const pad = isMobileView()
      ? { top: 64, left: 26, right: 26, bottom: detailVisible()
          ? Math.round(($('sheetDetail').offsetHeight || 300) + 24)
          : ($('sheetMain').classList.contains('collapsed') ? 140 : Math.round(window.innerHeight * 0.5)) }
      : { top: 44, left: Math.round(($('panel').offsetWidth || 400) + 56), right: 44, bottom: 44 };
    map.fitBounds([[minX, minY], [maxX, maxY]], { padding: pad, maxZoom: 12, duration: 900 });
  }
}

/* ══════════════════ hash 持久化 + 启动 ══════════════════ */
function stateHash() {
  if (state.from == null || state.to == null) return;
  const p = new URLSearchParams();
  /* 写显示名 D 而非规范名 N: 重名站(大宮(埼玉県)/大宮(京都府))只有 D 能区分,
     用 N 会让分享出去的链接在下次打开时解析到错误的同名站。 */
  p.set('f', ST.D[state.from]); p.set('t', ST.D[state.to]);
  p.set('m', state.mode); p.set('d', state.day);
  /* 只在非默认时写入, 保持链接简短 */
  const cb = CAT_KEY.map(k => state.catOn[k] ? '1' : '0').join('');
  if (cb !== '11111') p.set('c', cb);
  if (state.maxXfr !== 5) p.set('x', state.maxXfr);
  if (state.mode === 'dep' || state.mode === 'arr') p.set('tm', minToTime(timeToMin($('depTime').value)));
  if (curResult) p.set('i', curResult.idx);
  history.replaceState(null, '', '#mjrj=' + p.toString());
}
function parseHash() {
  const h = location.hash;
  if (!h.startsWith('#mjrj=')) return false;
  let p;
  try { p = new URLSearchParams(h.slice(6)); } catch (e) { return false; }
  const f = nodeIdx(p.get('f') || ''), t = nodeIdx(p.get('t') || '');
  if (f < 0 || t < 0 || f === t) return false;
  state.from = f; state.to = t;
  $('rFrom').value = ST.D[f]; $('rTo').value = ST.D[t];
  const m = p.get('m'); if (['now', 'dep', 'first', 'last', 'arr'].indexOf(m) >= 0) setMode(m);
  const d = p.get('d'); if (['wd', 'sa', 'su'].indexOf(d) >= 0) { state.day = d; $('daySel').value = d; }
  /* c = 5 位种别开关位图(顺序同 CAT_KEY), x = 乗換上限 */
  /* 双向还原: 链接是权威来源, 否则本地存过关闭项时链接里的「开启」位无法覆盖 */
  const cb = p.get('c');
  if (cb && cb.length === CAT_N) for (let i = 0; i < CAT_N; i++) state.catOn[CAT_KEY[i]] = cb[i] !== '0';
  const xv = +p.get('x'); if ([3, 5, 7].indexOf(xv) >= 0) state.maxXfr = xv;
  syncOptUI();
  if (p.get('tm')) { $('depTime').value = p.get('tm'); state.depTime = timeToMin(p.get('tm')); }
  return true;
}
(async function bootRun() {
  try {
    await loadData();
    buildTypeFlags();
    loadOpt();                       /* 恢复上次选择的列车种别 / 乗換上限 */
    buildIndexes();
    prepRuntime();
    buildSegIndex();
    setMode(state.mode);          /* 必须: timeWrap 的 show 由 setMode 控制 */
    state.day = todayDayMode();
    $('daySel').value = state.day;
    const now5 = Math.floor(nowMin() / 5) * 5;
    $('depTime').value = minToTime(now5);
    state.depTime = now5;
    syncClr();
    if (parseHash()) doSearch();
    syncClr();
  } catch (e) {
    console.error(e);
    $('lmsg').textContent = T().errData;
    const b = document.createElement('button');
    b.className = 'mchip'; b.textContent = T().retry; b.style.marginTop = '4px';
    b.onclick = () => location.reload();
    $('loader').appendChild(b);
    return;
  }
  $('loader').classList.add('done');
  setTimeout(() => { $('loader').style.display = 'none'; initMap(); }, 480);
})();
/* ══════════════════ 层级菜单: 詳細条件 折叠/展开 ══════════════════ */
(function () {
  const tg = $('optToggle'), col = $('optCollapse');
  if (!tg || !col) return;
  const KEY = 'mjrj_optopen';
  const isWide = () => window.matchMedia('(min-width:900px)').matches;
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) { }
  function applyAnim(v) {
    tg.setAttribute('aria-expanded', v ? 'true' : 'false');
    col.classList.toggle('open', v);
    try { localStorage.setItem(KEY, v ? '1' : '0'); } catch (e) { }
  }
  /* 首次访问: 桌面展开、移动端收起(释放空间) */
  applyAnim(saved === null ? isWide() : saved === '1');
  tg.addEventListener('click', () => {
    applyAnim(tg.getAttribute('aria-expanded') !== 'true');
    /* 移动端抽屉折叠态下展开条件会改变高度 → 重算留白 */
    if ($('sheetMain').classList.contains('collapsed')) setTimeout(() => setCollapsed(true), 400);
    else setTimeout(() => { if (curResult) highlightOnMap(curResult.cands[curResult.idx].r); }, 400);
  });
})();

/* ══════════════════ 输入框清除按钮 ══════════════════ */
function syncClr() {
  [['rFrom', 'from'], ['rTo', 'to']].forEach(p => {
    const el = $(p[0]); if (!el) return;
    const f = el.closest('.sfield'); if (!f) return;
    f.classList.toggle('has-v', !!el.value);
  });
}
['rFrom', 'rTo'].forEach(id => {
  const el = $(id); if (!el) return;
  el.addEventListener('input', syncClr);
  el.addEventListener('change', syncClr);
});
document.querySelectorAll('.clr').forEach(b => b.addEventListener('click', () => {
  const isFrom = b.dataset.clr === 'from';
  const el = $(isFrom ? 'rFrom' : 'rTo');
  el.value = '';
  if (isFrom) state.from = null; else state.to = null;
  syncClr(); el.focus();
  $('result').classList.remove('show');
  stateHash();
}));

/* ══════════════════ Apple Maps 式两级抽屉 ══════════════════ */
let detailState = 'hidden';               /* hidden | medium | full */
const detailVisible = () => detailState !== 'hidden' && isMobileView();
function openDetail() {
  if (!isMobileView()) return;
  const m = $('sheetMain'), d = $('sheetDetail');
  m.classList.remove('collapsed');
  m.classList.add('stowed');              /* 隐藏上一级(带输入框的)主抽屉 */
  d.setAttribute('aria-hidden', 'false');
  detailState = 'full';
  d.classList.add('show'); d.classList.remove('medium');
  d.style.removeProperty('transform');
  setTimeout(() => { if (curResult) highlightOnMap(curResult.cands[curResult.idx].r); }, 420);
}
function closeDetail() {
  const m = $('sheetMain'), d = $('sheetDetail');
  detailState = 'hidden';
  d.classList.remove('show', 'medium');
  d.style.removeProperty('transform');
  d.setAttribute('aria-hidden', 'true');
  m.classList.remove('stowed');
  setTimeout(() => { if (curResult) highlightOnMap(curResult.cands[curResult.idx].r); }, 420);
}
$('backBtn').addEventListener('click', () => { closeDetail(); });
/* 点概要区也可进入详情(更大的点击目标) */
$('sumBar').addEventListener('click', () => {
  if (isMobileView() && curResult && !detailVisible()) openDetail();
});
/* 详情抽屉把手: 点击在 full↔medium 间切换, medium 再点则关闭回到主抽屉; 可拖拽 */
(function () {
  const g = $('dgrip'), d = $('sheetDetail');
  let y0 = 0, base = 0, dragging = false, moved = false;
  const H = () => d.offsetHeight || 1;
  const medOff = () => Math.max(110, H() - Math.round(window.innerHeight * 0.34));
  const curOff = () => detailState === 'full' ? 0 : medOff();
  g.addEventListener('pointerdown', e => {
    if (!isMobileView() || detailState === 'hidden') return;
    dragging = true; moved = false; y0 = e.clientY; base = curOff();
    try { g.setPointerCapture(e.pointerId); } catch (err) { }
  });
  g.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dy = e.clientY - y0;
    if (!moved && Math.abs(dy) > 7) { moved = true; d.classList.add('dragging'); }
    if (!moved) return;
    d.style.transform = 'translateY(' + Math.min(H(), Math.max(0, base + dy)) + 'px)';
  });
  const end = e => {
    if (!dragging) return; dragging = false;
    d.classList.remove('dragging'); d.style.removeProperty('transform');
    if (!moved) {
      if (detailState === 'full') { detailState = 'medium'; d.classList.add('medium'); }
      else closeDetail();
      setTimeout(() => { if (curResult) highlightOnMap(curResult.cands[curResult.idx].r); }, 420);
      return;
    }
    const off = Math.min(H(), Math.max(0, base + (e.clientY - y0)));
    if (detailState === 'full') {
      /* 一次拖过「关闭阈值」→ 直接关闭(Apple Maps 式连续拖拽); 否则落到 medium 档 */
      if (off > medOff() + 90) closeDetail();
      else if (off > medOff() * 0.45) { detailState = 'medium'; d.classList.add('medium'); }
    } else {
      if (off > medOff() + 90) closeDetail();
      else { detailState = 'full'; d.classList.remove('medium'); }
    }
    setTimeout(() => { if (curResult) highlightOnMap(curResult.cands[curResult.idx].r); }, 420);
  };
  g.addEventListener('pointerup', end);
  g.addEventListener('pointercancel', end);
})();
/* 视口切到桌面时复位抽屉层级 */
window.addEventListener('resize', () => { if (!isMobileView() && detailState !== 'hidden') closeDetail(); });

/* ══════════════════ 过滚守卫(旧版 iOS 兜底) ══════════════════
   现代浏览器靠 overscroll-behavior:contain 收当过滚; iOS<16 不支持该属性,
   这里在滚动容器边界 preventDefault, 阻断滚动手势链到根(橡皮筋黑边)。
   地图/把手区域放行(地图自管手势, 把手用指针事件拖拽)。 */
(function () {
  if (!('ontouchstart' in window)) return;
  function scroller(el) {
    while (el && el !== document.body && el !== document.documentElement) {
      const cs = getComputedStyle(el);
      if (/auto|scroll/.test(cs.overflowY) || /auto|scroll/.test(cs.overflowX)) return el;
      el = el.parentElement;
    }
    return null;
  }
  let sy = 0, sx = 0, el = null;
  document.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) { el = null; return; }
    sy = e.touches[0].clientY; sx = e.touches[0].clientX;
    const t = e.target;
    el = (t instanceof Element && !t.closest('#map,#grip,#dgrip')) ? scroller(t) : null;
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (!el || e.touches.length !== 1) return;
    const dy = e.touches[0].clientY - sy, dx = e.touches[0].clientX - sx;
    const cs = getComputedStyle(el);
    const canY = /auto|scroll/.test(cs.overflowY), canX = /auto|scroll/.test(cs.overflowX);
    let stop = false;
    if (canY && ((dy > 0 && el.scrollTop <= 0) || (dy < 0 && el.scrollTop + el.clientHeight >= el.scrollHeight - 1))) stop = true;
    if (canX && ((dx > 0 && el.scrollLeft <= 0) || (dx < 0 && el.scrollLeft + el.clientWidth >= el.scrollWidth - 1))) stop = true;
    if (stop) e.preventDefault();
  }, { passive: false });
})();
